<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Reformist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{
  --bg:#E4E8E0;--surface:#F6F7F2;--surface2:#ECEFE7;--ink:#1D201C;--muted:#575E55;--line:#C5CBBE;
  --sea:#1A3550;--sea2:#234565;--seaink:#D3DEE8;--land:#D7DBD0;--landline:#9AA39A;
  --stamp:#B42318;--khaki:#6B6A3E;--good:#2D6A3E;--warn:#8F5B00;--bad:#B42318;--shade:rgba(16,24,20,.55);
  --f-sten:'Saira Stencil One','Arial Black',Impact,sans-serif;
  --f-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-type:'Courier Prime','Courier New',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C;--surface:#152029;--surface2:#1B2833;--ink:#E3E8E0;--muted:#9AA59B;--line:#2B3B48;
  --sea:#0A1520;--sea2:#11202E;--seaink:#9FB2C4;--land:#2B3946;--landline:#4A5C6C;
  --stamp:#F0705F;--khaki:#BDB77A;--good:#6CC08A;--warn:#E3A94A;--bad:#F0705F;--shade:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C;--surface:#152029;--surface2:#1B2833;--ink:#E3E8E0;--muted:#9AA59B;--line:#2B3B48;
  --sea:#0A1520;--sea2:#11202E;--seaink:#9FB2C4;--land:#2B3946;--landline:#4A5C6C;
  --stamp:#F0705F;--khaki:#BDB77A;--good:#6CC08A;--warn:#E3A94A;--bad:#F0705F;--shade:rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;font-variation-settings:'wdth' 96}
h1,h2,h3,h4{margin:0;line-height:1.08;font-family:var(--f-ui);font-variation-settings:'wdth' 72;font-weight:800;letter-spacing:.005em;text-wrap:balance}
h2{font-size:1.75rem}h3{font-size:1.3rem}h4{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.76rem}
.type{font-family:var(--f-type)}
.wrap{max-width:1320px;margin-inline:auto;padding:0 16px 48px}
.btn{border:2px solid var(--ink);background:var(--surface);padding:9px 14px;border-radius:3px;font-weight:700;line-height:1.2;text-align:center}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.15);background:var(--ink)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{padding:13px 22px;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:2px;padding:3px 9px;font-size:.8rem;background:var(--surface);white-space:nowrap}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--pc,var(--muted));flex:none}

/* ---------- judul ---------- */
.hero{background:var(--sea);color:#F2F4EE;margin:0 -16px;padding:34px 16px 30px;position:relative;overflow:hidden}
.hero .in{max-width:1320px;margin-inline:auto;display:grid;gap:14px;position:relative}
.hero h1{font-family:var(--f-sten);font-weight:400;font-size:clamp(3.3rem,13.5vw,10.5rem);line-height:.82;letter-spacing:.01em;color:#F2F4EE;font-variation-settings:normal}
.hero h1 span{display:block}
.hero .stamp{position:absolute;right:2%;top:6px;transform:rotate(-8deg);border:4px solid #F0705F;color:#F0705F;font-family:var(--f-sten);font-size:clamp(1.6rem,5vw,3.2rem);padding:2px 14px;line-height:1;opacity:.92}
.hero .lead{max-width:60ch;font-family:var(--f-type);font-size:1.02rem;color:#D3DEE8;line-height:1.6}
.hero .tick{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-type);font-size:.9rem;color:#9FB2C4}
.hero .tick b{color:#F2F4EE;font-weight:700}
.hero svg.bgmap{position:absolute;right:-4%;bottom:-18%;width:min(900px,95%);opacity:.13;pointer-events:none}
.hero svg.bgmap path{fill:#D3DEE8}
.step{margin-top:28px;display:grid;gap:12px}
.step>h3{display:flex;gap:12px;align-items:baseline}
.step>h3 .n{font-family:var(--f-sten);font-weight:400;color:var(--stamp);font-size:1.6rem}
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.pcard{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:0;overflow:hidden;display:grid;min-width:0}
.pcard .phead{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px;align-items:center;border-bottom:6px solid var(--pc)}
.pcard .phead h4{font-size:1.25rem}
.pcard .body{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.branches{display:grid;gap:4px;font-size:.84rem}
.branches div{display:flex;gap:6px;align-items:center}
.lgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.lcard{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:12px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.lcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.lcard b{display:block;font-size:1rem;line-height:1.2}
.trait{display:inline-block;margin-top:4px;font-size:.78rem;border-left:3px solid var(--stamp);padding-left:6px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.seg button{text-align:left;padding:10px 12px;border:2px solid var(--line);background:var(--surface);border-radius:3px;display:grid;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
details.how{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px 14px}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:10px 0 0;padding-left:1.1em;display:grid;gap:6px}
footer.fine{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:grid;gap:4px;max-width:90ch}

/* ---------- strip atas ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px;background:var(--sea);color:#E8EDF2;border-bottom:3px solid var(--stamp)}
.top .r1{max-width:1320px;margin-inline:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-family:var(--f-sten);font-size:1.25rem;line-height:1;margin-right:4px;color:#F2F4EE}
.date{font-family:var(--f-type);font-weight:700;font-size:1.05rem;color:#fff}
.era{font-size:.78rem;border:1px solid #6F8BA6;padding:2px 8px;border-radius:2px;color:#C9D6E3}
.stat{display:grid;line-height:1.1;min-width:58px}
.stat .k{font-size:.7rem;color:#9FB2C4}
.stat .v{font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums;font-variation-settings:'wdth' 80}
.stat .v.bad{color:#FF9A8B}.stat .v.good{color:#8FE0A8}
.meter{width:58px;height:5px;background:#304B66;border-radius:1px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:#E8EDF2}
.top .grow{flex:1 1 0;min-width:0}
.top .btn{border-color:#E8EDF2;background:transparent;color:#fff}
.top .btn.primary{background:#F2F4EE;color:var(--sea);border-color:#F2F4EE}
.top .btn:disabled{opacity:.4}
.ap{display:flex;gap:4px;align-items:center}
.ap i{width:12px;height:12px;border:2px solid #E8EDF2;border-radius:50%}
.ap i.on{background:#F2F4EE}
.timeline{max-width:1320px;margin-inline:auto;padding:0 16px 7px;display:grid;grid-template-columns:repeat(var(--tn),1fr);gap:1px;position:relative}
.timeline i{height:6px;background:#304B66}
.timeline i.past{background:#7F99B3}
.timeline i.now{background:#fff}
.timeline i.key{background:#F0705F}
.timeline i.key.past{background:#A65A50}
.flash{margin-top:12px;padding:9px 12px;border-left:5px solid var(--stamp);background:var(--surface);font-family:var(--f-type);min-height:2.6em}

/* ---------- papan ---------- */
.board{display:grid;gap:16px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.board{grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px;display:grid;gap:12px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mapcard{padding:0;overflow:hidden;gap:0}
.mapcard .mbar{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.mapwrap{background:var(--sea);position:relative}
.mapsvg{display:block;width:100%;height:auto;max-height:66vh}
.mapsvg .pv{stroke:var(--sea);stroke-width:.6;stroke-linejoin:round;cursor:pointer;vector-effect:non-scaling-stroke}
.mapsvg .pv:hover{stroke:#fff;stroke-width:1.4}
.mapsvg .pv.sel{stroke:#fff;stroke-width:2.6}
.mapsvg .pv.gone{fill:url(#hatch);cursor:not-allowed}
.mapsvg text{font-family:var(--f-ui);font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(10,20,30,.75);stroke-width:2.2px;pointer-events:none;font-variation-settings:'wdth' 75}
.legend{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
.ramp{display:inline-block;width:110px;height:9px;vertical-align:middle;border:1px solid var(--line)}
.pinfo{padding:12px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.pinfo h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px 12px;font-size:.8rem}
.demo div{display:grid;gap:2px}
.demo i{display:block;height:5px;background:var(--surface2);border:1px solid var(--line)}
.demo i b{display:block;height:100%;background:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);border-radius:3px 3px 0 0}
.tabs button[aria-selected="true"]{color:var(--surface);background:var(--ink)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:5.6em minmax(0,1fr) 4.9em;align-items:center;gap:8px;font-size:.86rem}
.bar .lb{font-weight:800;font-variation-settings:'wdth' 75;display:flex;gap:4px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.bar .tr{height:13px;background:var(--surface2);position:relative}
.bar .tr i{display:block;height:100%;background:var(--pc);min-width:2px}
.bar .tr u{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink);opacity:.5}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums}
.bar.me .lb{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.acts{display:grid;gap:7px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:var(--surface);text-align:left;width:100%}
.act:hover:not(:disabled){border-color:var(--ink);background:var(--surface2)}
.act:disabled{opacity:.48;cursor:not-allowed}
.act .nm{font-weight:700}
.act .bl{grid-column:1;font-size:.82rem;color:var(--muted)}
.act .cs{grid-row:1/span 2;grid-column:2;text-align:right;font-size:.8rem;display:grid;gap:2px;justify-items:end;font-variant-numeric:tabular-nums}
.act.big{border:2px solid var(--stamp);background:color-mix(in srgb,var(--stamp) 7%,var(--surface))}
.act.decree{border-left:6px solid var(--pc)}
.sect{font-weight:800;font-size:.95rem;margin-top:6px;font-variation-settings:'wdth' 75;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.where{font-size:.82rem;padding:6px 10px;background:var(--surface2);border-left:4px solid var(--ink)}
.log{display:grid;gap:7px;max-height:520px;overflow:auto;padding:0;margin:0}
.log li{list-style:none;display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:8px;font-size:.88rem;font-family:var(--f-type)}
.log .w{color:var(--muted);font-size:.78rem}
.log li.key span{font-weight:700}
.reqs{display:grid;gap:3px;font-size:.8rem;margin-top:4px}
.reqs span{display:flex;gap:6px}
.reqs .ok{color:var(--good)}.reqs .no{color:var(--bad)}
.tree{display:grid;gap:10px}
.tnode{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--surface)}
.tnode.cur{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tnode.past{opacity:.6}
.tnode.lock{background:var(--surface2)}
.tnode .ending{font-size:.8rem;color:var(--muted)}
.tnode.child{margin-left:28px;position:relative}
.tnode.child::before{content:'';position:absolute;left:-18px;top:-10px;bottom:50%;width:14px;border-left:2px solid var(--line);border-bottom:2px solid var(--line)}
.tnode.child2{margin-left:56px}
.figs{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.fig{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-size:.85rem;border:1px solid var(--line);padding:8px;border-radius:3px;background:var(--surface)}
.fig b{display:block;font-size:.92rem;line-height:1.2}
.fig.out{opacity:.5}
.party-head{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- modal kawat ---------- */
.veil{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow-y:auto;overscroll-behavior:contain}
.veil>.modal{margin:auto 0}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:2px;max-width:600px;width:100%;padding:0;display:grid;box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.modal.wide{max-width:980px}
.modal .mh{background:var(--sea);color:#E8EDF2;padding:10px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--f-type);font-size:.88rem;flex-wrap:wrap}
.modal .mb{padding:16px 18px 18px;display:grid;gap:12px}
.modal h2{font-size:1.65rem}
.modal .story{font-family:var(--f-type);line-height:1.62;font-size:.97rem}
.modal .story p+p{margin-top:8px}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:3px;display:grid;gap:2px}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--surface2)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice b{font-weight:700}
.choice small{color:var(--muted)}
.stampbox{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-sten);padding:0 10px;transform:rotate(-4deg);font-size:1.15rem;line-height:1.3}
.waffle{display:grid;grid-template-columns:repeat(50,minmax(0,1fr));gap:2px}
.waffle i{aspect-ratio:1;background:var(--pc,var(--line));border-radius:1px}
.res-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.res-line>div{border:1px solid var(--line);padding:10px 12px;display:grid;gap:2px;background:var(--surface2)}
.res-line .v{font-weight:800;font-size:1.9rem;line-height:1;font-variation-settings:'wdth' 70;font-variant-numeric:tabular-nums}
.plist{display:grid;gap:7px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:var(--surface)}
.prow .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font-size:.74rem;padding:1px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.st.ok{color:var(--good)}.st.no{color:var(--bad)}.st.mid{color:var(--warn)}.st.na{color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border:2px solid var(--ink);background:var(--surface);border-radius:3px;font-weight:800}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2.2em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tally>div{padding:10px 12px;border:2px solid var(--line);display:grid;gap:2px;align-content:start}
.tally .v{font-size:2.2rem;font-weight:800;line-height:1;font-variation-settings:'wdth' 70;font-variant-numeric:tabular-nums}

/* ---------- akhir ---------- */
.endwrap{max-width:860px;margin:28px auto 0;display:grid;gap:18px}
.endhead{background:var(--sea);color:#F2F4EE;padding:26px 22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border-bottom:6px solid var(--pc)}
.endhead h1{font-family:var(--f-sten);font-weight:400;font-size:clamp(2.2rem,7vw,4.4rem);line-height:.9;font-variation-settings:normal}
.endhead .sub{font-family:var(--f-type);color:#C9D6E3}
.epi{font-family:var(--f-type);font-size:1.02rem;line-height:1.7;display:grid;gap:12px;max-width:68ch}
.themebtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:3px;padding:7px 12px;font:700 .82rem var(--f-ui);box-shadow:3px 3px 0 var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .modal.enter{animation:drop .22s ease-out}
  .hero:not(.anim) h1 span{animation:none!important}
  @keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
  .hero h1 span{animation:spray .7s ease-out both}
  .hero h1 span+span{animation-delay:.18s}
  @keyframes spray{from{opacity:0;filter:blur(6px);letter-spacing:.08em}to{opacity:1;filter:none}}
}
@media (max-width:640px){.top .r1{gap:6px 12px}.stat{min-width:48px}.brand{display:none}}

/* ---------- zoom peta ---------- */
.mapsvg{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapsvg:active{cursor:grabbing}
.mapsvg text{font-size:var(--fs,7.8px);stroke-width:calc(var(--fs,7.8px)*.28)}
.mapsvg[data-z="far"] .ln,.mapsvg[data-z="near"] .ls,.mapsvg[data-z="far"] .ls.sm{display:none}
.mapsvg .pj rect{fill:#fff;stroke:var(--sea);stroke-width:.8}
.mapsvg .pj.mine rect{fill:#F0C02C}
.mapwrap{position:relative}
.zctl{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:4px;background:rgba(10,20,30,.55);padding:4px;border-radius:3px}
.zctl button{width:32px;height:32px;border:1.5px solid #E8EDF2;background:transparent;color:#fff;font-weight:800;font-size:1.1rem;border-radius:2px}
.zctl button:hover{background:rgba(255,255,255,.15)}
.zctl span{color:#E8EDF2;font-size:.75rem;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
/* ---------- parlemen ---------- */
.parl{display:grid;gap:8px}
.parlh{display:grid}
.hemi{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.hemiwrap{max-width:560px;width:100%;margin:0 auto}
.hemin{font-family:var(--f-ui);font-weight:800;font-size:.22px;fill:var(--ink);font-variation-settings:'wdth' 70}
.blocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.blocs .bn{font-size:.95rem}
.blocs ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px;font-size:.88rem}
.blocs li{display:flex;align-items:center;gap:6px}

.blocs .me{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
/* ---------- kebijakan ---------- */
.axis{display:grid;gap:3px}
.axh{display:flex;justify-content:space-between;font-size:.88rem}
.axt{display:grid;grid-template-columns:6.6em 1fr 6.6em;gap:8px;align-items:center;font-size:.76rem;color:var(--muted)}
.axt span:last-child{text-align:right}
.axt i{position:relative;height:8px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));border:1px solid var(--line)}
.axt i::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px dashed var(--muted)}
.axt i b{position:absolute;top:-5px;width:6px;height:16px;margin-left:-3px;background:var(--stamp);border-radius:1px}
.pols{display:grid;gap:7px}
.pol{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:var(--surface)}
.pol.on{border-left:5px solid var(--good)}
.pol>div:first-child{display:grid;gap:2px}
.polb{display:grid;gap:5px}
.polb .btn{padding:6px 10px;font-size:.85rem}
.okc{color:var(--good)}.noc{color:var(--bad)}
/* ---------- ekonomi ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tiles>div{border:1px solid var(--line);background:var(--surface2);padding:8px 10px;display:grid;gap:1px}
.tiles b{font-size:1.45rem;line-height:1.05;font-variation-settings:'wdth' 72;font-variant-numeric:tabular-nums}
.spark{width:100%;height:24px;display:block;margin-top:2px}
.act.dis{opacity:.55}
.act .btn{padding:5px 10px;font-size:.82rem}
.prog{width:120px;height:8px;background:var(--surface2);border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--good)}
.trades{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.trade{border:1px solid var(--line);border-radius:3px;padding:10px;display:grid;gap:4px;align-content:start;background:var(--surface)}
.trade.on{border-left:5px solid var(--good)}
.trade .btn{padding:6px 10px;font-size:.84rem;justify-self:start}
@media (max-width:700px){.zctl button{width:30px;height:30px}.mapsvg{max-height:none}}

/* ---------- karier ---------- */
.who{display:grid;line-height:1.15;font-size:.82rem;max-width:200px}
.who b{color:#fff;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:#C9D6E3}
.gsep{width:1px;align-self:stretch;background:#3C5A78;margin:0 2px}
.namerow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.namerow input{font:inherit;padding:9px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--surface);color:var(--ink);min-width:min(100%,280px)}
.asalwrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.asalwrap{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.asalmap{width:100%;height:auto;background:var(--sea);border-radius:3px;display:block}
.asalmap path{fill:var(--land);stroke:var(--sea);stroke-width:.6;cursor:pointer;vector-effect:non-scaling-stroke}
.asalmap path:hover{fill:color-mix(in srgb,var(--stamp) 35%,var(--land))}
.asalmap path.on{fill:var(--stamp)}
.asalside{display:grid;gap:8px;align-content:start}
.asalside select{font:inherit;padding:8px}
.mapsvg .home{fill:#FFD34D;stroke:#1A1A1A;stroke-width:.6}
.facs{display:grid;gap:7px}
.fac{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--surface)}
.fmeta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.fmeta .fbar{width:110px}
.fac>div{display:grid}
.fbar{height:8px;background:var(--surface2);border:1px solid var(--line)}
.fbar i{display:block;height:100%;background:var(--ink)}
.fac .btn{padding:5px 10px;font-size:.84rem}

.sched{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:.88rem}
.sched li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:10px;border-bottom:1px dotted var(--line);padding-bottom:4px}
@media (max-width:640px){.sched li{grid-template-columns:1fr}}
@media (max-width:700px){.top{position:static}.stat .meter{display:none}}

/* ====================== TEMA STRATEGI ====================== */
:root,:root[data-theme],:root:not([data-theme="light"]){
  --bg:#0c1218;--surface:#151e26;--surface2:#1c2731;--ink:#ebe4d2;--muted:#9aa49d;--line:#2f3f4c;
  --sea:#0d1822;--sea2:#122130;--seaink:#9fb2c4;--land:#2b3631;--landline:#4a5a50;
  --stamp:#e2604c;--khaki:#b7ad78;--good:#7fcf95;--warn:#e7b04f;--bad:#f07a66;--shade:rgba(3,6,10,.62);--gold:#c9a24a;color-scheme:dark}
body{background:var(--bg)}
.btn{border-color:var(--gold);color:var(--ink);background:var(--surface2)}
.btn.primary{background:var(--gold);color:#16120a;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){background:#dbb65c}
.hero{background:radial-gradient(ellipse at 70% 30%,#1b3346 0%,#0b1520 70%)}
.pcard,.lcard,.seg button,details.how,.card,.act,.pol,.trade,.fac,.prow,.fig,.tnode{background:var(--surface);border-color:var(--line)}
.pcard[aria-pressed="true"],.lcard[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:4px 4px 0 var(--gold)}
button.chip[aria-pressed="true"]{background:var(--gold);color:#16120a;border-color:var(--gold)}
.tnode.cur{border-color:var(--gold);box-shadow:3px 3px 0 var(--gold)}
body.ingame{overflow:hidden}
body.ingame #app{height:100vh;height:100dvh}
#game{position:fixed;inset:0;overflow:hidden;background:var(--sea)}
#mapbox{position:absolute;inset:0;left:72px;transition:left .38s cubic-bezier(.2,.8,.2,1)}
#game.popen #mapbox{left:calc(72px + min(470px,calc(100vw - 72px)))}
#mapbox .mapsvg{width:100%;height:100%;max-height:none;display:block}
.mapsvg .seabg{fill:url(#none);fill:#0f1c27}
.mapsvg .grat line{stroke:#1a2e3f;stroke-width:.6;vector-effect:non-scaling-stroke}
.mapsvg .pv{fill:var(--land);stroke:#0b141c;stroke-width:.9;transition:fill .7s ease,stroke .2s;vector-effect:non-scaling-stroke}
.mapsvg .pv:hover{stroke:#f3e2b0;stroke-width:1.6}
.mapsvg .pv.sel{stroke:var(--gold);stroke-width:2.8}
.mapsvg .pv.gone{fill:url(#hatch)!important}








.mapsvg .labels text{fill:#e9dfc4;opacity:.85}
.mapsvg[data-z="near"] .labels text{font-size:calc(var(--fs)*1.05);opacity:.55;letter-spacing:.06em}
.mapsvg .base path{fill:#b7ad78;stroke:#1a1a10;stroke-width:.5}
.mapsvg .base text{font-size:3px;fill:#111;stroke:none;font-weight:800}
.mapsvg .flame path{fill:#ff7a45}
.mapsvg .flame .pulse{fill:none;stroke:#ff7a45;stroke-width:.8}
.mapsvg .riot{fill:none;stroke:#ff5a4a;stroke-width:1.2;vector-effect:non-scaling-stroke}
.mapsvg .pj rect{fill:#e8e2cf;stroke:#0b141c;stroke-width:.6}
.mapsvg .pj.mine rect{fill:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .mapsvg .flame .pulse,.mapsvg .riot{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(2.2)}}
}
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:stretch;gap:2px;padding:6px 10px 18px;background:linear-gradient(180deg,rgba(7,11,16,.96) 0%,rgba(7,11,16,.86) 70%,rgba(7,11,16,0) 100%);pointer-events:none;flex-wrap:wrap}

.gauge{height:8px;background:#26313a;border:1px solid #3a4a56;border-radius:4px;overflow:hidden}.gauge i{display:block;height:100%;transition:width .6s ease}

#rail{position:absolute;left:0;top:74px;bottom:0;width:72px;z-index:18;display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:linear-gradient(90deg,rgba(7,11,16,.92),rgba(7,11,16,.7));border-right:1px solid rgba(201,162,74,.25)}

#panel{position:absolute;left:72px;top:var(--hudh,74px);bottom:0;width:min(470px,calc(100vw - 72px));z-index:17;background:rgba(13,19,25,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-right:1px solid rgba(201,162,74,.35);display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:8px 0 24px rgba(0,0,0,.4)}

.px{background:transparent;border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:3px;font-size:1.2rem}

.pch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pch>div{display:grid}.pch b{font-size:1.05rem}

.minibars span{font-weight:800;font-variation-settings:'wdth' 75}.minibars i{height:7px;background:#26313a;display:block}.minibars i b{display:block;height:100%;transition:width .6s}

#mapctl{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:14;display:grid;justify-items:center;gap:4px;max-width:calc(100vw - 200px)}

.modes{display:flex;gap:2px;background:rgba(7,11,16,.85);border:1px solid rgba(201,162,74,.3);border-radius:4px;padding:3px;flex-wrap:wrap;justify-content:center}

@media (prefers-reduced-motion:no-preference){.toast{animation:tin .35s cubic-bezier(.2,.8,.2,1)}.toast.out{animation:tout .45s ease forwards}
 @keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}@keyframes tout{to{transform:translateX(30px);opacity:0}}
 .modal.enter{animation:pop .3s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
 .veil.enter{animation:fade .25s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
 #hud .v.up{animation:upc .9s ease}#hud .v.down{animation:dnc .9s ease}@keyframes upc{30%{color:#8FE0A8}}@keyframes dnc{30%{color:#FF9A8B}}
 #panel .pbody-in{animation:slidein .28s cubic-bezier(.2,.8,.2,1)}@keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}}

        'Para pendukung menyebutnya kemenangan wong cilik. Para pengkritik mencatat korupsi yang kini tersebar ke ratusan kabupaten, dan janji kesejahteraan yang berjalan lebih lambat daripada janji kebebasan.',
        'Satu hal tak bisa disangkal: untuk pertama kalinya dalam empat dekade, kekuasaan di Jakarta bisa berganti tanpa peluru.']},
 madani:{title:'Republik Madani',form:'ppp',sub:'Negara Pancasila dengan wajah santri',good:true,
   epi:['Madrasah dan pesantren mendapat anggaran setara sekolah negeri, bank syariah tumbuh di setiap kota, dan konstitusi tetap berdasar Pancasila.',
        'Kalangan Islamis menilai Anda terlalu kompromistis. Kalangan sekuler khawatir pada perda-perda moral yang mulai muncul di daerah. Pemilih tengah, sejauh ini, merasa cukup puas.',
        'Ka\'bah tetap di dinding kantor partai. Tapi pintunya kini terbuka untuk semua.']},
 terkelola:{title:'Demokrasi Terkelola',form:'golb',sub:'Orde Baru tanpa pemimpin besar',good:true,
   epi:['Pemilu tetap digelar, pers tetap bebas, tapi jaringan lama beringin menguasai hampir setiap kabupaten di luar Jawa.',
        'Ekonomi pulih lebih cepat dari perkiraan. Investor menyukai kepastian, birokrat menyukai kesinambungan, dan para aktivis 1998 bertanya-tanya untuk apa mereka turun ke jalan.',
        'Para sejarawan kelak menyebutnya transisi paling mulus di Asia Tenggara, atau restorasi paling cerdik, tergantung siapa yang menulis.']},
 plutokrasi:{title:'Negara Plutokrasi',form:'pkk',sub:'Indonesia Inc., dewan direksi sebuah republik',good:false,
   epi:['BUMN berpindah tangan ke konsorsium, Dewan Pertimbangan Agung diganti Dewan Korporasi, dan hak memilih kini berbobot sesuai pajak yang dibayar.',
        'Gedung-gedung tinggi tumbuh di Jakarta dan Surabaya. Kurs stabil, utang luar negeri direstrukturisasi, dan para pemilik modal pulang dari Singapura.',
        'Di luar pagar kawasan bisnis, upah buruh membeku dan tanah adat berganti menjadi konsesi. Negara berjalan seperti perusahaan: efisien bagi pemegang saham, dingin bagi yang lain.']},
 junta:{title:'Republik di Bawah Dewan',form:'dpn',sub:'Junta militer, keadaan darurat yang tak kunjung dicabut',good:false,
   epi:['Dewan Penyelamat Nasional membekukan DPR dan partai-partai, menunjuk gubernur dari kalangan perwira, dan menjanjikan pemilu "begitu keadaan memungkinkan".',
        'Jalanan sepi pada malam hari. Harga sembako terkendali lewat operasi pasar bersenjata, dan pers hanya memuat berita yang telah dibaca dua kali.',
        'Para pendukung menyebutnya penyelamatan dari kekacauan. Ribuan orang yang hilang, ditahan, atau mengungsi ke luar negeri menyebutnya dengan nama lain.']},
 ordebaru:{title:'Orde Baru Abadi',form:'gol',sub:'Pembangunan Jilid VIII',good:false,
   epi:['Krisis dilewati dengan darurat sipil, paket bantuan asing, dan kabinet yang hampir tak berubah. Sang Presiden tetap di Cendana; para pewarisnya menunggu giliran.',
        'Mahasiswa kembali ke ruang kuliah dengan diam. Media kembali hati-hati. Pembangunan dilanjutkan, begitu pula monopoli dan konsesi keluarga.',
        'Di buku pelajaran sejarah, tahun 1998 dicatat sebagai "masa kerusuhan yang berhasil diatasi". Hanya itu.']},
 sosialis:{title:'Republik Sosialis Indonesia',form:'prp',sub:'Proklamasi di Lapangan Banteng',good:false,
   epi:['Sektor strategis dinasionalisasi, tanah perkebunan dibagi kepada penggarap, dan dewan buruh duduk di ruang direksi pabrik.',
        'Petani di Jawa dan Sumatera untuk pertama kalinya memegang sertifikat tanah sendiri. Modal asing pergi, kurs anjlok, dan antrean minyak tanah kembali muncul di kota-kota.',
        'Republik baru ini harus memilih antara demokrasi dewan yang riuh atau disiplin partai yang keras. Pertengkaran itu, kata para kader tua, adalah tanda ia masih hidup.']},
 anarkis:{title:'Federasi Komune Nusantara',form:'smn',sub:'Indonesia tanpa negara',good:false,
   epi:['Jakarta tak lagi memerintah. Pulau-pulau diatur oleh kongres komune: pabrik dikelola pekerjanya, sawah oleh penggarapnya, kampung oleh warganya sendiri.',
        'Di beberapa tempat eksperimen ini berjalan mengejutkan baik. Di tempat lain, para bekas aparat dan preman mengisi kekosongan lebih cepat daripada dewan warga.',
        'Tak ada bendera resmi, tak ada presiden, tak ada ibu kota. Dunia luar tak tahu harus mengirim duta besar ke mana.']},
 rii:{title:'Republik Islam Indonesia',form:'pku',sub:'Konstitusi dengan tujuh kata',good:false,
   epi:['Amandemen mengembalikan kewajiban menjalankan syariat bagi pemeluknya ke dalam konstitusi. Majelis Syura negara mengawasi undang-undang, dan bank-bank beralih ke sistem bagi hasil.',
        'Para pendukung menyebutnya penuntasan janji 1945 yang tertunda. Provinsi-provinsi berpenduduk Kristen dan Hindu menuntut otonomi khusus, sebagian menuntut lebih dari itu.',
        'Pemilu tetap digelar lima tahun sekali. Yang berubah adalah apa yang boleh diperdebatkan di dalamnya.']},
 khilafah:{title:'Negara Islam Nusantara',form:'hkn',sub:'Wilayah kekhalifahan di timur dunia Islam',good:false,
   epi:['Seruan umat diikuti pembelotan perwira dan ulama. Partai-partai dibubarkan, Majelis Syura menunjuk amir, dan konstitusi diganti piagam baiat.',
        'Para pendukung merayakan berakhirnya sistem yang mereka anggap asing. Puluhan ribu warga non-Muslim dan Muslim yang menolak mengungsi atau memilih diam.',
        'Negara-negara tetangga menutup perbatasan, investor pergi, dan Indonesia yang dulu dikenal majemuk kini dikenal karena hal yang sangat berbeda.']},
 daulah:{title:'Daulah Fajar',form:'bfd',sub:'Kemenangan dari reruntuhan',good:false,
   epi:['Setelah bertahun-tahun konfrontasi bersenjata, aparat pusat runtuh di beberapa wilayah dan barisan bersenjata mengisi kekosongan dengan hukum darurat.',
        'Kemenangan ini dibayar dengan kota-kota yang hangus dan generasi yang tumbuh di pengungsian. Hampir tak ada negara yang mengakui pemerintahan baru.',
        'Sejarah mencatatnya bukan sebagai lahirnya negara, melainkan sebagai salah satu tragedi terpanjang di Asia Tenggara.']},
 ukhuwah:{title:'Republik Ukhuwah',form:'pkp',sub:'Kiai, pesantren, dan negara yang merangkul semua',good:true,
   epi:['Pesantren menjadi bagian resmi sistem pendidikan nasional, dana desa mengalir ke koperasi santri, dan presiden dari kalangan kiai membuka pintu istana untuk pendeta, biksu, dan tokoh adat.',
        'Para pendukung menyebutnya Islam yang ramah: religius tanpa memusuhi. Para pengkritik mencatat birokrasi yang lamban, keputusan yang berubah-ubah, dan jaringan keluarga pesantren yang ikut menikmati kekuasaan.',
        'Kaum Islamis menuduhnya terlalu lunak, kaum sekuler menuduhnya terlalu santri. Di desa-desa Jawa Timur, orang hanya berkata: akhirnya ada yang mengerti kami.']},
 amanat:{title:'Republik Amanat Reformasi',form:'par',sub:'Negara hukum, kampus, dan pasar yang jujur',good:true,
   epi:['Komisi antikorupsi bekerja dengan gigi tajam, peradilan dirombak, dan masa jabatan pejabat dibatasi ketat. Sekolah dan rumah sakit swasta Islam tumbuh bersama kelas menengah kota.',
        'Para pendukung menyebutnya reformasi yang tuntas. Para pengkritik mencatat bahwa partai ini kuat di kampus dan kota, tapi tak pernah benar-benar dipahami desa.',
        'Indonesia menjadi negara Muslim yang dikutip para ekonom dan ahli tata kelola. Apakah petani merasakan bedanya, itu soal lain.']},
 komunis:{title:'Republik Rakyat Indonesia',form:'pkn',sub:'Negara satu partai di bawah palu arit',good:false,
   epi:['Partai-partai lain dibubarkan ke dalam satu front nasional. Tanah perkebunan dan pabrik besar diambil alih, pertanian kolektif dibentuk, dan sejarah 1965 ditulis ulang dari sisi yang dulu kalah.',
        'Jutaan petani untuk pertama kalinya menggarap tanah tanpa tuan tanah. Di saat yang sama, ribuan lawan politik ditahan, pers hanya punya satu suara, dan dendam lama di desa-desa menemukan jalannya sendiri.',
        'Negara-negara Barat menjatuhkan sanksi, modal asing pergi, dan kurs runtuh. Republik baru ini selamat dari bulan-bulan pertamanya. Apakah ia bisa lebih baik dari rezim-rezim yang ditirunya, sejarah belum memutuskan.']},
 setara:{title:'Republik Bhinneka Setara',form:'ppb',sub:'Kesetaraan bagi semua warga',good:true,
   epi:['Undang-undang antidiskriminasi melindungi warga atas dasar agama, etnis, gender, dan orientasi seksual. Komisi kebenaran membuka arsip 1965, Tanjung Priok, dan Mei 1998. Kuota perempuan mengubah wajah parlemen.',
        'Bagi minoritas agama, etnis, dan seksual, ini pertama kalinya negara berdiri di pihak mereka. Bagi kalangan konservatif, ini pemaksaan nilai asing; protes besar mengguncang beberapa provinsi dan sebagian daerah menolak menjalankan undang-undangnya.',
        'Pertarungan budaya belum selesai, dan mungkin tak akan pernah. Tapi untuk pertama kalinya, pertarungan itu terjadi di pengadilan dan parlemen, bukan di jalanan.']},
 liberal:{title:'Republik Liberal Indonesia',form:'pdb',sub:'Pasar terbuka, pers bebas, negara yang ramping',good:true,
   epi:['Bank sentral independen, BUMN dilepas ke bursa, dan konstitusi diamandemen untuk menjamin kebebasan berpendapat dan berserikat. Investor kembali, kurs menguat, dan Jakarta dipenuhi gedung kantor baru.',
        'Kelas menengah kota merayakannya sebagai Indonesia yang akhirnya normal. Buruh dan petani mencatat hal lain: subsidi dicabut lebih cepat daripada lapangan kerja tercipta.',
        'Pemilu tetap riuh, media tetap galak, dan presiden bisa dimaki di televisi tanpa takut. Untuk sebagian orang itu sudah cukup. Untuk yang lain, kebebasan tanpa nasi terasa hampa.']},
 nusraya:{title:'Indonesia Raya Baru',form:'nusra',sub:'Negara kuat yang dipilih lewat kotak suara',good:false,
   epi:['Presiden purnawirawan memerintah dengan mandat besar dan tangan yang berat. Kedaulatan pangan, industri pertahanan, dan disiplin nasional menjadi semboyan setiap upacara.',
        'Pemilu tetap digelar dan dimenangkan dengan selisih lebar. Pengadilan, kepolisian, dan media perlahan belajar membaca suasana hati istana.',
        'Para pendukung menyebutnya ketegasan yang lama dirindukan. Para pengkritik menyebutnya Orde Baru yang belajar memenangkan pemilu.']},
 pecahan:{title:'Negara Pecahan',sub:'Wilayah yang memisahkan diri dari Jakarta',good:false,
   epi:['Ketika perang saudara memecah republik, wilayah yang Anda kuasai memilih jalannya sendiri. Bendera baru dikibarkan, mata uang darurat dicetak, dan perbatasan dijaga oleh barisan Anda sendiri.',
        'Jakarta tidak pernah mengakuinya. Beberapa negara tetangga mengirim utusan dagang, sebagian besar menunggu siapa yang bertahan.',
        'Di peta dunia, wilayah ini masih berwarna sama dengan Indonesia. Di lapangan, ceritanya sudah lain.']},
 karier:{title:'Karier',sub:'',good:true,epi:[]},
 kalah:{title:'Sejarah Berjalan Tanpa Anda',sub:'Partai Anda tidak memegang kekuasaan',good:false,fail:true,
   epi:['Republik melangkah ke abad baru dengan presiden yang bukan dari barisan Anda. Partai bertahan, kursi masih ada, tapi agenda besar tinggal di dalam laci.',
        'Kader-kader muda bertanya apakah kesempatan seperti 1998 akan datang lagi. Para kader tua tahu jawabannya.']},
 tumpas:{title:'Ditumpas',sub:'Jaringan partai hancur',good:false,fail:true,
   epi:['Kantor-kantor disegel, para pengurus ditangkap atau bersembunyi, dan nama gerakan Anda hanya tinggal di arsip intel.',
        'Beberapa tahun kemudian seorang wartawan menulis buku tentang Anda. Judulnya bertanya, bukan menjawab.']},
 bubar:{title:'Indonesia Bubar',sub:'Negara kehilangan kendali atas wilayahnya',good:false,fail:true,
   epi:['Stabilitas runtuh sepenuhnya. Provinsi-provinsi mengumumkan pemerintahan sendiri, tentara terpecah mengikuti komandan masing-masing, dan Jakarta hanya menguasai Jakarta.',
        'Tak ada yang menang dalam akhir seperti ini, termasuk Anda.']},
 digulingkan:{title:'Digulingkan',sub:'Kekuasaan yang tak bertahan',good:false,fail:true,
   epi:['Anda sempat memegang kekuasaan, tetapi tidak cukup lama untuk mengubah apa pun. Tank di depan istana, atau massa di depan gerbang, mengakhirinya dalam satu malam.',
        'Pemerintahan berikutnya membuka penyelidikan atas semua keputusan Anda.']}

/* Logo partai dan potret tokoh, digambar dengan SVG. Semua desain rekaan. */
function gearPath(cx,cy,r,teeth,depth){let d='';const n=teeth*2;for(let i=0;i<n;i++){const a1=i/n*Math.PI*2,a2=(i+1)/n*Math.PI*2,rr=i%2?r:r+depth;d+=(i?'L':'M')+(cx+rr*Math.cos(a1)).toFixed(2)+' '+(cy+rr*Math.sin(a1)).toFixed(2)+'L'+(cx+rr*Math.cos(a2)).toFixed(2)+' '+(cy+rr*Math.sin(a2)).toFixed(2);}return d+'Z';}
function starPath(cx,cy,r1,r2,n){let d='';for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?r2:r1;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2);}return d+'Z';}
function rice(x,y,s,flip){let h='';for(let i=0;i<5;i++){const yy=y-i*3.2*s;h+=`<ellipse cx="${(x+(flip?-1:1)*1.6*s).toFixed(2)}" cy="${yy.toFixed(2)}" rx="${1.3*s}" ry="${.7*s}" transform="rotate(${flip?30:-30} ${(x+(flip?-1:1)*1.6*s).toFixed(2)} ${yy.toFixed(2)})"/>`;}return h;}

'use strict';
/* ---------- utilitas ---------- */
function rnd(){G.rs=(G.rs+0x6D2B79F5)>>>0;let t=G.rs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%100000)/100000;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(rnd()*a.length)];
const r1=x=>Math.round(x*10)/10;
function tDate(t){return BULAN[t%12]+' '+(1997+Math.floor(t/12));}
const DIFFS={mudah:{name:'Mudah',boost:1.35,crack:.65,dana:1.4,desc:'Aparat lebih lunak, aksi Anda lebih bertenaga.'},normal:{name:'Normal',boost:1.1,crack:1,dana:1,desc:'Seimbang. Sejarah bisa dibelokkan, tapi tidak mudah.'},sulit:{name:'Sulit',boost:.9,crack:1.3,dana:.8,desc:'Aparat lebih ganas dan uang lebih seret.'}};
const OPPO=f=>!['gol','golb','pkk','dpn'].includes(f);
const MOVE=f=>['smn','hkn','bfd'].includes(f);
const RADICAL=f=>['smn','hkn','bfd'].includes(f)||(f==='prp'&&G.era==='ob')||(f==='pkn'&&!!(G.pol&&G.pol.larangan));
function lmod(k){return (leader().mod||{})[k];}
function figs(){return FIGURES.filter(f=>f.forms.includes(G.form));}
function figActive(f){return !(G.figOut[f.id]>G.t);}
function figBonus(k){let m=1;figs().forEach(f=>{if(figActive(f)&&f.bonus[k])m*=f.bonus[k];});return m;}
function compat(a,b){const A=(FORMS[a]||{}).xy||[.3,0,.8],B=(FORMS[b]||{}).xy||[.3,0,.8];const d=Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);return clamp(1-d/2.2,0,1);}
function hardship(){const E=G.eco||{inflasi:5,nganggur:4.7,tumbuh:5};const ref=G.t>=96&&G.kursRef?G.kursRef:2400;return clamp(.55*Math.max(0,Math.log(G.kurs/ref))/Math.log(G.t>=96?2.5:6)+E.inflasi/150+Math.max(0,E.nganggur-5)/20-Math.max(0,E.tumbuh-4)*.03,0,1);}
function addLog(txt,key){G.log.unshift({t:G.t,txt,key:!!key});if(G.log.length>160)G.log.pop();}
function decide(txt){G.decisions.push({t:G.t,txt});}

/* ---------- partai aktif dan kalibrasi ---------- */
function partySet(){
  if(G.era==='ob')return {gol:74,ppp:22,pdi:4};
  const f=G.form;let t;
  if(G.split){t={pdmp:20,golb:21,pkp:11,ppp:8,par:6,pku:7,pdb:9,nusra:5};
    if(f==='prp'){t.prp=5;t.pdmp=17;}else if(f==='smn'){t.pdmp=19;}else if(f==='pku'){t.pku=10;t.ppp=7;}
    else if(f==='pkk'){t.pkk=8;t.golb=16;}else if(f==='pdb'){t.pdb=11;t.golb=17;}else if(f==='nusra'){t.nusra=8;t.golb=18;}
    else if(f==='pkn'&&!G.pol.larangan){t.pkn=3;t.pdmp=18;}else if(f==='ppb'){t.ppb=3;t.pdmp=18;}}
  else{t={pdmp:34,golb:22,pkp:13,ppp:11,par:7,pku:3};
    if(f==='prp'){t.prp=5;t.pdmp=30;}else if(f==='smn'){t.pdmp=33;}else if(f==='pku'){t.pku=6;t.ppp=9;}else if(f==='pkk'){t.pkk=9;t.golb=14;}
    else if(f==='pkn'&&!G.pol.larangan){t.pkn=3;t.pdmp=32;}else if(f==='ppb'){t.ppb=3;t.pdmp=32;}}
  t.lain=Math.max(4,100-Object.values(t).reduce((a,b)=>a+b,0));
  return t;
}
const KCAL=1.5;
function rawLogit(pid,p){const w=FORMS[pid].w||{};let s=0;FEAT.forEach(k=>s+=(w[k]||0)*p.f[k]);return KCAL*s+(hash(pid+p.id)-.5)*.6;}
function calibrate(){
  const T=partySet(),ids=Object.keys(T),bias={};ids.forEach(i=>bias[i]=0);
  for(let it=0;it<140;it++){
    const tot={};ids.forEach(i=>tot[i]=0);let vt=0;
    PROVS.forEach(p=>{const e=ids.map(i=>Math.exp(rawLogit(i,p)+bias[i]));const z=e.reduce((a,b)=>a+b,0);ids.forEach((i,k)=>tot[i]+=p.seats*e[k]/z);vt+=p.seats;});
    ids.forEach(i=>bias[i]+=.9*Math.log((T[i]/100)/(tot[i]/vt)));
  }
  G.active=ids;G.base={};
  const ens=i=>{if(!G.eff[i]){G.eff[i]={};G.struct[i]={};PROVS.forEach(p=>{G.eff[i][p.id]=0;G.struct[i][p.id]=0;});G.nat[i]=0;}};
  if(FORMS[G.form].elect)ens(G.form);
  ids.forEach(i=>{G.base[i]={};PROVS.forEach(p=>G.base[i][p.id]=rawLogit(i,p)+bias[i]);
    if(!G.eff[i]){G.eff[i]={};G.struct[i]={};G.nat[i]=0;}
    PROVS.forEach(p=>{if(G.eff[i][p.id]==null)G.eff[i][p.id]=0;if(G.struct[i][p.id]==null)G.struct[i][p.id]=0;});});
}
function logit(pid,pv){return G.base[pid][pv]+G.eff[pid][pv]+G.nat[pid]+.05*G.struct[pid][pv];}
function shares(pv,noise){const o={};let z=0;G.active.forEach(i=>{o[i]=Math.exp(logit(i,pv)+(noise?noise():0));z+=o[i];});G.active.forEach(i=>o[i]/=z);return o;}
function liveProvs(){return PROVS.filter(p=>!G.gone[p.id]&&!(G.brk&&G.brk.includes(p.id)));}
function natShares(){const t={};G.active.forEach(i=>t[i]=0);let vt=0;liveProvs().forEach(p=>{const m=shares(p.id);G.active.forEach(i=>t[i]+=m[i]*p.seats);vt+=p.seats;});G.active.forEach(i=>t[i]/=vt);return t;}
function playerVotes(){return G.active.includes(G.form);}
// kesesuaian provinsi dengan suatu bentuk partai (0..1)
const FITC={};
function fit(form,pv){if(!FITC[form]){const w=FORMS[form].w||{},vals={};PROVS.forEach(p=>{let s=0;FEAT.forEach(k=>s+=(w[k]||0)*p.f[k]);vals[p.id]=s;});const a=Math.min(...Object.values(vals)),b=Math.max(...Object.values(vals));FITC[form]={};PROVS.forEach(p=>FITC[form][p.id]=b>a?(vals[p.id]-a)/(b-a):.5);}return FITC[form][pv];}
function moveFit(pv){const p=PBY[pv].f;if(G.form==='smn')return clamp(.2+.5*p.bu+.45*p.ta+.2*p.ab-.3*p.sa,0,1);if(G.form==='hkn')return clamp(.1+.9*p.sa+.2*p.ur-.6*p.nm,0,1);if(G.form==='bfd')return clamp(.05+.6*p.sa+.6*PBY[pv].kf-.5*p.nm,0,1);return .5;}

/* ---------- permainan baru ---------- */
function newGame(o,diff,seed){
  const lin=o.lin;
  PROVS.forEach(p=>p.kf=KF0[p.id]);
  const D=DIFFS[diff];
  G={v:7,rs:(seed||Date.now())>>>0,t:0,lin,form:LINEAGE[lin].main97,diff,era:'ob',
    dana:{gol:70,ppp:22,pdi:10}[lin]*D.dana,kader:{gol:55,ppp:35,pdi:28}[lin],massa:{gol:15,ppp:20,pdi:25}[lin],legit:{gol:35,ppp:40,pdi:42}[lin],abri:{gol:55,ppp:20,pdi:10}[lin],sorotan:{gol:0,ppp:15,pdi:30}[lin],
    stab:70,rezim:82,suhu:20,kurs:2380,kursMod:1,
    eff:{},struct:{},nat:{},kendali:{},gone:{},figOut:{},flags:{},log:[],decisions:[],used:{},queue:[],
    res:{},seats:{gol:282,ppp:62,pdi:56},power:null,beli:0,ap:3,apMax:3,ended:null,poll:[],coalPct:0,npcPres:null};
  careerInit(o);
  G.apMax=3;G.ap=G.apMax;
  PROVS.forEach(p=>G.kendali[p.id]=0);
  ecoInit();polInit();warInit();instInit();nationInit();facXY();
  calibrate();
  G.poll.push({t:0,s:natShares()});
  addLog('Januari 1997. Presiden '+PRESIDEN+' memasuki tahun ke-30 berkuasa. Pemilu dijadwalkan akhir Mei.',true);
  addLog(G.me.name+' memulai karier sebagai '+rankTitle()+' di '+FORMS[G.form].name+'. Ketua umum: '+G.ketum.name+'.',true);
  queueEvents();
  return G;
}

/* ---------- aksi ---------- */
const CAMPAIGN_T=[3,4,27,28,29,85,86,87];
function boost(k,pv){let m=DIFFS[G.diff].boost*(lmod(k)||1)*figBonus(k);if(pv){const p=PBY[pv];if(k==='kampanye'&&lmod('kampanyeAb')&&p.f.ab>.5)m*=lmod('kampanyeAb');if(p.f.nm>.5)m*=figBonus('nm');}return m*(.75+.5*G.legit/100);}
function addEff(pid,pv,v){if(!G.eff[pid])return;if(pid===G.form&&v>0&&G.active.includes(pid)){const s=shares(pv)[pid];v*=clamp(1.3*Math.pow(1-s,2.4),.06,1.1);}G.eff[pid][pv]+=v;}
function kend(pv,v){if(G.gone[pv])return;G.kendali[pv]=clamp(G.kendali[pv]+v,0,100);}
function bump(k,v){G[k]=clamp(G[k]+v,0,k==='dana'?99999:100);}
const ACTS=[
 {id:'kampanye',name:'Rapat umum',tg:'prov',dana:3,forms:f=>FORMS[f].elect,when:()=>G.active.includes(G.form)?true:'Partai Anda belum boleh ikut pemilu.',blurb:'Panggung, pengeras suara, dan ribuan orang. Dukungan provinsi naik, terutama yang cocok dengan haluan partai.',

function shiftCheck(to){
  const s=SHIFT[to],out=[];if(!s)return {ok:false,out};

  out.push(['Dari '+s.from.map(f=>FORMS[f].abbr).join(' atau '),s.from.includes(G.form)]);
  if(s.split)out.push(['Golkar sudah pecah (September 2000)',!!G.split]);
  else if(s.minT===17)out.push(['Orde Baru sudah runtuh',G.era==='ref']);
  else if(s.minT>0)out.push(['Mulai '+tDate(s.minT),G.t>=s.minT]);
  const nm={kader:'Kader',massa:'Massa',legit:'Legitimasi',abri:'Hubungan ABRI',dana:'Dana Rp'};
  Object.keys(s.req).forEach(k=>out.push([nm[k]+(k==='dana'?'':' minimal ')+s.req[k]+(k==='dana'?' M':''),G[k]>=s.req[k]]));
  if(G.obPath&&['golb','pkk'].includes(to))out.push(['Tidak di jalur Orde Baru Abadi',false]);
  if(!isKetum()&&!JOINF.includes(to)){out.push(['Pengaruh internal Anda minimal 35',G.me.pengaruh>=35]);out.push(['Jabatan minimal ketua DPD',G.me.rank>=2]);}

}
function doShift(to,silent){
  const from=G.form,wasActive=G.active.includes(from);
  const oldEff=G.eff[from]||{},oldStr=G.struct[from]||null;
  G.form=to;
  calibrate();
  if(wasActive&&G.active.includes(to)&&to!==from){PROVS.forEach(p=>{G.eff[to][p.id]=oldEff[p.id]*.6;G.struct[to][p.id]=Math.round(oldStr[p.id]*.5);});
    if(G.active.includes(from)){PROVS.forEach(p=>{G.eff[from][p.id]=oldEff[p.id]*.25;G.struct[from][p.id]=0;});}}
  if(MOVE(to)&&!MOVE(from)){PROVS.forEach(p=>kend(p.id,moveFit(p.id)*clamp(G.kader/3,5,22)+(oldStr?clamp(oldStr[p.id]*2,0,8):0)));}
  const F=FORMS[to];
  if(['smn','hkn'].includes(to))bump('sorotan',12);
  if(to==='bfd'){bump('sorotan',25);bump('legit',-15);}
  if(to==='prp'&&G.era==='ob'){bump('sorotan',25);}
  if(to==='pdmp'||to==='golb'){bump('legit',6);}
  if(to==='pkk'){bump('legit',-6);}
  if(to==='pdb'){bump('legit',4);}
  if(to==='nusra'){bump('massa',8);bump('abri',4);}
  if(to==='dpn'){bump('abri',6);bump('legit',-4);}
  if(!silent){addLog('Partai Anda kini bernama '+F.name+' ('+F.abbr+'). Haluan: '+F.ideo+'.',true);decide('Beralih menjadi '+F.name);}
}

  if(G.form==='bfd'&&!G.power)tStab-=PROVS.filter(p=>G.kendali[p.id]>=40).length*1.0;

function crackRoll(){
  if(G.power||!OPPO(G.form))return false;
  const state=G.era==='ob'?G.rezim/100:(G.form==='bfd'?.75:MOVE(G.form)?.4:RADICAL(G.form)?.5:.15);
  let m=(1+G.arah.kuasa/250)*(G.pol.pers?.7:1)*(G.pol.larangan&&MOVE(G.form)?1.6:1)*(G.pol.antiteror&&G.form==='bfd'?2:1);
  const p=clamp(clamp((G.sorotan-40)/110,0,.45)*state*DIFFS[G.diff].crack*m,0,.6);
  return rnd()<p;
}
function powerRoll(){
  if(!G.power||G.queue.some(q=>q.id==='gulingan'||q.id==='rakyat'||q.id==='serbuan'))return;
  if(G.t-G.power.since<1)return;
  const R=G.power.route;
  if(R==='pisah'){if(!G.queue.some(q=>q.id==='serbuan')&&rnd()<(G.civil?.18:.1))pushEv('serbuan');return;}
  if(G.form==='smn'){const c=PROVS.filter(x=>G.kendali[x.id]>=50).length;if(rnd()<(c<12?.16:.05))pushEv('gulingan');return;}
  const coup=((25-Math.min(25,G.grp.tni))/160)+(ELECT(R)?clamp((20-G.abri)/80,0,.2):clamp((32-G.abri)/50,0,.45))*(G.pol.dwifungsi?.5:1);
  if(rnd()<coup){pushEv('gulingan');return;}
  const auth=['ordebaru','kudeta','perang','seruan','revolusi','revmerah'].includes(R);
  const people=clamp((G.suhu-(auth?55:68))/80+(G.t-G.power.since>6?(30-Math.min(30,G.kep))/160:0),0,.4)*(G.legit<30?1:G.legit<50?.6:.3);
  if(rnd()<people)pushEv('rakyat');
}
function stepLen(){return G.t<96?1:3;}
function endTurn(){

  G.apMax=G.t<96?3:5;G.ap=(G.me&&G.me.jailed&&G.me.kasasi!=='free')?0:G.apMax;

}

function lastRes(){let r=null;ELEC.forEach(([t,id])=>{if(G.res[id])r=G.res[id];});return r;}
function advanceMonth(){
  monthly();

  if(t===33&&G.era==='ref'&&!G.power){if(G.active.includes(G.form)&&G.res['99']&&isKetum())G.queue.push({type:'mpr',si:false,t});else if(G.active.includes(G.form)&&G.res['99']){const w=npcPartyMpr(false);G.queue.push({type:'info',t,title:w?'Ketua umum Anda jadi presiden':'Partai Anda kalah di MPR',text:w?'MPR memilih '+G.ketum.name+'. Partai Anda kini memerintah.':'Koalisi lawan lebih rapat. '+G.npcPres.name+' terpilih sebagai presiden.'});}else{npcMpr();G.queue.push({type:'info',t,title:'Presiden baru dipilih',text:'MPR memilih '+(G.npcPres?G.npcPres.name:'calon lain')+' sebagai presiden.'});}}
  if(t===54&&G.era==='ref'&&!G.power&&FORMS[G.form].elect&&G.active.includes(G.form)&&G.blok[G.form]!=='pem'){if(isKetum())G.queue.push({type:'mpr',si:true,t});else{const w=npcPartyMpr(true);G.queue.push({type:'info',t,title:'Sidang Istimewa MPR',text:w?'Presiden lama dijatuhkan. MPR memilih ketua umum partai Anda, '+G.ketum.name+'.':'Sidang Istimewa digelar. '+G.npcPres.name+' memimpin republik.'});}}

  if(PRES_T.includes(t))presStep(t);

  if(crackRoll())pushEv('tindak');

function checkFail(){

function allocSeats(sh,n){const ids=Object.keys(sh),o={};let used=0;const rem=[];ids.forEach(i=>{const q=sh[i]*n;o[i]=Math.floor(q);used+=o[i];rem.push([i,q-o[i]]);});rem.sort((a,b)=>b[1]-a[1]);for(let k=0;k<n-used;k++)o[rem[k%rem.length][0]]++;return o;}
function runElection(id){

function pilpresPartners(){const ns=natShares();return G.active.filter(i=>i!==G.form&&i!=='lain').map(i=>{const c=compat(i,G.form);const ok=c>=.4||(typeof prel==='function'&&prel(i)>=40)||(typeof inCoal==='function'&&inCoal(i));const pay=ns[i]>ns[G.form]*1.2;return {id:i,share:ns[i],c,ok,pay};}).sort((a,b)=>b.share-a.share);}
function pilpresCalc(partner){
  const ns=natShares(),me=G.form,used=new Set([me]);if(partner)used.add(partner);
  const rival=G.active.filter(i=>!used.has(i)&&i!=='lain').sort((a,b)=>ns[b]-ns[a])[0];used.add(rival);
  const rp=G.active.filter(i=>!used.has(i)&&i!=='lain').sort((a,b)=>ns[b]*compat(b,rival)-ns[a]*compat(a,rival))[0];if(rp)used.add(rp);
  let A=ns[me]+(partner?.8*ns[partner]:0),B=ns[rival]+(rp?.8*ns[rp]:0);
  const split=(i,f)=>{const a=Math.exp(3*compat(i,me)),b=Math.exp(3*compat(i,rival));A+=ns[i]*f*a/(a+b);B+=ns[i]*f*b/(a+b);};
  if(partner)split(partner,.2);if(rp)split(rp,.2);G.active.filter(i=>!used.has(i)).forEach(i=>split(i,1));
  let p=A/(A+B)+(G.legit-50)/500+(playerGov()?(G.eco.tumbuh-4)/80:0)+(lmod('kampanyeAb')?.01:0);
  return {p:clamp(p,.02,.98),rival,rp};
}
function runPilpres(partner){
  const R=pilpresCalc(partner);const p=clamp(R.p+(rnd()-.5)*.06,.01,.99);const win=p>.5;
  G._pmargin={m:Math.abs(p-.5)*2,won:win,rival:R.rival};
  if(partner&&pilpresPartners().find(x=>x.id===partner&&x.pay))pay(25);G.me.capres=false;
  if(win){if(!G.power)startPower('pilpres');else{G.power.route='pilpres';G.power.terms=(G.power.terms||1)+1;}G.blok={};G.active.forEach(i=>G.blok[i]=i===G.form||i===partner?'pem':compat(i,G.form)>=.55?'dukung':'opo');
    addLog(leader().name+' memenangi pemilihan presiden langsung dengan '+(p*100).toFixed(1)+' persen suara.',true);decide('Menang pemilihan presiden 2004');}
  else{if(G.power&&ELECT(G.power.route)){G.power=null;G.me.kursi=null;addLog('Anda kalah dalam pemilihan presiden dan harus menyerahkan istana.',true);}
    G.npcPres={party:R.rival,name:npcName(R.rival)};G.blok={};G.active.forEach(i=>G.blok[i]=i===R.rival||i===R.rp?'pem':i===G.form||i===partner?'opo':'imbang');
    addLog(G.npcPres.name+' ('+FORMS[R.rival].abbr+') memenangi pemilihan presiden dengan '+((1-p)*100).toFixed(1)+' persen suara.',true);decide('Kalah dalam pemilihan presiden 2004');}
  return {win,p,rival:R.rival,rp:R.rp};
}

const CASE_KINDS={
 korupsi:{name:'Dugaan korupsi',org:'kpk',base:.5,ruin:22,jail:true},
 suap:{name:'Suap dan gratifikasi',org:'kpk',base:.45,ruin:18,jail:true},
 markup:{name:'Mark-up proyek',org:'kpk',base:.5,ruin:16,jail:true},
 cuci:{name:'Pencucian uang',org:'kpk',base:.45,ruin:24,jail:true},
 offshore:{name:'Aset offshore tak dilaporkan',org:'keja',base:.5,ruin:20,jail:false},
 etik:{name:'Pelanggaran etik',org:'ky',base:.55,ruin:8,jail:false},
 pidana:{name:'Perkara pidana umum',org:'keja',base:.55,ruin:12,jail:true},
 konstitusi:{name:'Uji materi di MK',org:'mk',base:.5,ruin:0,jail:false}
};
function newCase(o){const c=Object.assign({id:++G.law.caseSeq,t:G.t,stage:'lapor',bukti:o.bukti||40,media:o.media||30,target:'me',win:null},o);
  G.law.cases.push(c);return c;}
function myCases(){return G.law.cases.filter(c=>c.target==='me'&&!c.closed);}
function caseWinProb(c){
  const K=CASE_KINDS[c.kind];let p=K.base; // p = peluang pemain SELAMAT (menang/bebas)
  p-=(c.bukti-40)/120; p+=(G.me.nb-50)/160; p+=(G.me.dana>15?.08:0); // pengacara mahal
  p+=(isExec()?.06:0)+(G.me.rank>=5?.05:0);
  const og=orgOf(c.kind);if(og==='kpk')p+=(70-G.inst.kpkInd)/200;      // kpk lemah → pemain lebih aman
  if(og==='keja')p+=(G.inst.polriRel>0?G.inst.polriRel/300:0)+(45-G.inst.kejaInd)/160;
  if(K.org==='ky')p+=(60-G.inst.kyInd)/200;
  if(G.inst.maBias>0)p+=G.inst.maBias/180;          // MA condong ke pemerintah
  if(c.deal)p+=c.deal;                               // hasil kongkalikong
  return clamp(p,.04,.96);
}
// seret satu tahap perkara tiap bulan
function advanceCases(){
  const L=G.law;
  L.cases.forEach(c=>{if(c.closed)return;const K=CASE_KINDS[c.kind];
    if(c.target!=='me'){ // perkara NPC: selesai cepat
      if(G.t-c.t>=2){c.closed=true;}return;}
    if(c.stage==='lapor'){const adv=clamp((c.bukti+c.media)/160+(orgOf(c.kind)==='kpk'?G.inst.kpkInd/300:.15),.1,.85);
      if(rnd()<adv){c.stage=(c.kind==='konstitusi')?'sidang':'sidik';addLog((orgName(orgOf(c.kind)||'keja')+': kasus '+K.name.toLowerCase()+' terhadap Anda naik ke tahap '+(c.stage==='sidik'?'penyidikan':'persidangan')+'.'),true);G.me.nb=clamp(G.me.nb-4,0,100);pushEv('perkara_update');}
      else if(G.t-c.t>6){c.closed=true;c.win='me';addLog('Laporan '+K.name.toLowerCase()+' terhadap Anda dihentikan karena kurang bukti.',true);}
      return;}
    if(c.stage==='sidik'){if(G.t-c.t>=2){c.stage='sidang';c.org=K.org;addLog('Berkas '+K.name.toLowerCase()+' dilimpahkan ke pengadilan.',true);pushEv('perkara_sidang');}return;}
    if(c.stage==='sidang'){if(G.t-c.t>=(c.kind==='konstitusi'?1:3)){resolveCase(c);}return;}
  });
  L.cases=L.cases.filter(c=>!c.closed||G.t-c.t<24);
}
function serveSentence(){
  if(isKetum()||playerGov()){if(G.power&&G.me.kursi&&G.me.kursi.type==='presiden'){addLog('Presiden dipenjara. Pemerintahan beralih.',true);}triggerSuccession('penjara');return;}
  G.me.rank=Math.max(0,G.me.rank-2);G.me.dpd=null;G.me.kasasi='serve';G.me.release=G.t+18;addLog('Anda menjalani hukuman penjara. Partai mencopot jabatan Anda.',true);}
function resolveCase(c){
  const K=CASE_KINDS[c.kind];const p=caseWinProb(c)+(c.kasasi?(G.inst.maBias/200+.05):0);const safe=rnd()<p;c.closed=true;c.win=safe?'me':'lawan';
  if(c.kasasi){if(safe){G.me.jailed=0;G.me.kasasi='free';G.me.nb=clamp(G.me.nb+8,0,100);addLog('Mahkamah Agung mengabulkan kasasi Anda. Vonis dibatalkan, Anda bebas.',true);decide('Bebas lewat kasasi MA');}
    else{addLog('Mahkamah Agung menolak kasasi Anda. Vonis berkekuatan hukum tetap.',true);serveSentence();}pushEv('perkara_vonis');return;}
  if(c.kind==='konstitusi'){ // uji materi: menang = kebijakan batal
    if(safe&&c.pol&&G.pol[c.pol]){repealPolicy(c.pol);G.inst.mkBias=clamp(G.inst.mkBias-8,-100,100);addLog('Mahkamah Konstitusi membatalkan '+(POLBY[c.pol]?POLBY[c.pol].name.toLowerCase():'kebijakan').toLowerCase()+'.',true);bump('legit',c.byPlayer?3:-3);}
    else addLog('Mahkamah Konstitusi menolak gugatan atas '+(c.pol&&POLBY[c.pol]?POLBY[c.pol].name.toLowerCase():'kebijakan')+'.',true);
    pushEv('perkara_vonis');return;}
  if(safe){G.me.nb=clamp(G.me.nb+6,0,100);G.me.pengaruh=clamp(G.me.pengaruh+3,0,100);addLog('Anda divonis bebas dalam kasus '+K.name.toLowerCase()+'. Nama baik pulih sebagian.',true);}
  else{
    G.me.nb=clamp(G.me.nb-K.ruin,0,100);G.me.pengaruh=clamp(G.me.pengaruh-K.ruin*.6,0,100);
    const seized=Math.round((G.me.dana||0)*(.3+rnd()*.3)+ (G.assets.hidden||0)*.5);G.me.dana=r1(Math.max(0,G.me.dana-seized));G.assets.hidden=0;
    addLog('Anda divonis bersalah dalam kasus '+K.name.toLowerCase()+'. Aset senilai Rp'+seized+' M disita.',true);decide('Divonis bersalah: '+K.name.toLowerCase());
    if(K.jail){
      if(G.me.kursi&&G.me.kursi.type!=='presiden'){addLog('Anda kehilangan jabatan '+kursiTitle()+'.',true);G.me.kursi=null;}
      G.me.jailed=G.t;G.me.kasasi=c.kasasi?'done':'open';c.guilty=true;
    }
  }
  pushEv('perkara_vonis');
}
// aparat mendeteksi korupsi pemain
function corruptionScan(){
  const L=G.law;if(G.me.suspend&&G.t<G.me.suspend)return;
  const exposure=(G.me.amplop||0)*.9+(G.assets.launder||0)*1.1+(G.assets.offshore||0)*.5+L.stl*2;
  if(exposure<4)return;
  const indep=has('kpk')?(G.inst.kpkInd*.6+G.inst.kejaInd*.4)/100:(G.inst.kejaInd*.7+G.inst.polri*.3)/100*.75;
  let risk=clamp(exposure/180*indep*DIFFS[G.diff].crack,0,.5);
  if(G.inst.polriRel>0)risk*=clamp(1-G.inst.polriRel/160,.3,1); // polri di saku → risiko turun
  if(myCases().length)risk*=.5;
  if(rnd()<risk){
    const kind=G.assets.launder>6?'cuci':G.me.amplop>18?'korupsi':'suap';
    L.stl=Math.max(0,L.stl-2);G.me.amplop=Math.max(0,(G.me.amplop||0)-6);
    newCase({kind,bukti:clamp(40+exposure,40,90),media:clamp(30+G.inst.press*.5,30,90)});
    addLog(orgName(orgOf(kind))+' membuka penyelidikan terhadap Anda.',true);
    pushEv('investigasi');
  }
}

function splitProvince(cid){
  if(G.gone[cid]||PBY[cid])return;
  const c=PEMEKARAN[cid];if(!c)return;const par=PBY[c.parent];if(!par||G.gone[c.parent])return;
  // provinsi baru mewarisi watak induk, kursi dibagi
  const share=clamp(c.d.length/(c.d.length+MAP[c.parent].d.length),.18,.5);
  const seats=Math.max(3,Math.round(par.seats*share));par.seats=Math.max(3,par.seats-seats);
  const np={id:cid,name:c.name,ab:cid.slice(0,3).toUpperCase(),seats,kf:par.kf*.9,desc:'Provinsi hasil pemekaran dari '+par.name+' setelah reformasi.',f:Object.assign({},par.f),baru:true};
  PROVS.push(np);PBY[cid]=np;MAP[cid]={d:c.d,lx:c.lx,ly:c.ly};
  // ciutkan bentuk induk menjadi sisa wilayahnya
  const remKey=(cid==='pbd')?'irjabar_rem':c.parent;const rem=PARENT_REM[remKey];
  if(rem){MAP[c.parent]={d:rem.d,lx:rem.lx,ly:rem.ly};}
  // state arrays
  G.dev[cid]=clamp((G.dev[c.parent]||30)-6,8,95);G.sep[cid]=clamp((G.sep[c.parent]||10)-4,0,100);G.sepQ[cid]=0;G.kendali[cid]=0;
  if(G.me&&G.me.pop)G.me.pop[cid]=Math.round((G.me.pop[c.parent]||3)*.7);
  if(G.ctrl)G.ctrl[cid]='pusat';
  // reset FIT cache & recalibrate party map
  if(typeof FITC!=='undefined')Object.keys(FITC).forEach(k=>delete FITC[k]);
  calibrate();
  if(U&&U.builtMap)U.builtMap=false;
  addLog(c.name+' resmi menjadi provinsi baru, dimekarkan dari '+par.name+'.',true);
}

/* ====================================================================
   KAWAT SESUAI JABATAN
   Kawat yang memuat keputusan strategis partai hanya diputuskan oleh
   ketua umum. Pengurus DPP dan anggota DPR bisa MENGUSULKAN dalam rapat
   pleno; kader dan pengurus daerah hanya BEREAKSI terhadap keputusan.
   ==================================================================== */
const SELF_EV=new Set(['beringin','bab3','bab4','bab5','bab6','bab7','seratus','tsunami','perang','damai','jurang','gulingan','rakyat','serbuan','kpkberdiri','mkberdiri','kyberdiri','angket_vs','makzul_vs','sengketa','bocor_deal','kapp_demo']);
function evMode(q,e){
  if(!q||q.type!=='ev'||!e)return 'self';
  if(e.personal||SELF_EV.has(q.id))return 'self';
  if(isKetum()||playerGov())return 'self';
  const ch=e.ch(q.d);if(!ch||ch.length<2)return 'self';
  if(G.me.rank>=3||isLegis())return 'usul';     // rapat pleno: boleh mengusulkan
  return 'reaksi';                                // kader & pengurus daerah: bereaksi
}
// pilihan ketua umum NPC: stabil antar-render, cenderung ke pilihan pertama
function npcPick(q,ch){const ok=ch.map((c,i)=>choiceOk(c)===true?i:-1).filter(i=>i>=0);if(!ok.length)return -1;
  const h=hash(q.id+':'+(q.t!=null?q.t:G.t)+':'+G.ketum.name);return h<.55?ok[0]:ok[Math.floor(h*ok.length)%ok.length];}
function usulChance(){return clamp(.18+G.me.pengaruh/160+(G.me.rel[ketumFac()]||0)/260+(G.me.rank-3)*.1+(isLegis()?.06:0),.12,.85);}
function resolveParty(mode,i){
  const q=G.queue[0];if(!q||q.type!=='ev')return;const e=EBY[q.id];const ch=e.ch(q.d);const k=npcPick(q,ch);
  const runIt=(idx)=>{const c=ch[idx];if(!c)return '';if(c.cost&&c.cost.dana)G.dana=r1(G.dana-c.cost.dana);const m=c.run();G.stab=clamp(G.stab,0,100);G.suhu=clamp(G.suhu,0,100);G.rezim=clamp(G.rezim,0,100);return m;};
  let msg='';const kf=ketumFac();
  if(mode==='usul'){
    if(i===-1){msg=runIt(k);G.me.rel[kf]=clamp((G.me.rel[kf]||0)+3,-100,100);msg='Anda mendukung sikap ketua umum. '+msg;}
    else if(i===k){msg=runIt(k);G.me.pengaruh=clamp(G.me.pengaruh+1,0,100);msg='Usulan Anda sejalan dengan ketua umum. '+msg;}
    else if(rnd()<usulChance()){msg=runIt(i);G.me.pengaruh=clamp(G.me.pengaruh+3,0,100);G.me.rel[kf]=clamp((G.me.rel[kf]||0)-2,-100,100);msg='Rapat pleno memenangkan usulan Anda. '+msg;decide('Usulan diterima pleno: '+ch[i].l);}
    else{msg=runIt(k);G.me.rel[kf]=clamp((G.me.rel[kf]||0)-4,-100,100);msg='Rapat pleno memilih usulan ketua umum. '+msg;}
  }else{ // reaksi kader
    const dec=k>=0?runIt(k):'';
    if(i===0){G.me.rel[kf]=clamp((G.me.rel[kf]||0)+4,-100,100);G.me.pengaruh=clamp(G.me.pengaruh+1,0,100);msg='Anda membela keputusan pusat di depan kader daerah.';}
    else if(i===1){G.me.rel[kf]=clamp((G.me.rel[kf]||0)-5,-100,100);popAdd(G.me.asal,3);G.me.pengaruh=clamp(G.me.pengaruh+(rnd()<.4?2:0),0,100);msg='Kritik Anda beredar di grup kader. Pusat mencatatnya.';}
    else{popAdd(homeProv(),2);msg='Anda menunduk dan bekerja di daerah.';}
    msg=(k>=0?'Ketua umum memutuskan: '+ch[k].l.toLowerCase()+'. ':'')+msg+(dec?' '+dec:'');
  }
  addLog(evVal(e.title,q.d)+': '+msg);G.queue.shift();checkFail();return {ok:true,msg};
}

function oppShare(){const S=dprSeats();let opp=0,tot=0;Object.keys(S).forEach(i=>{tot+=S[i];const b=(typeof blokOf==='function')?blokOf(i):'imbang';if(b==='opo'||(b==='imbang'&&i===G.form))opp+=S[i];});return tot?opp/tot:0;}
function legisCan(kind){
  if(playerGov())return 'Anda memimpin pemerintahan; hak pengawasan dipakai lawan terhadap Anda.';
  if(!(isLegis()&&G.me.kursi.type==='dpr')&&!(isKetum()&&G.seats&&G.seats[G.form]>0))return 'Butuh kursi DPR atau kendali fraksi sebagai ketua umum.';
  if(G.era==='ob')return 'Di bawah Orde Baru, DPR tidak menggunakan hak ini.';
  if(G.ap<1)return 'Jatah aksi bulan ini habis.';if(G.queue.length)return 'Selesaikan kabar yang masuk dulu.';
  const os=oppShare();
  if(kind==='angket'&&os<.3)return 'Fraksi oposisi baru '+Math.round(os*100)+'% kursi; butuh minimal 30% untuk mengusulkan angket.';
  if(kind==='makzul'){if(!has('mk'))return 'Pemakzulan lewat MK baru mungkin setelah Agustus 2003.';if(os<.45)return 'Fraksi oposisi baru '+Math.round(os*100)+'% kursi; butuh minimal 45%.';if(G.kep>=45)return 'Kepuasan rakyat masih '+Math.round(G.kep)+'; tanpa krisis, pemakzulan tidak mendapat dukungan.';}
  if(G.me.dana<2)return 'Dana kurang (Rp2 M).';return true;}
function doLegis(kind){const c=legisCan(kind);if(c!==true)return c;G.ap--;G.me.dana=r1(G.me.dana-2);
  const gp=govParty(),os=oppShare();
  if(kind==='interpelasi'){if(G.active.includes(gp))G.nat[gp]-=.03;popAdd(homeProv(),3);G.me.pengaruh=clamp(G.me.pengaruh+2,0,100);decide('Menggalang hak interpelasi');return {ok:true,msg:'DPR memanggil pemerintah untuk menjelaskan kebijakannya. Sidang disiarkan langsung.'};}
  if(kind==='angket'){const p=clamp((os-.3)*2.2+.25,.1,.85);if(rnd()<p){if(G.active.includes(gp))G.nat[gp]-=.08;G.kep=clamp(G.kep-3,0,100);G.inst.press=clamp(G.inst.press+12,0,100);G.me.pengaruh=clamp(G.me.pengaruh+4,0,100);decide('Panitia angket terbentuk');return {ok:true,msg:'Paripurna menyetujui hak angket. Panitia khusus membongkar borok pemerintah di depan publik.'};}
    G.me.pengaruh=clamp(G.me.pengaruh-2,0,100);return {ok:true,msg:'Usulan angket kandas di paripurna. Koalisi pemerintah terlalu rapat.'};}
  if(kind==='makzul'){const p=clamp((os-.45)*2.5+(50-G.kep)/80+(100-Math.abs(G.inst.mkBias))/400,.05,.7);
    if(rnd()<p){const old=G.npcPres?G.npcPres.name:'presiden';const op=G.npcPres?G.npcPres.party:null;const cand=G.active.filter(i=>i!=='lain'&&i!==op).sort((a,b)=>(G.nat[b]||0)-(G.nat[a]||0))[0]||G.form;G.npcPres={party:cand,name:npcName(cand)};G.blok={};G.active.forEach(i=>G.blok[i]=i===cand?'pem':compat(i,cand)>=.55?'dukung':'opo');G.stab=clamp(G.stab-8,0,100);G.me.pengaruh=clamp(G.me.pengaruh+8,0,100);addLog('MK menyatakan '+old+' melanggar hukum dan MPR memberhentikannya. '+G.npcPres.name+' dilantik.',true);decide('Memimpin pemakzulan presiden');return {ok:true,msg:'Pemakzulan berhasil. '+old+' diberhentikan, '+G.npcPres.name+' dilantik sebagai presiden.'};}
    G.me.pengaruh=clamp(G.me.pengaruh-5,0,100);G.me.nb=clamp(G.me.nb-3,0,100);return {ok:true,msg:'Mahkamah Konstitusi menolak dalil pemakzulan. Langkah Anda dicap manuver politik.'};}
}

function oversightVsPlayer(){if(!playerGov()||G.era!=='ref')return;const os=1-((typeof oppShare==='function')?(1-oppShare()):0);

function kinPlaceCan(kid){const kk=G.dyn.kin.find(x=>x.id==kid);if(!kk)return 'Tidak ditemukan.';if(kk.office)return 'Sudah menjabat.';if(G.me.rank<2&&!isExec())return 'Butuh posisi ketua DPD, ketua umum, atau jabatan eksekutif.';if(G.ap<1)return 'Jatah aksi bulan ini habis.';if(G.me.dana<6)return 'Dana kurang (Rp6 M).';return true;}
function kinPlace(kid){const c=kinPlaceCan(kid);if(c!==true)return c;G.ap--;G.me.dana=r1(G.me.dana-6);const kk=G.dyn.kin.find(x=>x.id==kid);
  const pv=homeProv();const p=clamp(.35+kk.pop/200+kk.komp/300+pdynasty()/400+(isExec()?.1:0),.15,.85);
  if(rnd()<p){kk.office=pick(['Anggota DPRD '+PBY[pv].name,'Bupati di '+PBY[pv].name,'Ketua DPC partai']);kk.pop=clamp(kk.pop+8,0,100);G.inst.press=clamp(G.inst.press+4,0,100);decide('Menempatkan '+kk.name+' sebagai '+kk.office);return {ok:true,msg:kk.name+' kini menjabat '+kk.office+'. Dinasti Anda menguat, begitu pula sorotan.'};}
  G.me.nb=clamp(G.me.nb-3,0,100);return {ok:true,msg:kk.name+' kalah dalam pencalonan. Lawan menyebutnya karbitan.'};}

function lookFor(name,pid){const h=hash(name);const fem=/^(Hj\.|Dr\. Puan|Dr\. Khofifah|Dita|Sumarsih|Laras|Ratna|Sri|Siti|Nur|Ustadzah|Dewi|Maria|Hj)/.test(name);

function partyLeader(pid){if(pid===G.form)return G.ketum.name;if(SEPUH[pid])return SEPUH[pid][1];return npcName(pid);}
function partyFigs(pid){const base=(NPCFIG[pid]||[]).filter(([n])=>!(G.dipl.jailed||{})[n]);return base.map(([n,r])=>({name:n,role:r,look:lookFor(n,pid)}));}
function diplInit(){if(!G.dipl)G.dipl={rel:{},coal:{},pledge:{},jailed:{}};}
function prel(pid){diplInit();return G.dipl.rel[pid]||0;}
function addRel(pid,v){diplInit();G.dipl.rel[pid]=clamp((G.dipl.rel[pid]||0)+v*(v>0?(100-(G.dipl.rel[pid]||0))/100:1),-100,100);}
function inCoal(pid){diplInit();return !!G.dipl.coal[pid];}
// siapa boleh berdiplomasi
function diplRole(){if(playerGov())return 'presiden';if(isKetum())return 'ketum';if(isLegis()&&G.me.kursi.type==='dpr')return 'dpr';if(G.me.rank>=3)return 'dpp';if(G.me.rank>=2)return 'dpd';return 'kader';}
const DIPL=[
 {id:'silat',name:'Silaturahmi',cost:2,who:['presiden','ketum','dpr','dpp','dpd'],desc:'Bertamu ke kediaman ketua umum. Relasi membaik.'},
 {id:'koal',name:'Ajak koalisi',cost:4,who:['presiden','ketum'],desc:'Mengikat fraksi ini ke barisan Anda. Butuh relasi baik dan haluan yang tidak terlalu jauh.'},
 {id:'nego',name:'Negosiasi dukungan',cost:5,who:['presiden','ketum','dpr'],desc:'Barter: fraksi ini mendukung usulan RUU Anda selama enam bulan.'},
 {id:'prov',name:'Provokasi',cost:2,who:['presiden','ketum','dpr','dpp','dpd','kader'],desc:'Serang lewat media dan buzzer. Suara mereka tergerus, tapi bisa berbalik ke Anda.'},
 {id:'suap',name:'Suap fraksi',cost:10,who:['presiden','ketum','dpr'],desc:'Amplop untuk anggota fraksi. Relasi dan dukungan instan, risiko korupsi tinggi.'}
];
function diplCan(id,pid){diplInit();const d=DIPL.find(x=>x.id===id);if(!d)return '?';
  if(pid===G.form)return 'Ini partai Anda sendiri.';
  if(pid==='tni'||pid==='polri'){if(id!=='silat'&&id!=='suap')return 'Fraksi aparat tidak berkoalisi atau dinegosiasikan.';}
  const role=diplRole();if(!d.who.includes(role))return 'Jabatan Anda ('+lcFirst(role==='dpd'?'ketua DPD':role==='dpp'?'pengurus DPP':role)+') belum cukup untuk langkah ini.';
  if(G.ap<1)return 'Jatah aksi bulan ini habis.';if(G.queue.length)return 'Selesaikan kabar yang masuk dulu.';
  if(G.era==='ob'&&['koal','nego','prov'].includes(id)&&!['gol','ppp','pdi'].includes(pid))return 'Tidak berlaku.';
  if(id==='koal'){if(inCoal(pid))return 'Sudah berkoalisi.';if(prel(pid)<15)return 'Relasi minimal +15 (sekarang '+Math.round(prel(pid))+').';if(compat(pid,G.form)<.3)return 'Haluan terlalu jauh untuk berkoalisi.';}
  if(id==='nego'&&(G.dipl.pledge[pid]||0)>G.t)return 'Masih terikat kesepakatan sampai '+tDate(G.dipl.pledge[pid])+'.';
  const pay=wallet();if(pay<d.cost)return (isKetum()?'Kas partai':'Dana pribadi')+' kurang (butuh Rp'+d.cost+' M).';
  return true;}
function doDipl(id,pid){const c=diplCan(id,pid);if(c!==true)return c;G.ap--;const d=DIPL.find(x=>x.id===id);pay(d.cost);
  const nm=pid==='tni'?'Fraksi TNI':pid==='polri'?'Fraksi Polri':FORMS[pid].abbr;const L=partyLeader(pid);
  if(id==='silat'){addRel(pid,10+(compat(pid,G.form)>.5?4:0));G.me.pengaruh=clamp(G.me.pengaruh+1,0,100);return {ok:true,msg:'Anda bertamu ke kediaman '+L+'. Obrolan hangat sampai larut malam. Relasi dengan '+nm+' membaik.'};}
  if(id==='koal'){const p=clamp(.3+prel(pid)/120+compat(pid,G.form)*.4,.1,.92);
    if(rnd()<p){G.dipl.coal[pid]=true;G.blok[pid]=G.blok[G.form]||(playerGov()?'pem':'opo');addRel(pid,8);decide('Koalisi dengan '+nm);addLog(nm+' bergabung dalam koalisi bersama partai Anda.',true);return {ok:true,msg:L+' menjabat tangan Anda. '+nm+' resmi berkoalisi.'};}
    addRel(pid,-4);return {ok:true,msg:L+' menolak halus. Mereka menunggu tawaran yang lebih baik.'};}
  if(id==='nego'){const p=clamp(.35+prel(pid)/150+compat(pid,G.form)*.3,.15,.9);
    if(rnd()<p){G.dipl.pledge[pid]=G.t+6;return {ok:true,msg:nm+' sepakat mendukung usulan RUU Anda selama enam bulan.'};}
    addRel(pid,-3);return {ok:true,msg:'Negosiasi buntu. '+nm+' meminta harga yang tidak bisa Anda penuhi.'};}
  if(id==='prov'){if(G.active.includes(pid))G.nat[pid]-=.035;addRel(pid,-18);
    if(rnd()<.25){G.me.nb=clamp(G.me.nb-4,0,100);if(rnd()<.35)newCase({kind:'pidana',bukti:45,media:50});return {ok:true,msg:'Provokasi Anda viral, tapi '+nm+' melaporkan balik dengan pasal pencemaran nama baik.'};}
    popAdd(homeProv(),2);return {ok:true,msg:'Serangan Anda terhadap '+nm+' ramai di media. Elektabilitas mereka tergerus.'};}
  if(id==='suap'){addRel(pid,22);G.dipl.pledge[pid]=G.t+6;G.me.amplop=(G.me.amplop||0)+10;G.law.stl=clamp(G.law.stl+3,0,30);
    if(rnd()<.12){G.me.nb=clamp(G.me.nb-8,0,100);newCase({kind:'suap',bukti:60,media:70});return {ok:true,msg:'Amplop sampai, tapi seorang anggota '+nm+' membocorkannya ke penyidik.'};}
    return {ok:true,msg:'Amplop terbagi rata. '+nm+' kini sangat ramah, dan akan mendukung usulan Anda.'};}
}
function leaveCoal(pid){diplInit();if(!inCoal(pid))return 'Tidak berkoalisi.';delete G.dipl.coal[pid];addRel(pid,-10);G.blok[pid]='imbang';return {ok:true,msg:FORMS[pid].abbr+' keluar dari koalisi Anda.'};}

function gugatTokoh(pid,name){const c=gugatTokohCan(pid);if(c!==true)return c;G.ap--;G.me.dana=r1(G.me.dana-3);diplInit();
  const org=has('kpk')?'KPK':'Kejaksaan Agung';const p=clamp(.25+(has('kpk')?G.inst.kpkInd:G.inst.kejaInd)/250+G.me.pengaruh/400,.1,.7);addRel(pid,-25);

  G.me.nb=clamp(G.me.nb-4,0,100);if(rnd()<.3)newCase({kind:'pidana',bukti:45,media:55});return {ok:true,msg:'Laporan Anda terhadap '+name+' kandas. Kubunya balas menuduh Anda memfitnah.'};}
function diplMonth(){diplInit();const R=G.dipl.rel;Object.keys(R).forEach(k=>{R[k]*=.985;});
  Object.keys(G.dipl.coal).forEach(pid=>{if((R[pid]||0)<-10||!G.active.includes(pid)){delete G.dipl.coal[pid];if(G.blok)G.blok[pid]='imbang';addLog((FORMS[pid]?FORMS[pid].abbr:pid)+' meninggalkan koalisi Anda.',true);}else if(G.blok)G.blok[pid]=G.blok[G.form]||G.blok[pid];});
  Object.keys(G.dipl.jailed).forEach(n=>{if(G.t-G.dipl.jailed[n]>36)delete G.dipl.jailed[n];});}

function calegCan(lvl,pv){const w=calegWindow();if(!w)return 'Pendaftaran caleg sedang tutup.';if(!G.active.includes(G.form))return 'Partai Anda tidak ikut pemilu ini.';

function partySeatsIn(r,pv,lvl){if(!r.player||!r.provs[pv])return 0;if(lvl==='dpr')return (r.alloc&&r.alloc[pv]&&r.alloc[pv][r.player])||0;return Math.round(r.provs[pv][r.player]*dprdSize(pv));}
