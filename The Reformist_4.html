  const E=G.eco,gov=playerGov(),f=x=>(Math.round(x*10)/10).toString().replace('.',',');const X=expVal(),M=impVal(),nr=sum(X)-sum(M);
  let h=`<div class="tiles">
   <div><span class="small">PDB per kapita</span><b>US$${fmt(pdbKapita())}</b></div>
   <div><span class="small">Pertumbuhan</span><b class="${E.tumbuh<0?'noc':''}">${E.tumbuh>0?'+':''}${f(E.tumbuh)}%</b>${spark('tumbuh','var(--good)')}</div>
   <div><span class="small">Inflasi</span><b class="${E.inflasi>10?'noc':''}">${f(E.inflasi)}%</b>${spark('inflasi','var(--bad)')}</div>
   <div><span class="small">Pengangguran</span><b>${f(E.nganggur)}%</b></div>
   <div><span class="small">Kurs</span><b>Rp${fmt(G.kurs)}</b></div>
   <div><span class="small">Cadangan devisa</span><b>US$${fmt(E.cadev)} M</b><span class="tiny muted">dalam miliar dolar</span></div>
   <div><span class="small">Kas negara</span><b>Rp${fmt(E.kas)} T</b></div>
   <div><span class="small">Utang</span><b>${E.utang}% PDB</b></div>
   <div><span class="small">Indeks saham</span><b>${fmt(E.ihsg)}</b></div>
   <div><span class="small">Neraca dagang</span><b class="${nr<0?'noc':'okc'}">${nr>=0?'+':''}US$${f(nr)} M</b><span class="tiny muted">miliar dolar per tahun</span></div></div>`;
  h+=`<details open><summary>Anggaran negara</summary><p class="small muted">${gov?'Anda menyusun APBN. 23 persen terikat untuk belanja pegawai; sisanya dibagi ke tujuh sektor. Perubahan anggaran gratis, tidak memakai aksi.':'Anggaran disusun pemerintah '+esc(FORMS[govParty()].abbr)+'.'}</p><div class="apbn">${SEKTOR.map(([k,n])=>`<div><span>${esc(n)}</span><i><b style="width:${G.apbn[k]*2.5}%"></b></i><em>${G.apbn[k]}%</em>${gov?`<span class="stepper"><button data-a="apbn" data-k="${k}" data-d="-1" aria-label="Kurangi">−</button><button data-a="apbn" data-k="${k}" data-d="1" aria-label="Tambah"${sum(G.apbn)>=APBN_TOTAL?' disabled':''}>+</button></span>`:''}</div>`).join('')}</div>${gov?`<p class="tiny">Belum dialokasikan: ${APBN_TOTAL-sum(G.apbn)}%</p>`:''}
   <p class="tiny muted">Pendidikan menaikkan modal manusia jangka panjang. Kesehatan melindungi dari pandemi. Infrastruktur menaikkan pertumbuhan. Pertahanan memperkuat militer. Subsidi dan bansos membeli kepuasan dengan kas. Keamanan memperkuat intelijen dan stabilitas.</p></details>`;
  h+=`<details open><summary>Moneter dan kurs</summary><div class="kv"><span>Suku bunga acuan <b>${E.bunga.toFixed(2).replace('.',',')}%</b></span><span>Cadangan devisa <b>US$${fmt(E.cadev)} miliar</b></span></div>${gov?`<div class="row"><button class="btn ghost" data-a="bunga" data-d="-0.5">Turunkan bunga 0,5</button><button class="btn ghost" data-a="bunga" data-d="0.5">Naikkan bunga 0,5</button><button class="btn ghost" data-a="interv"${E.cadev<6?' disabled':''}>Intervensi valas (US$5 M)</button></div><p class="tiny muted">Bunga tinggi menekan inflasi dan menguatkan rupiah, tapi memperlambat ekonomi dan menekan saham bank. Masing-masing memakai 1 aksi.</p>`:''}</details>`;
  h+=`<details open><summary>Ekspor dan impor</summary><table class="dag"><thead><tr><th>Komoditas</th><th>Harga dunia</th><th>Nilai</th><th>Kebijakan</th></tr></thead><tbody>${KOMOD.map(([k,n])=>`<tr><td>${esc(n)}</td><td class="num">${Math.round(E.harga[k])}</td><td class="num">US$${f(X[k])} M</td><td>${gov?['bebas','pajak','larang'].map(o=>`<button class="chip" data-a="dag" data-c="${k}" data-v="${o}" aria-pressed="${G.dag[k]===o}">${o==='larang'?'larang mentah':o}</button>`).join(''):esc(G.dag[k])}</td></tr>`).join('')}
   <tr><td>Manufaktur</td><td class="num">-</td><td class="num">US$${f(X.manuf)} M</td><td class="tiny muted">ikut modal manusia dan kurs</td></tr>
   ${IMPOR.map(([k,n])=>`<tr><td>Impor ${esc(n.toLowerCase())}</td><td></td><td class="num">US$${f(M[k])} M</td><td>${gov?['bebas','tarif','kuota'].map(o=>`<button class="chip" data-a="dag" data-c="${k}" data-v="${o}" aria-pressed="${G.dag[k]===o}">${o}</button>`).join(''):esc(G.dag[k])}</td></tr>`).join('')}
   <tr><td>Impor barang modal</td><td></td><td class="num">US$${f(M.modal)} M</td><td class="tiny muted">ikut pertumbuhan</td></tr></tbody></table>
   <p class="tiny muted">Pajak ekspor mengisi kas tapi mengurangi nilai ekspor. Larangan ekspor nikel mentah menurunkan ekspor dulu lalu melipatgandakannya setelah smelter berdiri. Tarif dan kuota impor pangan melindungi petani tapi menaikkan inflasi. Mengubah kebijakan dagang memakai 1 aksi.</p></details>`;
  const pv=portVal();
  h+=`<details open><summary>Saham pribadi</summary><div class="kv"><span>Portofolio <b>Rp${r1(pv)} M</b></span><span>Dana pribadi <b>Rp${fmt(G.me.dana)} M</b></span></div><table class="dag"><thead><tr><th>Sektor</th><th>Harga</th><th>Milik Anda</th><th></th></tr></thead><tbody>${SAHAM.map(([k,n])=>{const u=G.me.port[k]||0;return `<tr><td>${esc(n)}</td><td class="num">${Math.round(G.saham[k])}</td><td class="num">${u?'Rp'+r1(u*G.saham[k]/100)+' M':'-'}</td><td><button class="chip" data-a="beli" data-k="${k}"${G.me.dana<5?' disabled':''}>Beli Rp5 M</button>${u?`<button class="chip" data-a="jual" data-k="${k}">Jual</button>`:''}</td></tr>`;}).join('')}</tbody></table><p class="tiny muted">Harga sektor ikut indeks saham, suku bunga, harga komoditas, kepuasan rakyat, dan kebijakan. Jual-beli tidak memakai aksi. Presiden yang memegang banyak saham di sektor yang ia atur berisiko tersandung skandal.</p></details>`;
  h+=`<details><summary>Proyek pembangunan dan perjanjian dagang</summary>${tabEkonomi()}</details>`;
  return h;
}
/* ---------- tab militer ---------- */
function tabMiliter(){
  const gov=playerGov(),M=G.mil;let h=`<div class="tiles"><div><span class="small">Kekuatan militer</span><b>${Math.round(M.kuat)}</b></div><div><span class="small">Intelijen</span><b>Tingkat ${M.intel}</b></div><div><span class="small">Sorotan HAM dunia</span><b class="${G.ham>50?'noc':''}">${Math.round(G.ham)}</b></div><div><span class="small">Dukungan TNI</span><b>${Math.round(G.grp.tni)}</b></div><div><span class="small">Markas</span><b>${Object.keys(M.markas).length}</b><span class="tiny muted">provinsi</span></div></div>`;
  if(!gov)h+=`<p class="small muted">Perintah militer hanya bisa diberikan oleh presiden. Bila partai Anda berkuasa lewat jalur otoriter atau Anda terpilih sebagai presiden, menu ini terbuka penuh.</p>`;
  if(M.order.length)h+=`<div class="sect"><span>Alutsista dalam pengiriman</span></div><ul class="sched">${M.order.map(o=>`<li><b>${esc(o.name)}</b><span>dari ${esc(o.dari)}, tiba ${esc(tDate(o.due))}, kekuatan +${o.kuat}</span></li>`).join('')}</ul>`;
  h+=`<div class="sect"><span>Perintah di ${esc(PBY[U.prov].name)}</span><span class="small muted">separatisme ${Math.round(G.sep[U.prov])}</span></div><div class="acts">`;
  MILACT.filter(a=>a.tg==='prov').forEach(a=>{const c=gov?milCan(a.id,U.prov):'Hanya presiden.';h+=milBtn(a,c);});
  h+=`</div><div class="sect"><span>Intelijen dan aparat</span></div><div class="acts">`;
  MILACT.filter(a=>a.tg!=='prov').forEach(a=>{const c=gov?milCan(a.id):'Hanya presiden.';h+=milBtn(a,c);});
  h+=`</div><div class="sect"><span>Beli alutsista</span></div><div class="chips" style="margin-bottom:6px">${SUPPLIER.map(s=>`<button class="chip" data-a="sup" data-s="${s.id}" aria-pressed="${(U.sup||'rusia')===s.id}">${esc(s.name)}</button>`).join('')}</div>`;
  const S=SUPPLIER.find(s=>s.id===(U.sup||'rusia'));const sr=S.req();
  h+=sr!==true?`<p class="tiny noc">${esc(sr)}</p>`:'';
  h+=`<div class="acts">${ALUT.map(A=>{const cost=r1(A.cost*(S.cost||1));const c=!gov?'Hanya presiden.':G.t<A.minT?'Belum tersedia sebelum '+tDate(A.minT)+'.':sr!==true?sr:govCan(cost);const ok=c===true;
    return `<div class="act${ok?'':' dis'}"><span class="nm">${esc(A.name)}</span><span class="bl">${esc(ok?'Kekuatan +'+Math.round(A.kuat*S.k)+', tiba dalam '+A.months+' bulan.':c)}</span><span class="cs"><span>Rp${cost} T</span><span class="row" style="gap:4px;justify-content:flex-end"><button class="btn" data-a="alut" data-id="${A.id}"${ok?'':' disabled'}>Pesan</button><button class="btn ghost" data-a="alut" data-id="${A.id}" data-m="1"${ok?'':' disabled'} title="Komisi gelap untuk kantong pribadi">Dengan komisi</button></span></span></div>`;}).join('')}</div>`;
  h+=`<p class="tiny muted">Penculikan, penangkapan, dan bredel menekan oposisi dan suhu jalanan, tapi menaikkan sorotan HAM. Sorotan HAM di atas 60 membekukan perjanjian dagang dengan Amerika dan Eropa, membuat investor asing menjauh, dan menurunkan kepuasan.</p>`;
  return h;
}
function milBtn(a,c){const ok=c===true;return `<button class="act${['culik','tangkap','bredel'].includes(a.id)?' dark':''}" data-a="mil" data-id="${a.id}"${ok?'':' disabled'}><span class="nm">${esc(a.name)}</span><span class="bl">${esc(ok?a.blurb:c)}</span><span class="cs"><span>${a.cost?'Rp'+a.cost+' T':'tanpa biaya'}</span><span class="muted">1 aksi</span></span></button>`;}
/* ---------- tombol tambahan ---------- */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||!G)return;const a=b.dataset.a;
  if(a==='play'){U.play=!U.play;if(!U.speed)U.speed=1;render();tick();return;}
  if(a==='speed'){U.speed=+b.dataset.s;if(!U.play){U.play=true;}render();tick();return;}
  if(a==='restart'||a==='lanjut'){U.play=false;}
  if(a==='closepanel'){U.panel=false;render();return;}
  if(a==='zreset'){animVb(presetVb('all'));return;}
  if(a==='apbn'){const r=setApbn(b.dataset.k,(+b.dataset.d)*1);if(r!==true)flash(r);render();return;}
  if(a==='bunga'){const r=setBunga(+b.dataset.d);flash(r.ok?r.msg:r);render();return;}
  if(a==='interv'){const r=intervensi();flash(r.ok?r.msg:r);render();return;}
  if(a==='dag'){const r=setDag(b.dataset.c,b.dataset.v);flash(r.ok?r.msg:r);render();return;}
  if(a==='beli'){const r=beli(b.dataset.k,5);flash(r.ok?r.msg:r);render();return;}
  if(a==='jual'){const r=jual(b.dataset.k);flash(r.ok?r.msg:r);render();return;}
  if(a==='sup'){U.sup=b.dataset.s;render();return;}
  if(a==='alut'){const r=beliAlut(b.dataset.id,U.sup||'rusia',!!b.dataset.m);flash(r.ok?r.msg:r);render();return;}
  if(a==='mil'){const r=doMil(b.dataset.id,U.prov);flash(r.ok?r.msg:r);render();return;}
  if(a==='lanjut'){continueGame();U.screen='game';render();return;}
});
addEventListener('resize',()=>{if(U.screen==='game'&&G&&$('mapbox')){syncAspect();applyVb();}});
