/* ---------- pilkada lewat DPRD ---------- */
function pilkadaFactions(pv){const r=G.res['04']||G.res['99']||G.res['97'];const sz=dprdSize(pv);const F={};
  const mp=i=>G.active.includes(i)?i:(i==='gol'&&G.active.includes('golb'))?'golb':(i==='pdi'&&G.active.includes('pdmp'))?'pdmp':(i==='gol'&&G.form==='gol')?'gol':i;
  if(r&&r.provs[pv]){const s=r.provs[pv];const a=allocSeats(s,sz);Object.keys(a).forEach(i=>{const k=mp(i);if(a[i]>0&&FORMS[k])F[k]=(F[k]||0)+a[i];});}
  if(!G.pol.dwifungsi)F.tni=Math.round(sz*.1);return F;}
function pilkadaRival(F){return Object.keys(F).filter(i=>i!=='tni'&&i!==G.form).sort((a,b)=>F[b]-F[a])[0];}
function pilkadaPrice(fid,seats,lvl,pv){if(fid==='tni')return Math.ceil(seats*(G.abri>=55?.3:.9)*(lvl==='gubernur'?1.2:.7));const c=compat(fid,G.form);return Math.max(1,Math.ceil(seats*(1.3-c)*(lvl==='gubernur'?1.1:.6)*(1-(G.me.pop[pv]-45)/150)));}
function pilkadaEndorse(){return isKetum()||G.me.rank>=2||(G.me.rel[ketumFac()]||0)>=-10;}
function pilkadaTally(lvl,pv,off){const F=pilkadaFactions(pv),rival=pilkadaRival(F);let me=0,rv=0,ab=0;const side={};
  Object.keys(F).forEach(i=>{let s;if(i===G.form)s='anda';else if(i===rival)s='lawan';else{const pr=pilkadaPrice(i,F[i],lvl,pv);const ok=i==='tni'||compat(i,G.form)>=.3;s=ok&&((off[i]||0)+(off._wakil===i?pr:0)>=pr)?'anda':(i==='tni'||compat(i,rival)>=.3)?'lawan':'abstain';}
    side[i]=s;if(s==='anda')me+=F[i];else if(s==='lawan')rv+=F[i];else ab+=F[i];});
  return {F,me,rv,ab,side,rival,need:Math.floor((me+rv+ab)/2)+1};}
function pilkadaResolve(lvl,pv,off){if(G.power)return {win:false,T:pilkadaTally(lvl,pv,{}),spent:0};const T=pilkadaTally(lvl,pv,off);const spent=Object.keys(off).filter(k=>k!=='_wakil').reduce((a,k)=>a+off[k],0);
  G.me.dana=r1(G.me.dana-spent);if(spent>0){G.me.nb=clamp(G.me.nb-spent/3,0,100);G.me.amplop=(G.me.amplop||0)+spent;}
  let defect=0;Object.keys(T.side).forEach(i=>{if(T.side[i]==='anda'&&i!==G.form&&i!=='tni'&&off._wakil!==i&&compat(i,T.rival)>compat(i,G.form)&&rnd()<.3){T.side[i]='lawan';T.me-=T.F[i];T.rv+=T.F[i];defect+=T.F[i];}});T.defect=defect;
  const win=T.me>=T.need;
  if(win){if(G.me.kursi&&['dpr','dprd','walikota'].includes(G.me.kursi.type))addLog('Anda melepas kursi '+kursiTitle()+'.',false);G.me.kursi={type:lvl,pv,since:G.t};G.me.pengaruh=clamp(G.me.pengaruh+(lvl==='gubernur'?12:7),0,100);popAdd(pv,10);G.me.apbd=0;
    addLog('DPRD memilih Anda sebagai '+kursiTitle()+' dengan '+T.me+' suara.',true);decide('Terpilih sebagai '+kursiTitle());}
  else{G.me.pengaruh=clamp(G.me.pengaruh-3,0,100);addLog('Anda kalah dalam pemilihan '+(lvl==='gubernur'?'gubernur '+PBY[pv].name:'walikota '+KOTA[pv])+' di DPRD.',true);}
  return {win,T,spent};}

/* ---------- kongres ---------- */
function kongresCands(){
  const inc=G.ketum.player?{player:true,inc:true,name:G.me.name,fac:G.ketum.fac}:{inc:true,name:G.ketum.name,fac:G.ketum.fac};
  const others=G.facs.filter(f=>f.id!==G.ketum.fac&&f.lead!==G.me.name).sort((a,b)=>b.str-a.str);
  const ch=others[0]?{name:others[0].lead,fac:others[0].id}:null;
  const c=[inc];if(ch)c.push(ch);
  if(!G.ketum.player&&kongresEligible()===true)c.push({player:true,name:G.me.name,fac:G.facs.slice().sort((a,b)=>G.me.rel[b.id]-G.me.rel[a.id])[0].id});
  return c;}
function kongresEligible(){if(G.me.rank>=3&&G.me.pengaruh>=40)return true;return 'Butuh jabatan pengurus DPP dan pengaruh minimal 40 untuk maju.';}
function kongresVote(opt,noise){
  const C=kongresCands(),tot=C.map(()=>0);const running=opt.mode==='maju'||G.ketum.player;
  G.facs.forEach(f=>{const sc=C.map(c=>{if(c.player){if(!running)return -9;return G.me.rel[f.id]/55+(G.me.pengaruh-55)/30+(popNat()-30)/50+(G.me.nb-50)/100+(opt.money||0)*.08+(opt.deal===f.id?.9:0)+(c.inc?.35+(G.ketum.kuat-50)/70:0)+(G.me.kursi?(G.me.kursi.type==='presiden'?1.5:G.me.kursi.type==='gubernur'?.5:.2):0);}
      let s=(c.fac===f.id?1.8:0)+(c.inc?.6+(G.ketum.kuat-50)/60:0)+(!c.player&&!c.inc?.25:0);if(!running&&opt.mode&&opt.mode!=='maju'){const tgt=opt.mode==='inc'?C[0]:C[1];if(tgt===c)s+=G.me.pengaruh/90+G.me.rel[f.id]/150;}return s+(noise?noise():0);});
    const e=sc.map(s=>Math.exp(1.7*s)),z=e.reduce((a,b)=>a+b,0);e.forEach((v,k)=>tot[k]+=f.str*v/z);});
  return {C,tot};}
function kongresResolve(opt){
  const noise=()=>(rnd()-.5)*.5;const V=kongresVote(opt,noise);let wi=0;V.tot.forEach((v,k)=>{if(v>V.tot[wi])wi=k;});const W=V.C[wi];
  const spent=(opt.money||0)*5;if(spent){G.me.dana=r1(G.me.dana-spent);G.me.nb=clamp(G.me.nb-spent/2.5,0,100);G.me.amplop=(G.me.amplop||0)+spent;}
  if(opt.deal&&(opt.mode==='maju'||G.ketum.player))G.me.rel[opt.deal]=clamp(G.me.rel[opt.deal]+10,-100,100);
  const wasK=G.ketum.player;let msg='';
  if(W.player){
    G.me.rank=5;G.ketum={player:true,name:G.me.name,fac:W.fac,kuat:62};G.me.pengaruh=clamp(G.me.pengaruh+10,0,100);
    msg=wasK?'Anda terpilih kembali sebagai ketua umum.':'Anda terpilih sebagai ketua umum '+FORMS[G.form].name+'. Kas, arah, dan nasib partai kini di tangan Anda.';
    if(!wasK){decide('Terpilih sebagai ketua umum dalam kongres');if(opt.deal){const f=facBy(opt.deal);msg+=' '+f.lead+' menjadi sekretaris jenderal sesuai kesepakatan.';}}
  }else{
    const prevPlayer=wasK;G.ketum={name:W.name,fac:W.fac,kuat:60};
    if(prevPlayer){G.me.rank=3;G.me.pengaruh=clamp(G.me.pengaruh-12,0,100);msg='Anda kalah dan kehilangan kursi ketua umum. '+W.name+' kini memimpin partai.';decide('Kehilangan kursi ketua umum di kongres');}
    else{
      const backed=opt.mode==='inc'?V.C[0]:opt.mode==='chal'?V.C[1]:null;
      if(opt.mode==='maju'){G.me.pengaruh=clamp(G.me.pengaruh-8,0,100);G.me.rel[W.fac]=clamp(G.me.rel[W.fac]-20,-100,100);msg='Anda kalah. '+W.name+' terpilih sebagai ketua umum.';
        if(G.me.rel[W.fac]<=-40&&rnd()<.4){G.me.rank=Math.min(G.me.rank,1);msg+=' Kubu pemenang membersihkan pengurus yang melawan, termasuk Anda.';}}
      else if(backed&&backed.name===W.name&&G.me.rank<2){msg=W.name+' terpilih, dan Anda berada di kubu pemenang. Nama Anda mulai dikenal pengurus pusat.';G.me.pengaruh=clamp(G.me.pengaruh+4,0,100);G.me.rel[W.fac]=clamp(G.me.rel[W.fac]+10,-100,100);}
      else if(backed&&backed.name===W.name){const nr=Math.min(4,G.me.rank+1);msg=W.name+' terpilih, dan Anda berada di kubu pemenang. Anda diangkat menjadi '+RANKN[nr].toLowerCase()+'.';G.me.rank=Math.max(G.me.rank,nr);if(G.me.rank>=3)G.me.dpd=null;G.me.pengaruh=clamp(G.me.pengaruh+8,0,100);G.me.rel[W.fac]=clamp(G.me.rel[W.fac]+15,-100,100);}
      else if(backed){msg=W.name+' terpilih. Calon yang Anda dukung kalah.';G.me.pengaruh=clamp(G.me.pengaruh-6,0,100);G.me.rel[W.fac]=clamp(G.me.rel[W.fac]-12,-100,100);if(G.me.rank>=3&&rnd()<.5){G.me.rank=2;G.me.dpd=G.me.asal;msg+=' Anda dicopot dari DPP dan dikembalikan ke daerah.';}}
      else msg=W.name+' terpilih sebagai ketua umum.';
    }
  }
  const pct=V.tot.map(v=>Math.round(v));
  addLog('Kongres '+FORMS[G.form].abbr+': '+V.C.map((c,k)=>c.name+' '+pct[k]+'%').join(', ')+'.',true);
  return {W,V,msg,pct};
}

/* ---------- bulanan ---------- */
function careerMonth(){
  const m=G.me,k=m.kursi;
  const inc=.6+(m.rank>=2?.4*m.rank:0)+(m.bg==='pengusaha'?1.5:0)+(k?{dprd:1,dpr:2.2,walikota:2,gubernur:3,presiden:0}[k.type]:0)+(m.menteri?3:0);
  m.dana=r1(m.dana+inc*DIFFS[G.diff].dana);
  m.pengaruh=clamp(m.pengaruh-.7+m.rank*.12+(k?{dprd:.1,dpr:.3,walikota:.2,gubernur:.45,presiden:1.5}[k.type]:0)+(m.menteri?.5:0),0,100);
  if(m.pengaruh>65)m.pengaruh-=(m.pengaruh-65)*.05;
  PROVS.forEach(p=>{m.pop[p.id]=clamp(m.pop[p.id]*.988,0,100);});

function careerSchedule(t){
  // dipanggil setelah G.t bertambah
  if(KONGRES_T.includes(G.t)||G.klbT===G.t){if(G.klbT===G.t)G.klbT=null;if(FORMS[G.form]&&!(G.power&&!ELECT(G.power.route)))G.queue.push({type:'kongres',t:G.t,klb:!KONGRES_T.includes(G.t)});}
  else if(G.ketum.player&&G.ketum.kuat<22&&!G.klbT&&rnd()<.25){G.klbT=G.t+1;addLog('Faksi-faksi menggalang mosi tidak percaya terhadap Anda. Kongres luar biasa bulan depan.',true);}
  if(MUSDA_T.includes(G.t)&&!isKetum()&&G.me.rank>=1&&G.me.rank<=2)pushEvD('musda',{pv:G.me.asal});
  if(PILKADA_T.includes(G.t)&&G.era!=='ob'&&!G.power&&G.active.includes(G.form)&&!(G.me.kursi&&['gubernur','presiden'].includes(G.me.kursi.type)))pushEvD('pilkada',{pv:homeProv()});
  if(!isKetum()&&G.me.rank===2&&G.me.pengaruh>=50&&!G.used.dpp&&rnd()<.1){G.used.dpp=1;pushEv('dpp');}
  if(PRES_T.some(p=>p-4===G.t)&&G.pol.pilsung&&G.era==='ref'&&!isKetum()&&G.me.rank>=3&&G.active.includes(G.form)&&!G.power)pushEv('konvensi');
  if(G.t%12===0&&G.me.age+Math.floor(G.t/12)>=70&&!G.queue.some(q=>q.id==='regenerasi')&&(G.me.age+Math.floor(G.t/12)>=80||rnd()<.35))pushEv('regenerasi');
}
function autoOffers(F,si){const offers={};let pool=POOL;const rv=mprRival(F);const cands=Object.keys(F).filter(i=>i!=='tni'&&i!==G.form&&i!==rv&&mprStance(i)==='nego');
  const big=cands.slice().sort((a,b)=>F[b]-F[a])[0];if(big)offers._wapres=big;
  cands.sort((a,b)=>F[b]/mprPrice(b,F[b],si)-F[a]/mprPrice(a,F[a],si)).forEach(i=>{const pr=Math.max(0,mprPrice(i,F[i],si)-(offers._wapres===i?WAPRES:0));if(pr<=pool){offers[i]=pr;pool-=pr;}});return offers;}
function npcPartyMpr(si){
  const F=mprFactions(si);const T=mprTally(F,autoOffers(F,si),si);const need=mprNeed(F);
  if(T.me>=need){G.npcPres={party:G.form,name:candName()};G.blok={};Object.keys(T.side).forEach(i=>G.blok[i]=T.side[i]==='anda'?'pem':T.side[i]==='lawan'?'opo':'imbang');
    addLog('MPR memilih calon partai Anda, '+candName()+', sebagai presiden.',true);menteriOffer();return true;}
  G.npcPres={party:T.rival,name:npcName(T.rival)};G.blok={};Object.keys(T.side).forEach(i=>G.blok[i]=T.side[i]==='lawan'?'pem':T.side[i]==='anda'?'opo':'imbang');
  addLog('MPR memilih '+G.npcPres.name+' ('+FORMS[T.rival].abbr+') sebagai presiden.',true);if(G.blok[G.form]==='pem')menteriOffer();return false;
}
function menteriOffer(){if(!isKetum()&&G.me.rank>=3&&(G.me.rel[ketumFac()]||0)>=-5&&!(G.me.kursi&&['gubernur','walikota','presiden'].includes(G.me.kursi.type)))pushEv('menteri');}
function npcPartyPilpres(){const P=pilpresPartners().filter(x=>x.ok&&!x.pay).sort((a,b)=>b.share-a.share);const partner=P[0]?P[0].id:null;
  const R=pilpresCalc(partner);const p=clamp(R.p-(G.legit-50)/500+(G.ketum.kuat-50)/500+(rnd()-.5)*.06,.01,.99);
  if(p>.5){G.npcPres={party:G.form,name:candName()};G.blok={};G.active.forEach(i=>G.blok[i]=i===G.form||i===partner?'pem':'imbang');addLog('Calon partai Anda, '+candName()+', memenangi pemilihan presiden.',true);menteriOffer();}
  else{G.npcPres={party:R.rival,name:npcName(R.rival)};G.blok={};G.active.forEach(i=>G.blok[i]=i===R.rival||i===R.rp?'pem':i===G.form?'opo':'imbang');addLog(G.npcPres.name+' ('+FORMS[R.rival].abbr+') memenangi pemilihan presiden, mengalahkan calon partai Anda.',true);}
  return p>.5;}

function foundParty(to){
  doShift(to);G.me.rank=5;G.me.dpd=null;G.ketum={player:true,name:G.me.name,fac:'loyalis',kuat:65};
  const fs=FIGURES.filter(f=>f.forms.includes(to));
  G.facs=[{id:'loyalis',name:'Loyalis pendiri',lead:G.me.name,str:50},{id:'garis',name:'Kubu garis keras',lead:(fs[0]&&fs[0].name!==G.me.name?fs[0].name:'Bung Sakti Harahap'),str:28},{id:'moderat',name:'Kubu moderat',lead:(fs[1]?fs[1].name:'Ir. Dewi Kartikasari'),str:22}];
  G.me.rel={loyalis:80,garis:10,moderat:10};
  G.kader=clamp(Math.min(G.kader,22+G.me.pengaruh/3),5,100);G.massa=clamp(G.massa*.6+G.me.pengaruh/5,0,100);G.dana=r1(G.me.dana*.5+5);G.me.dana=r1(G.me.dana*.5);
  addLog('Anda keluar dan mendirikan '+FORMS[to].name+', lalu menjadi ketua umumnya.',true);decide('Mendirikan '+FORMS[to].name);
}
function joinCanLead(to){return ['pkp','par'].includes(to)&&G.t<=19&&G.me.rank>=3;}
function joinParty(to,lead){
  if(lead&&joinCanLead(to)){foundParty(to);FORMS[to].leaderOrig=FORMS[to].leaderOrig||FORMS[to].leader;return;}
  doShift(to);G.me.rank=Math.min(G.me.rank,3);G.me.dpd=null;const L=FORMS[to].leader||NPC_LEAD[to]||'Dewan Pendiri';
  G.ketum={name:L,fac:'pendiri',kuat:62};G.facs=[{id:'pendiri',name:'Kubu pendiri',lead:L,str:55},{id:'muda',name:'Kubu muda',lead:'Rizal Pratama Nugraha',str:25},{id:'daerah',name:'Kubu daerah',lead:'Hj. Sri Wulandari',str:20}];
  G.me.rel={pendiri:25,muda:10,daerah:10};addLog('Anda bergabung dengan '+FORMS[to].name+' sebagai '+RANKN[G.me.rank].toLowerCase()+'.',true);decide('Bergabung dengan '+FORMS[to].name);
}

function directPilkada(lvl,pv,money){
  if(money){G.me.dana=r1(G.me.dana-money);G.me.nb=clamp(G.me.nb-8,0,100);G.me.amplop=(G.me.amplop||0)+money;}
  const sh=G.active.includes(G.form)?shares(pv)[G.form]:0;const gov=govParty()===G.form?1:-1;
  const p=clamp(.06+G.me.pop[pv]/105+sh*1.1+(G.kep-50)/300*gov+(G.me.nb-50)/250+money*.012-(lvl==='gubernur'?.1:0),.04,.93);
  if(rnd()<p){if(G.me.kursi&&['dpr','dprd','walikota'].includes(G.me.kursi.type))addLog('Anda melepas kursi '+kursiTitle()+'.',false);G.me.kursi={type:lvl,pv,since:G.t};G.me.apbd=0;G.me.pengaruh=clamp(G.me.pengaruh+(lvl==='gubernur'?10:6),0,100);popAdd(pv,10);
    addLog('Rakyat memilih Anda sebagai '+kursiTitle()+'.',true);decide('Menang pilkada langsung: '+kursiTitle());return 'Hitung cepat menunjukkan Anda menang. Anda kini '+kursiTitle()+'. (Peluang '+Math.round(p*100)+'%)';}
  G.me.pengaruh=clamp(G.me.pengaruh-3,0,100);addLog('Anda kalah dalam pilkada langsung di '+PBY[pv].name+'.',true);return 'Anda kalah tipis. Rakyat memilih calon lain. (Peluang '+Math.round(p*100)+'%)';
}

   if(isOpp())c.push({l:'Serukan rakyat turun ke jalan',h:'Massa +10, suhu politik naik, sorotan +8.',run(){bump('massa',10);G.suhu+=6;bump('sorotan',8);return 'Seruan Anda dibacakan di mimbar-mimbar kampus.';}});
   else c.push({l:'Salahkan spekulan dan pedagang perantara',h:'Mengalihkan amarah publik. Berisiko menyulut kekerasan terhadap warga Tionghoa.',run(){G.suhu+=8;G.stab-=6;bump('legit',-6);G.rezim+=3;G.flags.kambing=true;return 'Pidato Anda diulang di banyak tempat dengan nada yang jauh lebih gelap.';}});
   return c;}},
 {id:'su98',t:14,title:'Sidang Umum MPR 1998',cond:()=>!G.power,
  text:()=>'Seluruh fraksi MPR bulat memilih kembali '+PRESIDEN+' untuk masa jabatan ketujuh. Wakil presiden baru adalah teknokrat Prof. Ir. Darmawan Kusnadi. Kabinet baru diisi kerabat dan kroni. Di luar gedung, mahasiswa membakar ban.',
  ch:()=>isOpp()?[
    {l:'Tolak dan tarik diri dari sidang',h:'Legitimasi +6, massa +6, sorotan +8.',run(){bump('legit',6);bump('massa',6);bump('sorotan',8);return 'Kursi fraksi Anda kosong di foto resmi sidang.';}},
    {l:'Ikut mengangguk',h:'Dana +5, legitimasi -6.',run(){bump('dana',5);bump('legit',-6);return 'Anda pulang dengan tas hadiah dan rasa tidak enak.';}}]
   :[{l:'Bersorak di Senayan',h:'ABRI +3, legitimasi -4, Orde Baru menguat.',run(){bump('abri',3);bump('legit',-4);G.rezim+=5;return 'Tepuk tangan bergemuruh selama tiga menit.';}},
     {l:'Bisikkan perlunya suksesi',h:'Legitimasi +5, ABRI -3.',run(){bump('legit',5);bump('abri',-3);G.flags.suksesi=true;return 'Bisikan Anda sampai ke beberapa telinga yang tepat, dan beberapa yang salah.';}}]},
 {id:'hilang',t:15,title:'Mereka yang hilang',cond:()=>!G.power,
  data:()=>{const f=figs().filter(x=>figActive(x))[0];return {f:isOpp()&&f?f.id:null};},
  text:d=>{const f=d&&d.f?FIGURES.find(x=>x.id===d.f):null;return isOpp()?(f?f.name+' tidak pulang sejak Selasa malam. Rumahnya didatangi orang berbadan tegap tanpa seragam. Ia bukan satu-satunya: belasan aktivis hilang dalam sebulan terakhir.':'Belasan aktivis hilang dalam sebulan terakhir. Beberapa kader Anda menerima telepon tanpa nama.'):'Laporan intel menyebut satuan elite menculik belasan aktivis. Sebagian dilepas dengan cerita penyiksaan, sebagian tak pernah kembali.';},
  ch:d=>isOpp()?[
    {l:'Umumkan ke pers dan komisi HAM',h:'Legitimasi +6, massa +5, sorotan +6.',run(){if(d&&d.f)G.figOut[d.f]=G.t+5;bump('legit',6);bump('massa',5);bump('sorotan',6);return 'Konferensi pers Anda dihadiri wartawan asing. Tekanan pada markas besar meningkat.';}},
    {l:'Tiarap dan lindungi yang tersisa',h:'Sorotan -15, kader -4.',run(){if(d&&d.f)G.figOut[d.f]=G.t+8;bump('sorotan',-15);bump('kader',-4);return 'Rumah aman dipindah tiga kali dalam seminggu.';}}]
   :[{l:'Diam, itu urusan tentara',h:'ABRI +4, legitimasi -3.',run(){bump('abri',4);bump('legit',-3);return 'Anda tidak bertanya. Kelak orang lain akan bertanya pada Anda.';}},
     {l:'Desak penyelidikan internal',h:'ABRI -6, legitimasi +5.',run(){bump('abri',-6);bump('legit',5);return 'Seorang jenderal menyebut nama Anda dalam rapat tertutup.';}}]},
 {id:'mei98',t:16,title:'Mei 1998',cond:()=>!G.power,
  text:()=>'Pada 12 Mei, empat mahasiswa tewas ditembak di kampus mereka di Grogol. Esoknya Jakarta, Solo, dan Medan terbakar. Lebih dari seribu orang tewas, ribuan bangunan dijarah, dan warga Tionghoa menjadi sasaran kekerasan, termasuk kekerasan seksual.'+(G.flags.kambing?' Kata-kata yang Anda ucapkan Januari lalu terdengar lagi di jalanan.':'')+' Mahasiswa menduduki gedung parlemen. Ketua MPR meminta presiden mundur. Para menteri satu per satu menyatakan tak bersedia duduk di kabinet baru.',
  ch:()=>{
   if(!isOpp()){const c=[];
     c.push({l:'Dukung transisi konstitusional',h:'Presiden mundur, wakil presiden naik. Era reformasi dimulai.'+(G.form==='gol'?' Partai berganti rupa menjadi Golkar Baru.':''),run(){reformasi();bump('legit',6);decide('Mendukung transisi Mei 1998');return 'Pukul sembilan pagi, 21 Mei, presiden membacakan pernyataan berhenti. Anda berdiri di barisan kedua, sudah menghitung langkah berikutnya.';}});
     if(G.form==='gol')c.push({l:'Pertahankan presiden dengan segala cara',h:'Jalur Orde Baru Abadi: darurat dan represi. Butuh posisi ketua umum, ABRI 55, dan dana Rp30 M.',req:()=>!isKetum()?'Hanya ketua umum yang bisa memutuskan ini.':G.abri>=55&&G.dana>=30?true:'Butuh ABRI 55 dan dana Rp30 M.',run(){G.dana-=30;G.obPath=true;startPower('ordebaru');bump('legit',-15);G.stab=clamp(G.stab-8,0,100);G.rezim=60;decide('Mempertahankan presiden, Mei 1998');addLog('Presiden bertahan. Keadaan darurat diumumkan.',true);return 'Panser berjaga di Senayan. Gedung parlemen dikosongkan dengan gas air mata. Presiden tetap di istana, dan Anda kini memegang kunci-kuncinya.';}});
     if(['gol','dpn'].includes(G.form))c.push({l:'Bentuk Dewan Penyelamat Nasional',h:'Kudeta militer. Butuh ABRI 65 dan jabatan sekretaris jenderal atau ketua umum.',req:()=>G.me.rank<4?'Butuh jabatan sekretaris jenderal atau ketua umum.':G.abri>=65?true:'Butuh hubungan ABRI minimal 65.',run(){if(G.form!=='dpn'){if(isKetum())doShift('dpn',true);else foundParty('dpn');}startPower('kudeta');bump('legit',-12);G.stab=clamp(G.stab+4,0,100);decide('Membentuk Dewan Penyelamat Nasional, Mei 1998');addLog('Dewan Penyelamat Nasional mengambil alih pemerintahan.',true);return 'Pukul empat pagi, RRI memutar mars militer. Presiden "beristirahat" di kediamannya. Dewan Penyelamat Nasional mengambil alih.';}});
     return c;}
   const c=[{l:'Ikut menduduki gedung parlemen',h:'Massa +12, legitimasi +8.',run(){reformasi();bump('massa',12);bump('legit',8);decide('Menduduki gedung parlemen, Mei 1998');return 'Ribuan mahasiswa dan kader Anda duduk di atap kubah hijau. Pada 21 Mei, presiden mundur.';}},
    {l:'Jaga kampung, lindungi warga dari penjarahan',h:'Legitimasi +12, stabilitas +4, kader +4.',run(){reformasi();bump('legit',12);G.stab+=4;bump('kader',4);decide('Melindungi warga saat kerusuhan Mei 1998');return 'Posko kader Anda menyembunyikan puluhan keluarga di rumah-rumah warga. Pada 21 Mei, presiden mundur.';}}];
   if(['prp','smn','hkn','bfd'].includes(G.form))c.push({l:'Dorong revolusi sekarang juga',h:'Massa +15, stabilitas -10, sorotan +15, basis naik di Jawa.',run(){reformasi();bump('massa',15);G.stab-=10;bump('sorotan',15);JAWA.forEach(p=>myProv(p,.15));decide('Mendorong revolusi, Mei 1998');return 'Seruan Anda menggema, tetapi pada 21 Mei yang jatuh hanya presidennya. Tatanan lama masih berdiri, dan kini mengenali wajah Anda.';}});
   return c;}},
 {id:'partaibaru',t:17,cond:()=>G.era==='ref',title:'Seratus partai lahir',
  text:()=>'Presiden transisi Prof. Ir. Darmawan Kusnadi mencabut pembatasan partai dan menjanjikan pemilu bebas pertama sejak 1955 pada Juni 1999. Lebih dari seratus partai mendaftar. Dua di antaranya langsung diperhitungkan: Partai Kebangkitan Pesantren pimpinan '+FORMS.pkp.leader+' dan Partai Amanat Reformasi pimpinan '+FORMS.par.leader+'.',
  ch:()=>[{l:'Buka pintu bagi kader baru',h:'Kader +8, dana -3.',cost:{dana:3},run(){bump('kader',8);return 'Kantor-kantor cabang dibuka hingga larut malam.';}},
   {l:'Rekrut tokoh-tokoh daerah',h:'Dana -4, dukungan naik di tiga provinsi luar Jawa.',cost:{dana:4},run(){for(let i=0;i<3;i++)myProv(pick(PROVS.filter(p=>p.f.lu>.5)).id,.18);return 'Mantan bupati dan tokoh adat berganti jaket.';}}]},
 {id:'aceh98',t:19,cond:()=>G.era==='ref',title:'Operasi militer di Aceh dicabut',
  text:'Setelah sembilan tahun, status operasi militer di Aceh dicabut. Kuburan massal digali, kesaksian penyiksaan bermunculan, dan tuntutan referendum mulai terdengar di masjid-masjid.',
  ch:()=>[{l:'Dukung pengadilan HAM',h:'Legitimasi +5, ABRI -5, dukungan Aceh naik.',run(){if(G.pol.darurat)repealPolicy('darurat');bump('legit',5);bump('abri',-5);myProv('aceh',.2);G.sep.aceh=clamp(G.sep.aceh+8,0,100);return 'Keluarga korban mengundang Anda ke Pidie.';}},
   {l:'Masa lalu biarlah berlalu',h:'ABRI +5, legitimasi -3.',run(){if(G.pol.darurat)repealPolicy('darurat');bump('abri',5);bump('legit',-3);PBY.aceh.kf=Math.min(1,PBY.aceh.kf+.1);G.sep.aceh=clamp(G.sep.aceh+15,0,100);return 'Para jenderal lega. Aceh tidak.';}}]},
 {id:'semanggi',t:22,cond:()=>G.era==='ref',title:'Sidang Istimewa dan Semanggi',
  text:'MPR menggelar Sidang Istimewa. Mahasiswa menuntut sidang dibubarkan dan dwifungsi ABRI dihapus. Di jembatan Semanggi, aparat menembak ke arah massa. Belasan orang tewas.',
  ch:()=>isOpp()?[{l:'Turun bersama mahasiswa',h:'Massa +8, legitimasi +3, suhu naik.',run(){bump('massa',8);bump('legit',3);G.suhu+=5;return 'Jaket almamater dan bendera partai Anda berdampingan di Semanggi.';}},
    {l:'Kecam keras, tuntut pengusutan',h:'Legitimasi +5.',run(){bump('legit',5);return 'Tuntutan Anda masuk berita utama dan laci kejaksaan.';}}]
   :[{l:'Dukung aparat menjaga sidang',h:'ABRI +5, legitimasi -5.',run(){bump('abri',5);bump('legit',-5);return 'Sidang berjalan di balik barikade kawat berduri.';}},
     {l:'Usulkan dialog dengan mahasiswa',h:'Legitimasi +4.',run(){bump('legit',4);return 'Dialog berlangsung dua jam dan tidak menghasilkan apa-apa, kecuali foto yang bagus.';}}]},
 {id:'ambon',t:24,title:'Ambon terbakar',
  text:'Pertengkaran di terminal Ambon pada hari raya berubah menjadi konflik antaragama yang menjalar ke seluruh Maluku. Kampung-kampung dibakar, ribuan orang mengungsi, dan kebencian menyebar lebih cepat daripada bantuan.',
  ch:()=>{const c=[{l:'Kirim tim perdamaian lintas iman',h:'Dana -4, legitimasi +6, konflik Maluku mereda.',cost:{dana:4},run(){bump('legit',6);PBY.maluku.kf=Math.max(.2,PBY.maluku.kf-.15);myProv('maluku',.15);return 'Pendeta dan ustaz dari tim Anda duduk di satu meja. Belum cukup, tapi sebuah awal.';}},
   {l:'Serahkan pada aparat',h:'Tidak ada biaya. Konflik makin panjang.',run(){PBY.maluku.kf=Math.min(1,PBY.maluku.kf+.15);return 'Aparat terbelah mengikuti garis yang sama dengan warga.';}}];
   if(G.form==='bfd')c.push({l:'Kirim barisan dari Jawa',h:'Kantong di Maluku tumbuh pesat. Konflik memanjang, legitimasi -8, stabilitas -6.',run(){kend('maluku',30);bump('legit',-8);G.stab-=6;PBY.maluku.kf=1;return 'Kapal-kapal penumpang membawa ratusan orang bersenjata ke Ambon. Ribuan keluarga lagi kehilangan rumah.';}});
   return c;}},
 {id:'opsi',t:25,title:'Dua opsi untuk Timor Timur',cond:()=>!G.gone.timtim,
  text:()=>G.power?'Tekanan internasional atas Timor Timur memuncak. Para donor mengaitkan bantuan dengan referendum.':'Presiden transisi tiba-tiba menawarkan dua opsi bagi Timor Timur: otonomi luas atau lepas. Para jenderal terkejut, dunia internasional menyambut.',
  ch:()=>[{l:'Dukung referendum',h:'Legitimasi +4, ABRI -5. Timor Timur kemungkinan lepas.',run(){bump('legit',4);bump('abri',-5);G.flags.reftt=true;return 'Anda menyebutnya kesempatan menebus dosa sejarah. Sebagian kader menyebutnya pengkhianatan.';}},
   {l:'Tolak, wilayah tidak bisa ditawar',h:'ABRI +6, massa +3, legitimasi -2.',run(){bump('abri',6);bump('massa',3);bump('legit',-2);return 'Spanduk "Harga Mati" muncul di markas-markas komando daerah.';}}]},
 {id:'kampanye99',t:27,cond:()=>G.era==='ref'&&!G.power,title:'Pesta demokrasi',
  text:()=>'Empat puluh delapan partai lolos ke Pemilu Juni 1999. Untuk pertama kalinya dalam empat dekade, hasilnya tidak diketahui sebelum dihitung. Rapat umum bulan ini sampai Juni 35 persen lebih kuat.'+(G.active.includes(G.form)?'':' Gerakan Anda memilih berada di luar bilik suara.'),
  ch:()=>G.active.includes(G.form)?[{l:'Rapat raksasa di Senayan',h:'Dana -6, dukungan nasional naik, massa +6.',cost:{dana:6},run(){myNat(.06);bump('massa',6);return 'Stadion penuh, lagu partai dinyanyikan seratus ribu orang.';}},
    {l:'Kampanye pintu ke pintu',h:'Kader +6, struktur naik di lima provinsi besar.',run(){bump('kader',6);['jabar','jateng','jatim','sumut','sulsel'].forEach(p=>{if(G.struct[G.form])G.struct[G.form][p]=Math.min(6,G.struct[G.form][p]+1);});return 'Ribuan kader mengetuk pintu dengan brosur dan kalender.';}}]
   :[{l:'Serukan boikot pemilu',h:'Massa +8, sorotan +5.',run(){bump('massa',8);bump('sorotan',5);return 'Selebaran "Pemilu bukan jalan kita" beredar di pabrik dan masjid.';}},
     {l:'Biarkan, bangun basis',h:'Kader +5.',run(){bump('kader',5);return 'Sementara orang lain berkampanye, Anda mengorganisir.';}}]},
 {id:'referendum',t:31,title:'Hasil referendum Timor Timur',cond:()=>!G.gone.timtim,
  text:()=>G.flags.reftt||!G.power?'Hampir 80 persen pemilih Timor Timur memilih merdeka. Milisi pro-integrasi membalas dengan membakar Dili dan memaksa ratusan ribu orang mengungsi. Pasukan internasional bersiap masuk.':'Dunia menuntut referendum di Timor Timur. Sanksi ekonomi dibicarakan di New York dan Canberra.',
  ch:()=>(G.flags.reftt||!G.power)?[{l:'Hormati hasilnya, hentikan milisi',h:'Legitimasi +5, ABRI -4. Timor Timur lepas.',run(){G.gone.timtim='merdeka';bump('legit',5);bump('abri',-4);addLog('Timor Timur lepas dari Indonesia.',true);return 'Provinsi ke-27 berpisah. Lukanya akan lama sembuh di kedua sisi perbatasan.';}},
    {l:'Tolak hasilnya',h:'ABRI +5, legitimasi -6, stabilitas -3. Timor Timur tetap lepas.',run(){G.gone.timtim='merdeka';bump('abri',5);bump('legit',-6);G.stab-=3;addLog('Timor Timur lepas dari Indonesia.',true);return 'Penolakan Anda tak mengubah apa pun selain citra Anda di mata dunia.';}}]
   :[{l:'Izinkan referendum',h:'Timor Timur lepas. Legitimasi +6, ABRI -8.',run(){G.gone.timtim='merdeka';bump('legit',6);bump('abri',-8);addLog('Timor Timur lepas dari Indonesia.',true);return 'Rezim Anda mendapat pujian internasional yang jarang.';}},
     {l:'Tolak dan hadapi sanksi',h:'Dana -15, legitimasi -5, stabilitas -3.',run(){bump('dana',-15);bump('legit',-5);G.stab-=3;return 'Bantuan asing dibekukan. Para jenderal bertepuk tangan.';}}]},
 // ===== acak =====
 {id:'banjir',win:[1,586],w:3,title:'Banjir bandang',data:()=>({p:pick(['jateng','jatim','jabar','kalsel','sumut','dki'])}),

 {id:'beras',win:[9,586],w:2,title:'Harga beras melonjak',text:'Beras kelas medium naik dua kali lipat dalam sebulan. Antrean operasi pasar mengular sejak subuh.',

   :{l:'Kecam kebijakan pangan pemerintah',h:'Legitimasi +3, massa +4.',run(){bump('legit',3);bump('massa',4);return 'Pernyataan Anda dibacakan di depan antrean.';}}]},
 {id:'phk',win:[10,586],w:2,title:'PHK massal di kawasan industri',data:()=>({p:pick(['jabar','dki','jatim','sumut'])}),
  text:d=>'Puluhan pabrik tekstil dan sepatu di '+PBY[d.p].name+' tutup. Lebih dari seratus ribu buruh dirumahkan tanpa pesangon.',

   {l:'Tawarkan dana talangan sementara',h:'Dana -5, legitimasi +3.',cost:{dana:5},run(){bump('legit',3);myProv(d.p,.08);return 'Amplop kecil untuk keluarga buruh, foto besar untuk partai.';}}]},
 {id:'bredel',win:[0,15],w:2,cond:()=>isOpp(),title:'Majalah dibredel',text:'Mingguan yang memuat wawancara panjang Anda dicabut izin terbitnya. Para wartawannya kini menerbitkan buletin stensilan.',
  ch:()=>[{l:'Protes terbuka',h:'Legitimasi +4, sorotan +5.',run(){bump('legit',4);bump('sorotan',5);return 'Buletin stensilan itu kini memuat wajah Anda di sampul.';}},
   {l:'Diam',h:'Legitimasi -2.',run(){bump('legit',-2);return 'Para wartawan mencatat siapa yang membela mereka.';}}]},
 {id:'donor',win:[2,586],w:2,title:'Tawaran dana besar',text:'Seorang pengusaha kayu menawarkan Rp20 miliar tunai. Syaratnya satu: izin konsesi hutannya aman, siapa pun yang berkuasa.',
  ch:()=>[{l:'Terima',h:'Dana +20, legitimasi -6.',run(){bump('dana',20);bump('legit',-6);return 'Uang masuk. Janji tercatat di buku kecil seseorang.';}},
   {l:'Tolak',h:'Legitimasi +3.',run(){bump('legit',3);return 'Pengusaha itu pindah ke meja lawan.';}}]},
 {id:'senat',win:[9,30],w:2,cond:()=>isOpp(),title:'Senat mahasiswa minta dukungan',text:'Dewan mahasiswa dari dua puluh kampus meminta logistik untuk aksi besar: nasi bungkus, truk, dan pengeras suara.',
  ch:()=>[{l:'Bantu diam-diam',h:'Dana -3, massa +8, kader +3.',cost:{dana:3},run(){bump('massa',8);bump('kader',3);return 'Nasi bungkus tiba tanpa logo partai. Semua orang tahu dari mana.';}},
   {l:'Tolak, jangan tunggangi mahasiswa',h:'Legitimasi +2.',run(){bump('legit',2);return 'Mahasiswa menghargai, sambil mencari donatur lain.';}}]},
 {id:'intel',win:[3,586],w:2,cond:()=>RADICAL(G.form)||(G.era==='ob'&&isOpp()),title:'Penyusup di rapat pimpinan',text:'Seorang anggota baru ketahuan menyalin notulen rapat ke buku saku. Di bukunya ada nomor telepon seorang komandan.',
  ch:()=>[{l:'Usir dan putus jaringan yang ia kenal',h:'Kader -3, sorotan -10.',run(){bump('kader',-3);bump('sorotan',-10);return 'Tiga sel dibubarkan dan dibentuk ulang.';}},
   {l:'Beri dia informasi palsu',h:'Sorotan -6. Bisa berbalik.',run(){if(rnd()<.6){bump('sorotan',-12);return 'Aparat menggerebek gudang kosong di Bekasi.';}bump('sorotan',10);bump('kader',-5);return 'Ia ternyata tahu lebih banyak dari dugaan. Dua kader ditangkap.';}}]},
 {id:'membelot',win:[17,586],w:2,title:'Tokoh daerah mau pindah partai',data:()=>({p:pick(PROVS.filter(p=>p.f.lu>.5)).id}),

 {id:'kpkberdiri',title:'Komisi Pemberantasan Korupsi berdiri',text:'Undang-undang baru melahirkan Komisi Pemberantasan Korupsi, lembaga independen dengan wewenang menyadap, menyidik, dan menuntut. Para pejabat yang terbiasa dengan amplop mulai gelisah. Mulai sekarang, korupsi diburu lembaga yang tidak tunduk pada jaksa atau polisi.',

   return [{l:'Gugat ke Mahkamah Konstitusi',h:'Dana pribadi -Rp3 M. Peluang sekitar '+Math.round(p*100)+'%.',req:()=>G.me.dana>=3?true:'Dana kurang Rp3 M.',run(){G.me.dana-=3;if(rnd()<p){if(d.kind==='kursi'){G.me.kursi={type:d.lvl,pv:d.pv,since:G.t};decide('Menang sengketa kursi di MK');return 'MK memerintahkan penghitungan ulang. Kursi itu kini milik Anda.';}startPower('pilpres');decide('Menang sengketa pilpres di MK');return 'MK memerintahkan pemungutan suara ulang di beberapa daerah, dan Anda menang.';}G.me.nb=clamp(G.me.nb-2,0,100);return 'MK menolak gugatan Anda.';}},
    {l:'Terima hasil dengan lapang dada',h:'Nama baik +4.',run(){G.me.nb=clamp(G.me.nb+4,0,100);return 'Anda mengucapkan selamat kepada pemenang.';}}];}},
 {id:'bocor_deal',personal:true,title:'Kongkalikong terbongkar',text:'Rekaman percakapan, bukti transfer, dan saksi kunci bocor ke media. Kongkalikong Anda dengan aparat menjadi berita utama, dan penyidik membuka perkara baru.',
  ch:()=>[{l:'Bantah dan sebut fitnah',h:'Nama baik -3 lagi bila tidak dipercaya.',run(){if(rnd()<.4)return 'Sebagian publik percaya bantahan Anda.';G.me.nb=clamp(G.me.nb-3,0,100);return 'Bantahan Anda justru memperpanjang pemberitaan.';}},{l:'Minta maaf dan mundur dari sorotan',h:'Pengaruh -4, sorotan turun.',run(){G.me.pengaruh=clamp(G.me.pengaruh-4,0,100);G.inst.press=clamp(G.inst.press-10,0,100);return 'Anda meminta maaf. Badai mereda perlahan.';}}]},
 {id:'kapp_demo',personal:true,title:'Warga turun ke balai kota',text:()=>'Kepuasan warga terhadap pemerintahan Anda tinggal '+Math.round(G.me.capp||0)+'. Ribuan orang mendemo kantor '+(G.me.kursi&&G.me.kursi.type==='gubernur'?'gubernur':'walikota')+' soal banjir, macet, dan pungutan liar.',
  ch:()=>[{l:'Temui massa dan janjikan perbaikan',h:'Kepuasan +6.',run(){G.me.capp=clamp((G.me.capp||0)+6,0,100);return 'Anda naik ke mobil komando dan menjawab satu per satu.';}},{l:'Minta polisi membubarkan',h:'Kepuasan -5, hubungan Polri +5.',run(){G.me.capp=clamp((G.me.capp||0)-5,0,100);G.inst.polriRel=clamp(G.inst.polriRel+5,-100,100);return 'Gas air mata membubarkan demo. Rekamannya viral.';}}]},
 // ===== karier =====
 {id:'musda',personal:true,title:d=>'Musyawarah daerah '+PBY[d.pv].name,
  text:d=>'Pengurus cabang se-'+PBY[d.pv].name+' berkumpul memilih ketua DPD. '+(G.me.rank===2?'Anda mempertahankan kursi ketua DPD.':'Beberapa ketua cabang mendorong Anda maju.')+' Pengaruh Anda '+Math.round(G.me.pengaruh)+', popularitas di provinsi ini '+Math.round(G.me.pop[d.pv])+'.',
  ch:d=>{const p=clamp(.05+G.me.pengaruh/130+G.me.pop[d.pv]/250+(G.me.rel[ketumFac()]||0)/300,.05,.88);const win=(x)=>{G.me.rank=Math.max(G.me.rank,2);G.me.dpd=d.pv;G.me.pengaruh=clamp(G.me.pengaruh+6,0,100);decide('Terpilih sebagai ketua DPD '+PBY[d.pv].name);return 'Anda terpilih sebagai ketua DPD '+PBY[d.pv].name+'.'+x;};
   const lose=()=>{if(G.me.rank===2){G.me.rank=1;G.me.dpd=null;}G.me.pengaruh=clamp(G.me.pengaruh-3,0,100);return 'Anda kalah. Kubu lain menguasai DPD.';};
   return [{l:G.me.rank===2?'Pertahankan kursi ketua DPD':'Maju sebagai ketua DPD',h:'Peluang sekitar '+Math.round(p*100)+'%.',req:()=>G.me.pengaruh>=22?true:'Butuh pengaruh minimal 22.',run(){return rnd()<p?win(''):lose();}},
    {l:'Maju dengan amplop untuk para ketua cabang',h:'Dana pribadi -Rp6 M, nama baik -6. Peluang sekitar '+Math.round(Math.min(.95,p+.22)*100)+'%.',req:()=>G.me.pengaruh>=22?(G.me.dana>=6?true:'Dana pribadi kurang.'):'Butuh pengaruh minimal 22.',run(){G.me.dana-=6;G.me.nb=clamp(G.me.nb-6,0,100);G.me.amplop=(G.me.amplop||0)+6;return rnd()<Math.min(.95,p+.22)?win(' Amplop tebal membuka banyak pintu.'):lose();}},
    {l:'Dukung calon dari kubu ketua umum',h:'Hubungan dengan kubu ketua umum +10, pengaruh +2.',run(){G.me.rel[ketumFac()]=clamp(G.me.rel[ketumFac()]+10,-100,100);G.me.pengaruh+=2;if(G.me.rank===2){G.me.rank=1;G.me.dpd=null;}return 'Anda menjadi juru kampanye calon pusat. Jakarta mencatatnya.';}}];}},
 {id:'dpp',personal:true,title:'Panggilan dari Jakarta',text:()=>G.ketum.name+' menawari Anda kursi ketua bidang di DPP. Artinya pindah ke Jakarta, melepas kursi DPD, dan bekerja di tingkat nasional.',
  ch:()=>[{l:'Terima, berangkat ke Jakarta',h:'Jabatan naik menjadi pengurus DPP. Aksi partai bisa dilakukan di seluruh provinsi.',run(){G.me.rank=3;G.me.dpd=null;G.me.pengaruh+=5;G.me.rel[ketumFac()]=clamp(G.me.rel[ketumFac()]+8,-100,100);decide('Masuk jajaran DPP');return 'Anda menempati ruang kerja kecil di kantor pusat.';}},
   {l:'Tolak, tetap membesarkan daerah',h:'Popularitas di daerah naik, hubungan dengan ketua umum turun sedikit.',run(){popAdd(G.me.asal,6);G.me.rel[ketumFac()]-=4;return 'Anda memilih tetap di kampung halaman.';}}]},
 {id:'pilkada',personal:true,title:'Pemilihan kepala daerah',
  text:d=>'DPRD membuka pendaftaran calon kepala daerah. '+(KOTA[d.pv]?'Kursi walikota '+KOTA[d.pv]+' dan gubernur '+PBY[d.pv].name+' sama-sama diperebutkan.':'Kursi gubernur '+PBY[d.pv].name+' diperebutkan.')+' '+(G.t>=96?'Sejak 2005, rakyat memilih langsung: popularitas Anda dan kekuatan partai di provinsi ini yang menentukan.':'Sebelum 2005, kepala daerah dipilih anggota DPRD, jadi yang menentukan adalah fraksi-fraksi.')+' Popularitas Anda di sini '+Math.round(G.me.pop[d.pv])+'.',
  ch:d=>{const ex=G.me.kursi&&['walikota','gubernur'].includes(G.me.kursi.type);const c=[];
   if(KOTA[d.pv]&&!ex)c.push({l:'Maju sebagai walikota '+KOTA[d.pv],h:'Butuh pengaruh 28, popularitas lokal 35, dan restu partai.',req:()=>!pilkadaEndorse()?'Partai tidak merestui Anda.':G.me.pengaruh<28?'Butuh pengaruh minimal 28.':G.me.pop[d.pv]<35?'Butuh popularitas minimal 35 di provinsi ini.':true,run(){if(G.t>=96)return directPilkada('walikota',d.pv,0);G.queue.splice(1,0,{type:'pilkada',lvl:'walikota',pv:d.pv,t:G.t});return 'Anda mendaftar sebagai calon walikota.';}});
   c.push({l:'Maju sebagai gubernur '+PBY[d.pv].name,h:'Butuh pengaruh 40, popularitas lokal 50, dan jabatan ketua DPD atau jabatan publik.',req:()=>!pilkadaEndorse()?'Partai tidak merestui Anda.':G.me.pengaruh<40?'Butuh pengaruh minimal 40.':G.me.pop[d.pv]<50?'Butuh popularitas minimal 50 di provinsi ini.':(G.me.rank>=2||G.me.kursi)?true:'Butuh jabatan ketua DPD ke atas atau jabatan publik.',run(){if(G.t>=96)return directPilkada('gubernur',d.pv,0);G.queue.splice(1,0,{type:'pilkada',lvl:'gubernur',pv:d.pv,t:G.t});return 'Anda mendaftar sebagai calon gubernur.';}});
   if(G.t>=96)c.push({l:'Maju gubernur dengan serangan fajar',h:'Dana pribadi -Rp10 M, peluang naik, nama baik turun.',req:()=>G.me.dana<10?'Dana pribadi kurang.':!pilkadaEndorse()?'Partai tidak merestui Anda.':G.me.pengaruh<35||G.me.pop[d.pv]<40?'Butuh pengaruh 35 dan popularitas 40.':true,run(){return directPilkada('gubernur',d.pv,10);}});
   c.push({l:'Tidak maju kali ini',h:'Tidak ada efek.',run(){return 'Anda menunggu kesempatan berikutnya.';}});return c;}},
 {id:'menteri',personal:true,title:'Kursi di kabinet',text:()=>'Presiden menawari Anda kursi menteri sebagai jatah partai. '+(G.me.kursi&&G.me.kursi.type==='dpr'?'Anda harus melepas kursi DPR.':''),
  ch:()=>[{l:'Terima jabatan menteri',h:'Pengaruh +8, popularitas nasional naik tiap bulan, dana pribadi bertambah.',run(){if(G.me.kursi&&['dpr','dprd'].includes(G.me.kursi.type))G.me.kursi=null;G.me.menteri=true;G.me.pengaruh+=8;decide('Diangkat menjadi menteri');return 'Anda dilantik di Istana Negara.';}},
   {l:'Tolak, tetap di jalur partai',h:'Pengaruh +2.',run(){G.me.pengaruh+=2;return 'Kursi itu jatuh ke kader lain.';}}]},
 {id:'konvensi',personal:true,title:'Konvensi calon presiden',text:()=>'Partai menggelar konvensi untuk memilih calon presiden 2004. '+G.ketum.name+' ikut mendaftar. Popularitas nasional Anda '+Math.round(popNat())+', pengaruh '+Math.round(G.me.pengaruh)+'.',
  ch:()=>{const p=clamp(.3+(popNat()-25)/55+(G.me.pengaruh-55)/80+(G.me.rel[ketumFac()]||0)/250-(G.ketum.kuat-50)/140,.05,.88);return [
   {l:'Ikut konvensi',h:'Peluang sekitar '+Math.round(p*100)+'%. Pemenang menjadi calon presiden partai.',req:()=>G.me.pengaruh>=45&&popNat()>=15?true:'Butuh pengaruh 45 dan popularitas nasional 15.',run(){if(rnd()<p){G.me.capres=true;G.me.pengaruh+=6;decide('Memenangi konvensi calon presiden');return 'Anda memenangi konvensi dan resmi menjadi calon presiden partai.';}G.me.pengaruh-=4;G.me.rel[ketumFac()]-=10;return 'Anda kalah di konvensi. '+G.ketum.name+' menjadi calon presiden.';}},
   {l:'Dukung ketua umum',h:'Hubungan dengan kubu ketua umum +10.',run(){G.me.rel[ketumFac()]=clamp(G.me.rel[ketumFac()]+10,-100,100);return 'Anda berdiri di belakang ketua umum.';}}];}},
 {id:'luka65',win:[14,586],w:3,cond:()=>G.form==='pkn',title:'Luka 1965',
  text:'Keluarga korban pembantaian 1965 meminta partai Anda memperjuangkan pengungkapan kebenaran. Di desa yang sama, keluarga korban kekerasan sebelum 1965 menolak partai Anda berdiri. Luka itu belum kering di kedua sisi.',
  ch:()=>[{l:'Tuntut komisi kebenaran untuk semua korban',h:'Legitimasi +4, ABRI -6, sorotan +5.',run(){bump('legit',4);bump('abri',-6);bump('sorotan',5);return 'Seruan Anda mengakui korban dari semua pihak. Sebagian orang terkejut, sebagian lega.';}},
   {l:'Fokus pada perjuangan agraria hari ini',h:'Kader +4, massa +4.',run(){bump('kader',4);bump('massa',4);return 'Anda memilih bicara soal tanah, bukan soal masa lalu. Untuk sekarang.';}}]},
 {id:'pawai',win:[20,586],w:3,cond:()=>G.form==='ppb',title:'Pawai kesetaraan',
  text:'Jaringan pegiat HAM, feminis, dan komunitas LGBTQ merencanakan pawai kesetaraan di Jakarta. Beberapa ormas konservatif mengancam membubarkannya. Partai Anda diminta bersikap.',
  ch:()=>[{l:'Ikut berbaris di barisan depan',h:'Massa +6, legitimasi +3, stabilitas -2. Basis di kota naik, provinsi santri makin menjauh.',run(){bump('massa',6);bump('legit',3);G.stab-=2;bump('sorotan',4);myProv('dki',.12);myProv('bali',.08);['aceh','sumbar','kalsel','ntb'].forEach(p=>myProv(p,-.08));return 'Barisan pawai berjalan dari Bundaran HI. Polisi berjaga di antara dua kelompok.';}},
   {l:'Alihkan ke advokasi hukum dan dialog',h:'Legitimasi +2, kader +3.',run(){bump('legit',2);bump('kader',3);return 'Tim pengacara partai menyiapkan uji materi dan forum dialog dengan tokoh agama.';}}]},
 // ===== bab baru =====
 {id:'bab3',t:36,cond:()=>G.era!=='ob',title:'Bab III: Beringin Pecah',
  text:()=>'Januari 2000. '+(G.power?'Anda memegang kekuasaan, dan semua mata menunggu apa yang akan Anda lakukan dengannya.':G.npcPres?'Presiden '+G.npcPres.name+' memerintah di tengah koalisi yang rapuh.':'Republik memasuki abad baru dalam keadaan compang-camping.')+' Rupiah mulai stabil, tetapi pengangguran membengkak dan daerah-daerah menuntut bagian. Di tubuh Golkar, dua kubu saling mengintai: teknokrat liberal dan para purnawirawan.',
  ch:()=>[{l:'Lanjutkan',h:'Bab baru: kebijakan, proyek, dan perdagangan makin menentukan.',run(){bump('kader',2);return 'Bab baru dimulai.';}}]},
 {id:'beringin',t:44,cond:()=>G.era==='ref',title:'Beringin pecah',
  text:()=>'Setelah musyawarah nasional yang ricuh, Golkar terbelah. Sayap teknokrat dan pengusaha muda keluar dan mendirikan Partai Demokrasi Bersatu pimpinan Dr. Astrid Maharani: liberal, pro-pasar, dan bersih dari wajah lama. Sayap purnawirawan mendirikan Partai Nusantara Raya pimpinan '+FORMS.nusra.leader+': konservatif, nasionalis, dan rindu ketegasan.'+(G.form==='golb'&&!G.power?' Kedua kubu menawari Anda kursi ketua.':''),
  ch:()=>{const fin=()=>{G.split=true;const g=(G.seats&&G.seats.golb)||0;if(g){const a=Math.round(g*.16),b=Math.round(g*.1);G.seats.golb=g-a-b;G.seats.pdb=a;G.seats.nusra=b;const bb=G.blok.golb||'imbang';G.blok.pdb=bb==='pem'?'imbang':bb;G.blok.nusra=bb;}};
   if(G.form==='golb'&&!G.power&&!isKetum())return [
    {l:'Bertahan di Golkar Baru',h:'Hubungan dengan kubu ketua umum membaik.',run(){fin();calibrate();G.me.rel[ketumFac()]=clamp(G.me.rel[ketumFac()]+10,-100,100);return 'Anda memilih rumah lama.';}},
    {l:'Bergabung dengan Partai Demokrasi Bersatu',h:'Pindah ke partai liberal sebagai pengurus. Menuju Republik Liberal bila kelak memimpin.',run(){fin();joinParty('pdb');return 'Anda menerima jaket ungu di panggung peluncuran.';}},
    {l:'Bergabung dengan Partai Nusantara Raya',h:'Pindah ke partai purnawirawan sebagai pengurus.',run(){fin();joinParty('nusra');return 'Para purnawirawan menyambut Anda dengan hormat.';}}];
   if(G.form==='golb'&&!G.power)return [
    {l:'Bertahan di Golkar Baru',h:'Kader +4, legitimasi +2. Kedua partai baru menjadi pesaing.',run(){fin();calibrate();bump('kader',4);bump('legit',2);decide('Bertahan di Golkar saat beringin pecah');return 'Anda memilih rumah lama. Separuh pengurus daerah ikut, separuh lagi pamit.';}},
    {l:'Pimpin sayap liberal: Partai Demokrasi Bersatu',h:'Butuh legitimasi 35. Menuju Republik Liberal.',req:()=>G.legit>=35?true:'Butuh legitimasi minimal 35.',run(){fin();doShift('pdb');return 'Anda berdiri di panggung peluncuran dengan latar ungu dan janji pasar bebas.';}},
    {l:'Pimpin sayap purnawirawan: Partai Nusantara Raya',h:'Butuh ABRI 45 dan kader 40. Menuju Indonesia Raya Baru.',req:()=>G.abri>=45&&G.kader>=40?true:'Butuh hubungan ABRI 45 dan kader 40.',run(){fin();doShift('nusra');return 'Para purnawirawan memberi hormat. Spanduk cokelat-emas dibentangkan di Senayan.';}}];
   return [{l:'Rangkul Partai Demokrasi Bersatu',h:'Legitimasi +2, kader +2.',run(){fin();calibrate();bump('legit',2);bump('kader',2);return 'Anda mengucapkan selamat dan mengirim karangan bunga ungu.';}},
    {l:'Rangkul Partai Nusantara Raya',h:'ABRI +5.',run(){fin();calibrate();bump('abri',5);return 'Para purnawirawan mencatat siapa yang datang ke peluncuran mereka.';}},
    {l:'Biarkan mereka bertengkar',h:'Tidak ada efek.',run(){fin();calibrate();return 'Peta politik kini lebih ramai.';}}];}},
 {id:'banjirjkt',t:61,cond:()=>!G.gone.dki,title:'Jakarta tenggelam',text:'Banjir terbesar dalam puluhan tahun merendam sepertiga Jakarta. Ratusan ribu orang mengungsi, jalan tol berubah menjadi sungai.',
  ch:()=>[{l:'Bangun kanal dan pompa',h:playerGov()?'Kas negara -Rp12 T, dukungan Jakarta naik besar.':'Dana partai -Rp4 M untuk posko, dukungan Jakarta naik.',run(){if(playerGov())G.eco.kas=Math.max(0,G.eco.kas-12);else bump('dana',-4);myProv('dki',.25);bump('legit',2);return 'Pompa-pompa berbendera Anda bekerja siang malam.';}},
   {l:'Salahkan pemerintah daerah',h:'Legitimasi -1.',run(){bump('legit',-1);return 'Saling tuding berlangsung lebih lama dari banjirnya.';}}]},
 {id:'kuta',t:69,cond:()=>G.form!=='bfd'&&!G.gone.bali,title:'Ledakan di Kuta',
  text:'Dua ledakan menghancurkan kawasan hiburan di Kuta, Bali. Lebih dari dua ratus orang tewas, sebagian besar wisatawan. Pariwisata lumpuh, dunia menuntut tindakan.',
  ch:()=>{return playerGov()?[{l:'Sahkan undang-undang antiterorisme',h:'Legitimasi +3. Arah kekuasaan bergeser lebih keras.',run(){G.eco.tumbuh-=1;if(!G.pol.antiteror)enactPolicy('antiteror',G.form);bump('legit',3);return 'Undang-undang disahkan dalam hitungan hari.';}},
     {l:'Kejar pelaku lewat hukum biasa',h:'Legitimasi +2, stabilitas -2.',run(){G.eco.tumbuh-=1;bump('legit',2);G.stab-=2;return 'Polisi bekerja dengan hukum yang ada, dan bekerja cepat.';}}]
   :[{l:'Dukung undang-undang antiterorisme',h:'Legitimasi +2, ABRI +3.',run(){G.eco.tumbuh-=1;if(!G.pol.antiteror)enactPolicy('antiteror',govParty());bump('legit',2);bump('abri',3);return 'Pemerintah mengesahkan undang-undang antiterorisme.';}},
     {l:'Ingatkan bahaya stigma terhadap umat',h:'Legitimasi +1. Pemerintah tetap mengesahkan undang-undang.',run(){G.eco.tumbuh-=1;if(!G.pol.antiteror)enactPolicy('antiteror',govParty());bump('legit',1);if(G.lin==='ppp')bump('massa',3);return 'Pernyataan Anda dikutip di koran dan mimbar.';}}];}},
 {id:'bab4',t:72,cond:()=>G.era!=='ob',title:'Bab IV: Jalan Menuju 2004',
  text:()=>'Januari 2003. '+(G.pol.pilsung?'Amandemen konstitusi sudah disahkan: presiden 2004 akan dipilih langsung oleh rakyat. Pemilu legislatif April, pemilihan presiden Juli.':'Amandemen pemilihan langsung belum disahkan. Presiden 2004 masih akan dipilih MPR pada Oktober, setelah pemilu legislatif April.')+' Harga BBM, pengangguran, dan separatisme akan menentukan siapa yang dipercaya.',
  ch:()=>[{l:'Lanjutkan',h:'Bab terakhir dimulai.',run(){bump('kader',2);return 'Bab terakhir dimulai.';}}]},
 {id:'kampanye04',t:85,cond:()=>G.era==='ref'&&G.active.includes(G.form),title:'Kampanye 2004',text:'Dua puluh empat partai bertarung. Televisi swasta menggelar debat setiap malam. Rapat umum bulan ini sampai April 35 persen lebih kuat.',
  ch:()=>[{l:'Iklan televisi nasional',h:'Dana -8, dukungan nasional naik.',cost:{dana:8},run(){myNat(.07);return 'Wajah ketua umum ada di setiap jeda sinetron.';}},
   {l:'Turun ke pasar dan desa',h:'Kader +5, massa +5.',run(){bump('kader',5);bump('massa',5);return 'Blusukan dari pasar ke pasar.';}}]},
 {id:'tsunami',t:95,title:'Gelombang raksasa',text:()=>'Pada pagi hari setelah Natal, gempa besar di Samudra Hindia mengirim gelombang raksasa ke pantai '+(G.gone.aceh?'Aceh yang kini berdiri sendiri':'Aceh')+'. Ratusan ribu orang hilang dalam hitungan menit. Dunia datang membantu.',
  ch:()=>[{l:'Kerahkan semua yang dimiliki',h:'Dana dan kas berkurang, legitimasi +5.',run(){if(playerGov())G.eco.kas=Math.max(0,G.eco.kas-20);bump('dana',-6);bump('legit',5);G.sep.aceh=clamp(G.sep.aceh-20,0,100);return 'Relawan dan logistik Anda termasuk yang pertama tiba di Banda Aceh.';}},
   {l:'Kirim bantuan sebisanya',h:'Dana -3.',run(){bump('dana',-3);return 'Bantuan Anda tiba bersama ribuan bantuan lain.';}}]},
 // ===== perang saudara =====
 {id:'perang',title:'Perang saudara',
  text:()=>'Stabilitas runtuh. Komandan daerah berhenti menjawab Jakarta, milisi menguasai jalan-jalan, dan beberapa provinsi dikuasai kelompok bersenjata. Wilayah yang dikuasai satu faksi kini bisa memisahkan diri.'+(!G.power&&!G.brk?' Bila barisan Anda menguasai empat provinsi atau lebih, Anda bisa memproklamasikan negara sendiri dari tab Aksi.':''),
  ch:()=>playerGov()?[{l:'Umumkan darurat nasional',h:'ABRI +8, legitimasi -6, stabilitas +6.',run(){bump('abri',8);bump('legit',-6);G.stab+=6;if(!G.pol.darurat)enactPolicy('darurat',G.form);return 'Darurat nasional diumumkan dari istana.';}},
     {l:'Serukan rekonsiliasi nasional',h:'Legitimasi +5, stabilitas +4.',run(){bump('legit',5);G.stab+=4;return 'Seruan Anda disiarkan semua radio.';}}]
   :[{l:'Konsolidasikan wilayah kita',h:'Massa +10, kader +4.',run(){bump('massa',10);bump('kader',4);return 'Barisan Anda mengambil alih kantor-kantor yang ditinggalkan aparat.';}},
     {l:'Serukan perdamaian',h:'Legitimasi +5, stabilitas +4.',run(){bump('legit',5);G.stab+=4;return 'Seruan Anda didengar sebagian orang.';}},
     {l:'Berpihak pada pemerintah pusat',h:'ABRI +8, legitimasi -2.',run(){bump('abri',8);bump('legit',-2);G.stab+=2;return 'Anda berdiri di belakang Jakarta, untuk sekarang.';}}]},
 {id:'damai',title:'Senjata diturunkan',text:()=>'Stabilitas pulih. Perang saudara mereda'+(G.brk&&G.brk.length?', meski '+BREAK_NAMES[G.form]+' tetap berdiri di '+G.brk.length+' provinsi':'')+'. Provinsi yang tadinya dikuasai faksi kembali ke pangkuan Jakarta, kecuali yang sudah terlanjur merdeka.',
  ch:()=>[{l:'Lanjutkan',h:'Kendali faksi atas provinsi dihapus.',run(){return 'Perang saudara berakhir.';}}]},
 {id:'pisah',title:d=>PBY[d.p].name+' memisahkan diri',
  text:d=>'Tekanan separatis di '+PBY[d.p].name+' mencapai puncak. Dewan rakyat setempat memproklamasikan kemerdekaan dan menurunkan bendera Merah Putih dari kantor gubernur.',
  ch:d=>playerGov()?[
    {l:'Operasi militer',h:'Peluang tergantung ABRI. Berhasil: separatisme turun, legitimasi -6. Gagal: provinsi lepas.',req:()=>G.abri>=35?true:'Butuh hubungan ABRI minimal 35.',run(){const p=clamp(.4+G.abri/250-G.sep[d.p]/400,.15,.85);if(rnd()<p){G.sep[d.p]=55;PBY[d.p].kf=Math.min(1,PBY[d.p].kf+.1);bump('legit',-6);G.sepQ[d.p]=0;G.eco.kas=Math.max(0,G.eco.kas-10);return 'Pasukan merebut kembali ibu kota provinsi. Perlawanan pindah ke hutan. (Peluang '+Math.round(p*100)+'%)';}secede(d.p);return 'Operasi gagal. Provinsi itu lepas.';}},
    {l:'Tawarkan otonomi khusus',h:'Separatisme turun 35, legitimasi +3.',run(){G.sep[d.p]=clamp(G.sep[d.p]-35,0,100);G.sepQ[d.p]=0;bump('legit',3);if(['aceh','irja'].includes(d.p)&&!G.pol.otsus)enactPolicy('otsus',G.form);return 'Perundingan dimulai. Bendera Merah Putih dikibarkan lagi, dengan syarat.';}},
    {l:'Lepaskan lewat referendum',h:'Provinsi lepas. Legitimasi +4, ABRI -6, stabilitas +3.',run(){secede(d.p);bump('legit',4);bump('abri',-6);G.stab+=3;return 'Referendum digelar dengan damai. Hasilnya sudah bisa ditebak.';}}]
   :[{l:'Dukung operasi pemerintah',h:'ABRI +4, legitimasi -2.',run(){bump('abri',4);bump('legit',-2);return npcSecede(d.p,.6);}},
     {l:'Dukung hak menentukan nasib sendiri',h:'Legitimasi +2, ABRI -4.',run(){bump('legit',2);bump('abri',-4);return npcSecede(d.p,.45);}},
     {l:'Tidak berkomentar',h:'Tidak ada efek.',run(){return npcSecede(d.p,.52);}}]},
 {id:'serbuan',title:'Jakarta menyerbu',text:()=>'Pasukan pusat bergerak ke perbatasan '+BREAK_NAMES[G.form]+'. Kapal perang terlihat di lepas pantai.',
  ch:()=>[{l:'Pertahankan setiap jengkal',h:'Peluang tergantung massa dan ABRI. Gagal: kehilangan provinsi.',run(){const p=clamp(.35+G.massa/200+G.abri/250,.2,.88);if(rnd()<p){bump('massa',-4);return 'Serbuan dipukul mundur. (Peluang '+Math.round(p*100)+'%)';}const lost=G.brk.splice(0,G.brk.length>4?2:1);lost.forEach(x=>{G.ctrl[x]='pusat';});if(G.brk.length<3)endGame('digulingkan');return 'Pasukan pusat merebut '+lost.map(x=>PBY[x].name).join(' dan ')+'.';}},
   {l:'Tawarkan gencatan senjata',h:'Dana -12, legitimasi +3. Serbuan ditunda.',run(){bump('dana',-12);bump('legit',3);return 'Gencatan senjata disepakati, setidaknya untuk bulan ini.';}}]},
 {id:'investor',win:[20,586],w:2,cond:()=>G.arah.kuasa>=50||G.civil,title:'Modal asing kabur',text:'Bank investasi asing menurunkan peringkat Indonesia. Dana jangka pendek keluar dari bursa Jakarta dalam seminggu.',
  ch:()=>[{l:'Yakinkan investor',h:'Dana -4, legitimasi +1.',cost:{dana:4},run(){G.kursMod*=.98;return 'Roadshow ke Singapura dan Hong Kong.';}},{l:'Biarkan',h:'Rupiah melemah.',run(){G.kursMod*=1.05;return 'Rupiah tergelincir beberapa ratus poin.';}}]},
 {id:'mogokbbm',win:[36,586],w:3,cond:()=>!!G.pol.cabutsub,title:'Demo kenaikan BBM',text:'Harga bensin dan minyak tanah naik. Mahasiswa, sopir angkot, dan ibu-ibu turun ke jalan di puluhan kota.',
  ch:()=>playerGov()?[{l:'Bertahan, tambah bantuan tunai',h:'Kas -Rp6 T, suhu -5.',run(){G.eco.kas=Math.max(0,G.eco.kas-6);G.suhu-=5;return 'Kartu bantuan dibagikan di kelurahan.';}},{l:'Batalkan kenaikan',h:'Kebijakan dicabut, legitimasi -3.',run(){repealPolicy('cabutsub');bump('legit',-3);return 'Pemerintah mundur selangkah.';}}]
   :[{l:'Ikut turun ke jalan',h:'Massa +8, legitimasi +3.',run(){bump('massa',8);bump('legit',3);G.suhu+=4;return 'Bendera partai Anda di barisan depan.';}},{l:'Dukung reformasi subsidi',h:'Legitimasi -2.',run(){bump('legit',-2);return 'Para ekonom memuji. Pemilih tidak.';}}]},
 {id:'sawit',win:[40,586],w:2,title:'Harga komoditas melonjak',text:'Harga sawit, batubara, dan karet dunia melonjak. Daerah penghasil di Sumatera dan Kalimantan mendadak kaya.',
  ch:()=>[{l:playerGov()?'Pungut pajak ekspor':'Desak pajak ekspor untuk rakyat',h:playerGov()?'Kas negara +Rp15 T.':'Legitimasi +2.',run(){if(playerGov())G.eco.kas+=15;else bump('legit',2);G.eco.ekspor+=8;return 'Kapal-kapal tongkang antre di Sungai Musi.';}},
   {l:'Biarkan pasar bekerja',h:'Ekspor +12, separatisme turun di provinsi penghasil.',run(){G.eco.ekspor+=12;['riau','kaltim','sumsel','kalbar'].forEach(p=>G.sep[p]=clamp(G.sep[p]-6,0,100));return 'Daerah penghasil menikmati rejeki nomplok.';}}]},

 {id:'bab5',t:96,title:'Bab V: Demokrasi Langsung',text:()=>'Januari 2005. Kepala daerah kini dipilih langsung oleh rakyat. Setiap pilkada menjadi pertarungan popularitas dan uang. Mulai bab ini, satu giliran sama dengan satu kuartal dan Anda punya lima aksi per giliran.',ch:()=>[{l:'Lanjutkan',h:'Kuartal demi kuartal menuju 2045.',run(){return 'Bab baru dimulai.';}}]},
 {id:'helsinki',t:103,cond:()=>!G.gone.aceh,title:'Perundingan damai Aceh',text:'Setelah tsunami, juru runding pemerintah dan gerakan bersenjata Aceh bertemu di Eropa. Ada naskah damai di meja: otonomi khusus, partai lokal, dan penarikan pasukan.',
  ch:()=>[{l:playerGov()?'Tandatangani perdamaian':'Dukung perdamaian',h:'Separatisme Aceh turun tajam, TNI sedikit kecewa.',run(){G.sep.aceh=clamp(G.sep.aceh-45,0,100);PBY.aceh.kf=Math.max(.15,PBY.aceh.kf-.3);grpB('tni',-4);kepB(2);bump('legit',3);return 'Senjata diserahkan dan dipotong di lapangan Blang Padang.';}},
   {l:playerGov()?'Tolak, lanjutkan operasi':'Tolak, NKRI harga mati',h:'TNI senang, konflik berlanjut.',run(){grpB('tni',5);G.sep.aceh=clamp(G.sep.aceh+8,0,100);return 'Perundingan buntu. Senjata kembali bicara.';}}]},
 {id:'bbm05',t:105,title:'Harga BBM naik dua kali lipat',text:'Harga minyak dunia menembus rekor. Subsidi BBM menelan sepertiga anggaran negara.',

   :[{l:'Tolak kenaikan bersama buruh',h:'Massa +6, legitimasi +2.',run(){bump('massa',6);bump('legit',2);return 'Bendera partai Anda berkibar di depan istana.';}},{l:'Maklumi, asal ada bantuan tunai',h:'Legitimasi -1.',run(){bump('legit',-1);return 'Sikap Anda dianggap realistis oleh para ekonom.';}}]},
 {id:'gempa06',t:113,cond:()=>!G.gone.diy,title:'Gempa Yogyakarta',text:'Gempa dangkal meruntuhkan ribuan rumah di Bantul dan Klaten. Lebih dari lima ribu orang tewas.',
  ch:()=>[{l:'Kerahkan bantuan besar-besaran',h:playerGov()?'Kas -Rp10 T, kepuasan +3.':'Dana -4, dukungan DIY dan Jawa Tengah naik.',run(){if(playerGov()){G.eco.kas=Math.max(0,G.eco.kas-10);kepB(3);}else{bump('dana',-4);myProv('diy',.2);myProv('jateng',.08);}popAdd('diy',4);return 'Relawan dan tenda berdatangan dari seluruh negeri.';}},{l:'Kirim ucapan duka',h:'Tidak ada biaya.',run(){return 'Warga mencatat siapa yang datang.';}}]},
 {id:'krisis08',t:140,title:'Krisis keuangan global',text:'Bank-bank raksasa di New York runtuh. Bursa Jakarta ditutup sementara setelah anjlok sepuluh persen dalam sehari. Harga batubara dan sawit terjun bebas.',
  data:()=>{G.eco.ihsg*=.62;Object.keys(G.eco.harga).forEach(k=>G.eco.harga[k]*=.65);if(G.kursDyn)G.kursDyn*=1.15;Object.keys(G.saham).forEach(k=>G.saham[k]*=.6);return {};},
  ch:()=>{return playerGov()?[{l:'Stimulus fiskal besar',h:'Kas -Rp25 T, kepuasan +3, pertumbuhan tertahan.',run(){G.eco.kas=Math.max(0,G.eco.kas-25);kepB(3);G.eco.tumbuh+=1;grpB('pengusaha',6);return 'Proyek padat karya dan potongan pajak diumumkan.';}},{l:'Jamin seluruh simpanan bank',h:'Cadangan devisa -10, investor tenang.',run(){G.eco.cadev=Math.max(2,G.eco.cadev-10);grpB('asing',8);grpB('pengusaha',5);return 'Tidak ada rush bank kali ini.';}},{l:'Ketatkan anggaran',h:'Kas aman, kepuasan -4.',run(){kepB(-4);return 'Pemerintah memilih berhemat.';}}]
   :[{l:'Desak stimulus untuk rakyat',h:'Legitimasi +2.',run(){bump('legit',2);return 'Usul Anda dikutip di halaman ekonomi.';}},{l:'Amankan aset pribadi',h:'Dana pribadi tidak ikut tergerus terlalu dalam.',run(){Object.keys(G.me.port).forEach(k=>G.me.port[k]*=1.3);return 'Anda menjual sebagian saham sebelum terlambat.';}}];}},
 {id:'merapi',t:166,cond:()=>!G.gone.diy,title:'Merapi meletus',text:'Awan panas menyapu lereng Merapi. Ratusan ribu warga mengungsi, juru kunci gunung ikut menjadi korban.',ch:()=>[{l:'Bantu pengungsi',h:'Dana -3, dukungan naik.',cost:{dana:0},run(){earn(-3);myProv('diy',.12);myProv('jateng',.08);return 'Dapur umum Anda melayani ribuan pengungsi.';}},{l:'Biarkan pemerintah daerah',h:'Tidak ada biaya.',run(){return 'Abu vulkanik turun sampai Bogor.';}}]},
 {id:'taper',t:196,title:'Modal asing keluar',text:'Bank sentral Amerika mengisyaratkan menaikkan bunga. Dana asing kabur dari pasar negara berkembang, rupiah tertekan.',

 {id:'bab6',t:216,title:'Bab VI: Polarisasi dan Infrastruktur',text:'Januari 2015. Media sosial mengubah cara orang berpolitik. Jalan tol dan bendungan dibangun cepat, perdebatan soal agama dan identitas makin keras.',ch:()=>[{l:'Lanjutkan',h:'Bab baru dimulai.',run(){return 'Bab baru dimulai.';}}]},
 {id:'asap15',t:225,title:'Kabut asap terparah',text:'Kebakaran lahan gambut di Sumatera dan Kalimantan menyelimuti enam negara. Ratusan ribu anak terkena infeksi saluran napas.',
  ch:()=>playerGov()?[{l:'Moratorium izin sawit di gambut',h:'Asing +, pengusaha -, ekspor sawit turun sedikit.',run(){grpB('asing',6);grpB('pengusaha',-6);G.eco.harga.sawit*=.95;kepB(2);return 'Izin baru di lahan gambut dibekukan.';}},{l:'Padamkan saja, tanpa aturan baru',h:'Kepuasan -3.',run(){kepB(-3);return 'Asap pergi bersama hujan, untuk tahun ini.';}}]

   {l:'Bela kebinekaan dan proses hukum',h:'Ulama -12, legitimasi +3, partai nasionalis menguat.',run(){grpB('ulama',-12);bump('legit',3);['pdmp','ppb','pdb'].forEach(i=>{if(G.active.includes(i))G.nat[i]+=.04;});return 'Pernyataan Anda membuat Anda dicap antek oleh sebagian, pahlawan oleh sebagian lain.';}},
   {l:'Diam dan tunggu reda',h:'Tidak ada efek besar.',run(){return 'Anda memilih tidak berkomentar.';}}]},

 {id:'dikorupsi',t:273,cond:()=>!!G.pol.lemahkpk,title:'Reformasi dikorupsi',text:'Mahasiswa dari puluhan kota turun ke jalan menolak revisi undang-undang komisi antikorupsi. Dua mahasiswa tewas di Kendari.',
  ch:()=>[{l:playerGov()?'Batalkan revisi':'Bergabung dengan mahasiswa',h:playerGov()?'Kebijakan dicabut, mahasiswa +12.':'Massa +8, legitimasi +4.',run(){if(playerGov()){repealPolicy('lemahkpk');grpB('mahasiswa',12);}else{bump('massa',8);bump('legit',4);}return 'Jalanan bergemuruh.';}},{l:playerGov()?'Tetap jalan':'Diam',h:playerGov()?'Kepuasan -5, mahasiswa -10.':'Tidak ada efek.',run(){if(playerGov()){kepB(-5);grpB('mahasiswa',-10);}return 'Gelombang protes surut perlahan.';}}]},

  data:()=>{G.pandT=G.t;return {sev:clamp(1.4-(G.apbn.kes-5)*.08,.5,1.8)};},
  ch:d=>{const sev=d?d.sev:1;
   return playerGov()?[{l:'Karantina wilayah ketat',h:'Pertumbuhan anjlok, korban jiwa ditekan.',run(){G.eco.tumbuh-=6;kepB(-4*sev);G.pandSev=sev*.6;return 'Jalan-jalan kota besar sunyi.';}},{l:'Pembatasan sosial sebagian dan bantuan tunai',h:'Kas -Rp30 T, kepuasan tertahan.',run(){G.eco.tumbuh-=4;G.eco.kas=Math.max(0,G.eco.kas-30);kepB(-2*sev);G.pandSev=sev*.8;return 'Pembatasan diberlakukan bertahap, bantuan dikirim ke rumah-rumah.';}},{l:'Ekonomi harus tetap jalan',h:'Pertumbuhan relatif terjaga, korban jiwa tinggi.',run(){G.eco.tumbuh-=2;kepB(-9*sev);G.stab-=5;G.pandSev=sev*1.3;return 'Pemakaman di banyak kota bekerja siang malam.';}}]
   :[{l:'Galang dapur umum dan bantuan',h:'Dana -5, dukungan naik di basis.',run(){earn(-5);myProv(homeProv(),.15);popAdd(homeProv(),6);G.eco.tumbuh-=4;G.pandSev=sev;return 'Relawan berjaket partai mengantar sembako dari pintu ke pintu.';}},{l:'Kritik penanganan pemerintah',h:'Legitimasi +3.',run(){bump('legit',3);G.eco.tumbuh-=4;G.pandSev=sev;return 'Kritik Anda menggema di media sosial.';}}];}},
 {id:'omnibusdemo',t:282,cond:()=>!!G.pol.omnibus,title:'Mogok nasional menolak undang-undang sapu jagat',text:'Serikat buruh menyerukan mogok nasional. Mahasiswa bergabung, beberapa halte dibakar.',
  ch:()=>[{l:playerGov()?'Buka dialog dan revisi pasal pesangon':'Bergabung dengan buruh',h:'Buruh +10.',run(){grpB('buruh',10);if(!playerGov())bump('massa',8);return 'Tuntutan buruh sebagian diakomodasi.';}},{l:playerGov()?'Tetap berlaku, kerahkan aparat':'Diam',h:playerGov()?'Suhu turun, HAM naik.':'Tidak ada efek.',run(){if(playerGov()){G.suhu-=6;G.ham+=6;grpB('buruh',-8);}return 'Aksi dibubarkan dengan gas air mata.';}}]},

  ch:()=>playerGov()?[{l:'Naikkan harga, tambah bantuan sosial',h:'Kas +Rp15 T, kepuasan -3.',run(){G.eco.kas+=15;kepB(-3);G.apbn.bansos=Math.min(60,G.apbn.bansos+1);return 'Bantuan langsung tunai dibagikan lagi.';}},{l:'Tahan harga',h:'Kas -Rp25 T.',run(){G.eco.kas=Math.max(0,G.eco.kas-25);kepB(2);return 'Defisit membengkak.';}}]:[{l:'Tolak kenaikan',h:'Massa +5.',run(){bump('massa',5);return 'Spanduk penolakan dibentangkan.';}},{l:'Diam',h:'Tidak ada efek.',run(){return 'Harga naik juga.';}}]},
 {id:'bab7',t:336,title:'Bab VII: Menuju Indonesia Emas',text:()=>'Januari 2025. Dua puluh tahun lagi Indonesia berusia seratus tahun. Target besarnya: menjadi negara berpendapatan tinggi. PDB per kapita saat ini sekitar US$'+fmt(pdbKapita())+'. Bonus demografi, kecerdasan buatan, krisis iklim, dan persaingan kekuatan besar akan menguji setiap keputusan.',ch:()=>[{l:'Lanjutkan',h:'Bab terakhir.',run(){return 'Hitung mundur menuju 2045 dimulai.';}}]},

const EBY={};EVENTS.forEach(e=>EBY[e.id]=e);
function reformasi(){const old=G.form,ren={pdi:'pdmp',gol:'golb'}[old];
  if(ren){G.form=ren;G.eff[ren]=Object.assign({},G.eff[old]);G.struct[ren]=Object.assign({},G.struct[old]);G.nat[ren]=G.nat[old]||0;}
  if(G.seats){const S={};Object.keys(G.seats).forEach(k=>{const nk=k==='gol'?'golb':k==='pdi'?'pdmp':k;S[nk]=(S[nk]||0)+G.seats[k];});G.seats=S;}
  G.blok={golb:'pem',tni:'pem'};
  G.era='ref';G.rezim=0;shiftArah({kuasa:-30,pusat:-10});calibrate();addLog('21 Mei 1998. Presiden '+PRESIDEN+' berhenti. Wakil presiden Prof. Ir. Darmawan Kusnadi dilantik.',true);}

function hemicycle(list,label){
  const N=list.reduce((a,b)=>a+b.n,0);if(!N)return '';
  const rows=clamp(Math.round(Math.sqrt(N/5.5)),3,12),r0=.4;const radii=[...Array(rows)].map((_,i)=>r0+(1-r0)*i/(rows-1));const sr=radii.reduce((a,b)=>a+b,0);
  const cnt=radii.map(r=>Math.floor(N*r/sr));let rem=N-cnt.reduce((a,b)=>a+b,0);for(let i=rows-1;rem>0;i=(i-1+rows)%rows){cnt[i]++;rem--;}
  const pts=[];radii.forEach((r,i)=>{const n=cnt[i];for(let j=0;j<n;j++)pts.push({th:n===1?Math.PI/2:Math.PI*(1-j/(n-1)),r});});pts.sort((a,b)=>b.th-a.th||a.r-b.r);
  const dr=Math.min((1-r0)/(rows-1),Math.PI*r0/Math.max(1,cnt[0]-1))*.43;let k=0;
  let s=`<svg class="hemi" viewBox="-1.05 -1.05 2.1 1.12" role="img" aria-label="${esc(label||'Komposisi kursi')}: ${list.map(p=>p.name+' '+p.n).join(', ')}">`;
  list.forEach(p=>{for(let m=0;m<p.n;m++){const q=pts[k++];s+=`<circle cx="${(q.r*Math.cos(q.th)).toFixed(3)}" cy="${(-q.r*Math.sin(q.th)).toFixed(3)}" r="${dr.toFixed(3)}" fill="${p.col}"/>`;}});
  return s+`<text x="0" y="-.03" text-anchor="middle" class="hemin">${N}</text></svg>`;
}

  if(U.mprRes&&!U.mprRes.npc){const R=U.mprRes;return `<div class="veil"><div class="modal wide">${head}<div class="mb"><h2>${R.win?esc(leader().name)+' terpilih':'Anda kalah di MPR'}</h2><div class="tally"><div><span class="small">Suara Anda</span><span class="v">${R.T.me}</span></div><div><span class="small">Suara ${esc(FORMS[R.T.rival].abbr)}</span><span class="v">${R.T.rv}</span></div><div><span class="small">Abstain</span><span class="v">${R.T.ab}</span></div></div><p class="story">${R.win?'Palu diketuk. Anda kini presiden, dan kekuasaan harus segera dikonsolidasikan: tuntaskan tiga keputusan besar sebelum lawan sempat menyusun ulang barisan.':(q.si?'Kesempatan kedua lewat. Sejarah berjalan tanpa Anda sampai akhir 2001.':'Koalisi lawan lebih rapat. Anda masih punya kursi di DPR, dan mungkin satu kesempatan lagi bila pemerintah baru goyah.')}</p><button class="btn primary" data-a="mprdone">Lanjut</button></div></div></div>`;}
  let rows='';Object.keys(F).sort((a,b)=>F[b]-F[a]).forEach(i=>{if(i===G.form)return;const name=i==='tni'?'Fraksi TNI/Polri':FORMS[i].name;const abbr=i==='tni'?'TNI':FORMS[i].abbr;const col=i==='tni'?'#5E6B2E':FORMS[i].col;

      if(s==='tolak'){st='<span class="st no">menolak</span>';ctl='<span class="tiny muted">Haluan terlalu jauh</span>';}

    rows+=`<div class="prow"><span class="nm"><span class="dot" style="--pc:${col}"></span>${esc(abbr)} <span class="small muted">${F[i]} kursi</span> ${st}</span>${ctl}</div>`;});
  return `<div class="veil"><div class="modal wide">${head}<div class="mb"><h2>${q.si?'Kesempatan kedua':'Memilih presiden'}</h2><p class="story">${q.si?'Presiden '+esc(G.npcPres?G.npcPres.name:'')+' digoyang skandal dan ditinggal koalisinya. MPR menggelar Sidang Istimewa. Harga dukungan lebih murah kali ini.':'Tujuh ratus anggota MPR akan memilih presiden, dan Anda butuh suara mayoritas mutlak. Tawarkan kursi menteri kepada fraksi yang bersedia. Fraksi yang lebih besar dari Anda, atau yang lebih dekat dengan calon lawan, minta harga lebih tinggi. Kursi wakil presiden bisa diberikan kepada satu fraksi dan bernilai '+WAPRES+' menteri.'}</p>
   <div class="tally"><div><span class="small">${esc(FORMS[G.form].abbr)} dan kawan (butuh ${mprNeed(F)})</span><span class="v" style="color:${T.me>=mprNeed(F)?'var(--good)':'var(--ink)'}">${T.me}</span></div><div><span class="small">Kubu ${esc(FORMS[T.rival].abbr)}</span><span class="v">${T.rv}</span></div><div><span class="small">Kursi menteri tersisa</span><span class="v">${POOL-used}</span></div></div>${T.moved?`<p class="small">${T.moved} suara lawan sudah Anda beli.</p>`:''}
   <div class="plist">${rows}</div><button class="btn red big" data-a="vote">Mulai pemungutan suara</button></div></div></div>`;
}

const PTR=new Map();let DRAG=null,PINCH=null,RAF=0;
function svgPt(s,cx,cy){const r=s.getBoundingClientRect();return [U.vb[0]+(cx-r.left)/r.width*U.vb[2],U.vb[1]+(cy-r.top)/r.height*U.vb[3],r];}
function schedule(){if(RAF)return;RAF=requestAnimationFrame(()=>{RAF=0;applyVb();});}
document.addEventListener('wheel',e=>{const s=e.target.closest&&e.target.closest('.mapsvg');if(!s||!G)return;e.preventDefault();vbAnim++;const [px,py]=svgPt(s,e.clientX,e.clientY);const f=Math.exp(clamp(e.deltaY,-120,120)*(e.deltaMode===1?.05:.0016));U.vb=zoomBy(f,px,py);schedule();},{passive:false});
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('.mapsvg');if(!s)return;U.dragged=false;vbAnim++;PTR.set(e.pointerId,[e.clientX,e.clientY]);
  if(PTR.size===1)DRAG={x:e.clientX,y:e.clientY,vb:U.vb.slice(),s,moved:false};
  else if(PTR.size===2){const [a,b]=[...PTR.values()];PINCH={d:Math.hypot(a[0]-b[0],a[1]-b[1]),vb:U.vb.slice(),m:svgPt(s,(a[0]+b[0])/2,(a[1]+b[1])/2),s};DRAG=null;}});
document.addEventListener('pointermove',e=>{if(!PTR.has(e.pointerId))return;PTR.set(e.pointerId,[e.clientX,e.clientY]);
  if(PINCH&&PTR.size>=2){const [a,b]=[...PTR.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const [px,py]=PINCH.m;const nw=clamp(PINCH.vb[2]*PINCH.d/Math.max(10,d),70,MAPB[2]*1.15),k=nw/PINCH.vb[2];U.vb=clampVb([px-(px-PINCH.vb[0])*k,py-(py-PINCH.vb[1])*k,nw,nw/ASP]);U.dragged=true;schedule();return;}
  if(DRAG){const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;if(!DRAG.moved&&Math.abs(dx)+Math.abs(dy)>6)DRAG.moved=true;if(!DRAG.moved)return;const r=DRAG.s.getBoundingClientRect();const sc=DRAG.vb[2]/r.width;U.vb=clampVb([DRAG.vb[0]-dx*sc,DRAG.vb[1]-dy*sc,DRAG.vb[2],DRAG.vb[3]]);U.dragged=true;schedule();}});
const ptrEnd=e=>{if(!PTR.has(e.pointerId))return;PTR.delete(e.pointerId);if(PTR.size<2)PINCH=null;if(PTR.size===0){if(DRAG&&!DRAG.moved&&!U.dragged)U.dragged=false;DRAG=null;setTimeout(()=>{U.dragged=false;},60);}};
document.addEventListener('pointerup',ptrEnd);document.addEventListener('pointercancel',ptrEnd);
document.addEventListener('keydown',e=>{if(!G||U.screen!=='game'||G.queue.length)return;if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(e.key==='+'||e.key==='='){animVb(zoomBy(.6));}else if(e.key==='-'){animVb(zoomBy(1/.6));}else if(e.key==='0'){animVb(presetVb('all'));}});

   <div class="trow"><span class="ap" aria-label="Sisa aksi ${G.ap} dari ${G.apMax}">${[...Array(G.apMax)].map((_,i)=>`<i class="${i<G.ap?'on':''}"></i>`).join('')}</span><span class="tctl"><button class="tp" data-a="play" aria-pressed="${!!U.play}" aria-label="${U.play?'Jeda':'Jalankan waktu'}" title="${U.play?'Jeda (spasi)':'Jalankan waktu (spasi)'}">${U.play?'<svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>':'<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>'}</button>${[1,2,3].map(s=>`<button class="spd" data-a="speed" data-s="${s}" aria-pressed="${U.speed===s}" aria-label="Kecepatan ${s}" title="Kecepatan ${s}">${'›'.repeat(s)}</button>`).join('')}</span><button class="go" data-a="end"${G.queue.length||U.play?' disabled':''}>Lanjutkan</button></div>`;
}
function zoomHtml(){return `<button data-a="zin" aria-label="Perbesar">+</button><span id="zlvl">${Math.round(presetVb('all')[2]/U.vb[2]*100)}%</span><button data-a="zout" aria-label="Perkecil">−</button><button data-a="zreset" aria-label="Seluruh Indonesia" title="Seluruh Indonesia">⌂</button>`;}
function toastHtml(){return U.toasts.map(t=>`<div class="toast${t.out?' out':''}">${esc(t.msg)}</div>`).join('');}
function flash(m){if(!m)return;U.flash=m;const t={msg:m,id:Math.random()};U.toasts.push(t);if(U.toasts.length>3)U.toasts.shift();setTimeout(()=>{t.out=true;const b=$('toasts');if(b)b.innerHTML=toastHtml();setTimeout(()=>{U.toasts=U.toasts.filter(x=>x!==t);const b2=$('toasts');if(b2)b2.innerHTML=toastHtml();},450);},4200);}
function skeleton(){return `<div id="game"><div id="mapbox">${buildMap()}</div><header id="hud"></header><nav id="rail" aria-label="Menu"></nav>
 <aside id="panel"><div class="ph"><h2 id="ptitle"></h2><button class="px" data-a="closepanel" aria-label="Tutup panel">×</button></div><div id="pbody"></div></aside>
 <div id="mapctl"></div><div id="zoomctl"></div><section id="pcard" aria-label="Info provinsi"></section><div id="turn"></div><div id="toasts" role="status" aria-live="polite"></div><div id="modalbox"></div></div>`;}
function render(){
  const root=$('app');
  if(U.screen==='game'&&G&&G.ended)U.screen='end';
  if(U.screen!=='game'){document.body.classList.remove('ingame');root.innerHTML=U.screen==='setup'?setupHtml():endHtml();if(U.screen==='setup')U.animated=true;
    if(U.screen==='end'&&!canContinue())clearSave();else if(U.screen==='end'&&G)save();
    const as=$('asalsel');if(as)as.onchange=()=>{U.asal=as.value||null;render();};const pn=$('pname');if(pn)pn.oninput=()=>{U.name=pn.value;};return;}
  document.body.classList.add('ingame');
  if($('game')&&U.builtMap===false){$('mapbox').innerHTML=buildMap();U.builtMap=true;requestAnimationFrame(()=>{applyVb();});}
  if(!$('game')){root.innerHTML=skeleton();U.builtMap=true;if(U.panel)$('game').classList.add('popen');requestAnimationFrame(()=>{ASP=0;syncAspect();U.vb=clampVb(presetVb('all'));applyVb();});}
  updateMap();
  $('hud').innerHTML=hudHtml();tweenHud();document.documentElement.style.setProperty('--hudh',$('hud').offsetHeight+'px');$('rail').innerHTML=railHtml();
  const pn=$('panel');const was=$('game').classList.contains('popen');pn.classList.toggle('open',!!U.panel);$('game').classList.toggle('popen',!!U.panel);
  if(was!==!!U.panel){const c=[U.vb[0]+U.vb[2]/2,U.vb[1]+U.vb[3]/2],w=U.vb[2],aid=vbAnim;setTimeout(()=>{if(aid!==vbAnim){syncAspect();applyVb();return;}syncAspect();const h=w/ASP;U.vb=clampVb([c[0]-w/2,c[1]-h/2,w,h]);applyVb();},420);}
  if(U.panel){const pb=$('pbody');const st=pb.scrollTop;const same=U._lastTab===U.tab;$('ptitle').textContent=(TABS.find(x=>x[0]===U.tab)||['',''])[1];pb.innerHTML=same?tabBody():`<div class="pbody-in">${tabBody()}</div>`;if(same)pb.scrollTop=st;U._lastTab=U.tab;}
  $('pcard').innerHTML=pcardHtml();$('mapctl').innerHTML=mapctlHtml();$('turn').innerHTML=turnHtml();$('zoomctl').innerHTML=zoomHtml();$('toasts').innerHTML=toastHtml();
  const ps=$('psel');if(ps)ps.onchange=()=>{U.prov=ps.value;render();};
  const mh=modalHtml();const mb=$('modalbox');const key=G.queue[0]?G.queue[0].type+(G.queue[0].id||'')+G.t+G.queue.length:'';
  mb.innerHTML=mh;const md=mb.querySelector('.modal');if(md&&key!==U.mkey){md.classList.add('enter');const vl=mb.querySelector('.veil');if(vl)vl.classList.add('enter');const b=md.querySelector('button:not([disabled])');if(b)b.focus();}U.mkey=md?key:'';
  save();
}
/* ---------- angka bergulir dan waktu berjalan ---------- */
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function parseNum(s){const neg=s.trim().startsWith('-')||s.trim().startsWith('−');const c=s.replace(/[^\d,]/g,'').replace(',','.');const v=parseFloat(c);return isNaN(v)?null:(neg?-v:v);}
function fmtLike(sample,v){const dec=/,\d/.test(sample);const s=dec?Math.abs(v).toFixed(1).replace('.',','):Math.round(Math.abs(v)).toLocaleString('id-ID');return (v<0?'-':sample.trim().startsWith('+')?'+':'')+s;}
function tweenHud(){if(!U.hudPrev)U.hudPrev={};document.querySelectorAll('#hud .hs').forEach(el=>{const kE=el.querySelector('.k'),vE=el.querySelector('.v');if(!kE||!vE)return;const k=kE.textContent,txt=vE.textContent;const m=txt.match(/[+\-−]?\d[\d.,]*/);if(!m)return;const nv=parseNum(m[0]);const ov=U.hudPrev[k];U.hudPrev[k]=nv;if(ov==null||nv==null||ov===nv||RM())return;
  const t0=performance.now(),dur=520;vE.classList.add(nv>ov?'up':'down');const step=n=>{const q=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-q,3);if(!vE.isConnected)return;vE.textContent=txt.replace(m[0],fmtLike(m[0],ov+(nv-ov)*e));if(q<1)requestAnimationFrame(step);else{vE.textContent=txt;setTimeout(()=>vE.classList.remove('up','down'),500);}};requestAnimationFrame(step);});}
const SPEEDMS={1:1700,2:900,3:420};
function tick(){clearTimeout(U.tmr);if(!U.play)return;U.tmr=setTimeout(()=>{if(!U.play||!G||U.screen!=='game')return;if(G.ended){U.play=false;render();return;}
  if(!G.queue.length){endTurn();render();}tick();},SPEEDMS[U.speed||1]);}
document.addEventListener('keydown',e=>{if(e.code!=='Space'||!G||U.screen!=='game')return;if(e.target.closest&&e.target.closest('input,select,textarea,button'))return;e.preventDefault();U.play=!U.play;if(!U.speed)U.speed=1;render();tick();});
/* ---------- tab negara: kepuasan, kelompok, kebijakan ---------- */
function sparkArr(arr,col){if(arr.length<3)return '';const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${arr.map((v,i)=>`${(i/(arr.length-1)*100).toFixed(1)},${(28-(v-mn)/r*26).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;}
function tabNegara(){
  const gov=FORMS[govParty()];let h=`<div class="bigk"><div><span class="small">Kepuasan rakyat</span><b class="${G.kep<35?'bad':G.kep>60?'good':''}">${Math.round(G.kep)}</b></div>${sparkArr(G.kephist.slice(-40).map(x=>x.v),'var(--gold)')}</div>`;
  h+=`<p class="small muted">Kepuasan menentukan suara partai pemerintah, suhu jalanan, stabilitas, dan risiko penggulingan. Pemerintahan saat ini: <b>${esc(playerGov()?'Anda':gov.abbr+(G.npcPres?', presiden '+G.npcPres.name:''))}</b>.</p>`;
  h+=`<div class="sect"><span>Kelompok kepentingan</span><span class="small muted">dukungan terhadap pemerintah</span></div><div class="grps">${GROUPS.map(([k,n])=>{const v=Math.round(G.grp[k]);return `<div><span>${esc(n)}</span><i><b style="width:${v}%;background:${v<30?'var(--bad)':v>65?'var(--good)':'var(--gold)'}"></b></i><em>${v}</em></div>`;}).join('')}</div>`;
  h+=`<p class="tiny muted">Di bawah 30, TNI membuka risiko kudeta, mahasiswa dan buruh turun ke jalan, pengusaha dan investor asing menahan modal, kepala daerah menuntut lepas. Setiap kebijakan menggeser kelompok-kelompok ini.</p>`;
  return h+tabKebijakan();
}
/* ---------- tab ekonomi lengkap ---------- */
